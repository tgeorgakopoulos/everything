  setTimeout(function(){ q("#e-title").focus() },40);
}
function close(){
  scrim.classList.remove("on"); S.editing=null; editorApply=null;
  flushPending();          // rows that arrived while this note was open
}

/* Dismissing an open note SAVES it. Losing a page of writing because a
   selection drag ended outside the sheet, or because Escape felt like
   "close", is not a trade worth making. Cancel is the explicit discard. */
var editorApply=null;
function dismissEditor(){ if(editorApply) editorApply(); else close() }

/* A click fires on the nearest common ancestor of press and release — so
   selecting text and releasing outside the sheet used to register as a click
   on the backdrop, and shut the note. Only treat it as a backdrop click if
   the press started there too. */
var pressedBackdrop=false;
scrim.addEventListener("mousedown",function(e){ pressedBackdrop=(e.target===scrim) });
scrim.addEventListener("click",function(e){
  if(e.target===scrim&&pressedBackdrop) dismissEditor();
  pressedBackdrop=false;
});

/* Photo edits inside the editor. These live outside openEditor so their
   listeners are registered exactly once — registering them per-open was
   what caused one dropped image to land in every note opened that session. */
function editingItem(){ return S.editing?byId(S.editing):null }
function repaintGallery(){
  var it=editingItem(), g=document.getElementById("e-gal");
  if(it&&g) g.innerHTML=photoGrid(it,true);
}
function addPhotosToEditing(photos){
  var it=editingItem();
  if(!it||!photos.length) return;
  it.photos=(it.photos||[]).concat(photos);
  it.modified=Date.now();
  save(); repaintGallery(); render();
  toast(photos.length+" image"+(photos.length>1?"s":"")+" added");
}
sheet.addEventListener("click",function(e){
  var rm=e.target.closest("[data-rmimg]");
  if(rm){
    e.preventDefault(); e.stopPropagation();
    var it=editingItem(); if(!it||!it.photos) return;
    it.photos.splice(+rm.dataset.rmimg,1);
    save(); repaintGallery(); render();
    return;
  }
  // A link inside the editable body would otherwise just place the caret.
  // Clicking one should go where it points, as it does everywhere else.
  var a=e.target.closest(".ebody a[href]");
  if(a){
    e.preventDefault(); e.stopPropagation();
    var href=a.getAttribute("href")||"";
    if(SAFE_HREF.test(href)) window.open(href,"_blank","noopener,noreferrer");
    return;
  }
  // inside the open note, a photo zooms
  var ph=e.target.closest("[data-photo]");
  if(ph){ e.stopPropagation(); openLight(ph.dataset.photo,+ph.dataset.idx) }
});
sheet.addEventListener("dragover",function(e){
  if(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],"Files")>=0) e.preventDefault();
});
sheet.addEventListener("drop",function(e){
  if(internalDrag) return;
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length) return;
  e.preventDefault(); e.stopPropagation();
  /* stopPropagation is what this handler wants — and it also stopped the
     window listener that clears the drop hint, so "Add to this note" sat at
     the bottom of the screen until the page was reloaded. Anything that
     swallows a drop has to tidy up after itself. */
  endDrag();
  takeFiles(e.dataTransfer.files,function(photos){ addPhotosToEditing(photos) });
});

/* ⌘V with an image on the clipboard adds it to the open note.
   Bound to the document rather than the sheet because a paste fires at
   whatever holds focus, and with a note open that might be the body, the
   title, a checklist row, or nothing at all — but it always means the same
   thing. Registered once, at the top level: attaching this inside openEditor
   is what made a single dropped image land in every note opened that session.
   Text pastes fall straight through to the body's own plain-text handler. */
document.addEventListener("paste",function(e){
  if(!S.editing) return;
  var imgs=imageFilesFrom(e.clipboardData);
  if(!imgs.length) return;
  e.preventDefault(); e.stopPropagation();
  takeFiles(imgs,function(photos){ addPhotosToEditing(photos) });
},true);

/* =========================================================================
   IMAGE INPUT — file picker, drag & drop, paste, lightbox
   ========================================================================= */
function byId(id){ return S.items.filter(function(x){ return x.id===id })[0] }

var filepick=document.getElementById("filepick"), pickCB=null;
function pickFiles(cb){ pickCB=cb; filepick.value=""; filepick.click() }
filepick.addEventListener("change",function(){
  if(!filepick.files||!filepick.files.length) return;
  var cb=pickCB; pickCB=null;
  takeFiles(filepick.files,function(photos){ if(cb) cb(photos) });
});

/* ---- drag & drop ------------------------------------------------------
   Two rules keep this predictable:
   1. Exactly one handler processes a drop, guarded by a lock, so a single
      file can never be added twice.
   2. Drops only count inside the board or the open editor. Everywhere else
      is inert, and the hint pill says so before you let go.
   --------------------------------------------------------------------- */
var veil=document.getElementById("dropveil"), hotCard=null, dropBusy=false;

/* Two completely separate drags share this app: rearranging your own cards,
   and importing image files from outside. internalDrag keeps them apart —
   without it, dragging a card's photo looks exactly like dropping a file. */
var dragId=null, internalDrag=false;

function hasFiles(e){
  if(internalDrag) return false;
  return !!(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],"Files")>=0);
}

var dropline=document.getElementById("dropline");

function clearMarks(){
  board.querySelectorAll(".dropbefore,.dropafter").forEach(function(el){
    el.classList.remove("dropbefore","dropafter");
  });
}
function hideLine(){ dropline.classList.remove("on") }

// Draw the insertion line into the gap that just opened, in viewport coords.
function showLine(el,after,horiz){
  var r=el.getBoundingClientRect(), s=dropline.style;
  dropline.className="dropline on "+(horiz?"vert":"horiz");
  if(horiz){                                  // cards sit side by side → upright bar
    s.left=((after?r.right+14:r.left-18))+"px";
    s.top=(r.top+8)+"px";
    s.width="4px";
    s.height=Math.max(24,r.height-16)+"px";
  } else {                                    // stacked → bar lying across
    s.left=(r.left+2)+"px";
    s.top=((after?r.bottom+20:r.top-24))+"px";
    s.width=Math.max(40,r.width-4)+"px";
    s.height="4px";
  }
}
/* Marking a target opens the gap, which moves the target — so the line is
   placed once immediately (so it responds at once) and again once the gap
   has finished opening. Its own CSS transition turns the correction into a
   glide rather than a jump. */
var lineTimer;
function markTarget(el,after,horiz){
  clearMarks();
  el.classList.add(after?"dropafter":"dropbefore");
  showLine(el,after,horiz);
  clearTimeout(lineTimer);
  lineTimer=setTimeout(function(){
    if(internalDrag&&el.parentNode) showLine(el,after,horiz);
  },210);
}

function endReorder(){
  clearTimeout(lineTimer);
  clearMarks(); hideLine();
  board.querySelectorAll(".dragging").forEach(function(el){ el.classList.remove("dragging") });
  internalDrag=false; dragId=null;
}
function moveItem(id,targetId,after){
  if(!id||!targetId||id===targetId) return;
  var from=-1,to=-1,k;
  for(k=0;k<S.items.length;k++) if(S.items[k].id===id) from=k;
  if(from<0) return;
  var it=S.items.splice(from,1)[0];
  for(k=0;k<S.items.length;k++) if(S.items[k].id===targetId) to=k;
  if(to<0) S.items.unshift(it); else S.items.splice(after?to+1:to,0,it);
  save(); render();
}

board.addEventListener("dragstart",function(e){
  var el=e.target.closest(".card,.row-item");
  if(!el||!canReorder()){ e.preventDefault(); return }
  internalDrag=true; dragId=el.dataset.id;
  el.classList.add("dragging");
  try{
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("application/x-trove-item",dragId);
    e.dataTransfer.setData("text/plain","");     // Firefox refuses an empty payload
  }catch(err){}
});
board.addEventListener("dragover",function(e){
  if(!internalDrag) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect="move" }catch(err){}

  var el=e.target.closest(".card,.row-item");
  // Drifting over a gap between cards keeps the last target rather than
  // flickering the indicator off — the aim stays where you last pointed it.
  if(!el||el.dataset.id===dragId) return;

  var r=el.getBoundingClientRect();
  var horiz=(layoutFor()==="cards");
  var after = horiz ? e.clientX>r.left+r.width/2 : e.clientY>r.top+r.height/2;
  if(el.classList.contains(after?"dropafter":"dropbefore")) return;  // no change
  markTarget(el,after,horiz);
});
board.addEventListener("drop",function(e){
  if(!internalDrag) return;
  e.preventDefault(); e.stopPropagation();
  var mark=board.querySelector(".dropbefore,.dropafter");
  if(mark) moveItem(dragId,mark.dataset.id,mark.classList.contains("dropafter"));
  endReorder();
});
board.addEventListener("dragend",endReorder);
function clearHot(){ if(hotCard){ hotCard.classList.remove("dropping"); hotCard=null } }
function endDrag(){
  clearHot();
  veil.classList.remove("on","no");
  board.classList.remove("armed");
}
// One funnel for every image import. The lock closes the door until the
// current batch has finished decoding.
function takeFiles(files,cb){
  if(dropBusy) return;
  dropBusy=true;
  readImages(files).then(function(photos){
    dropBusy=false;
    if(photos.length) cb(photos);
  },function(){ dropBusy=false });
}
function zoneAt(x,y){
  var el=document.elementFromPoint(x,y);
  if(!el||!el.closest) return {zone:"none"};
  if(el.closest("#sheet")) return {zone:"editor"};
  if(scrim.classList.contains("on")) return {zone:"none"};
  var card=el.closest(".card,.row-item");
  if(card) return {zone:"card",card:card};
  if(el.closest("#board")||el.closest(".capwrap")) return {zone:"board"};
  return {zone:"none"};
}

window.addEventListener("dragover",function(e){
  if(!hasFiles(e)) return;
  var z=zoneAt(e.clientX,e.clientY);
  if(z.zone==="none"){
    e.dataTransfer.dropEffect="none";
    clearHot(); board.classList.remove("armed");
    veil.textContent="Drop over a note or the board";
    veil.classList.add("on","no");
    return;
  }
  e.preventDefault();
  e.dataTransfer.dropEffect="copy";
  veil.classList.remove("no");
  veil.classList.add("on");
  if(z.zone==="card"){
    if(z.card!==hotCard){ clearHot(); hotCard=z.card; hotCard.classList.add("dropping") }
    board.classList.remove("armed");
    veil.textContent="Add to this note";
  } else {
    clearHot();
    if(z.zone==="board"){ board.classList.add("armed"); veil.textContent="Drop to create a new note" }
    else { board.classList.remove("armed"); veil.textContent="Add to this note" }
  }
});
window.addEventListener("dragleave",function(e){
  // only when the pointer actually leaves the window
  if(e.clientX<=0&&e.clientY<=0) endDrag();
});
window.addEventListener("dragend",endDrag);
/* Capture phase, so it runs before any handler that might stop the event.
   A hint left on screen is worse than a drop that does nothing. */
window.addEventListener("drop",function(){ setTimeout(endDrag,0) },true);
window.addEventListener("drop",function(e){
  if(internalDrag){ endDrag(); return }        // rearranging, not importing
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length){ endDrag(); return }
  var z=zoneAt(e.clientX,e.clientY), target=hotCard;
  endDrag();
  if(z.zone==="editor") return;          // the sheet's own handler takes it
  e.preventDefault();
  if(z.zone==="none") return;            // outside the board: ignore entirely
  takeFiles(e.dataTransfer.files,function(photos){
    var item=(z.zone==="card"&&(target||z.card))?byId((target||z.card).dataset.id):null;
    if(item) attachTo(item,photos); else newItemWithPhotos(photos);
  });
});

// paste an image while the capture box has focus
capin.addEventListener("paste",function(e){
  var files=imageFilesFrom(e.clipboardData);
  if(!files.length) return;
  e.preventDefault();
  takeFiles(files,function(photos){
    var text=capin.value.trim();
    if(text){                              // pasted alongside typed text → one item
      var p=parse(capin.value), now=Date.now(), act=capActionable(p), sh=shapeCapture(p,act);
      S.items.unshift({id:uid(),title:sh.title,body:sh.body,url:p.url,image:"",desc:"",logo:"",site:"",
        metaState:null,titleAuto:p.titleAuto,actionable:act,due:p.due,timed:!!p.timed,done:false,
        tint:"",tags:p.tags,photos:photos,checks:sh.checks,archived:false,pin:false,created:now,modified:now});
      capin.value=""; capForce=null; refreshCap(); followItem(S.items[0]); save(); render();
      toast("Saved with "+photos.length+" image"+(photos.length>1?"s":""));
    } else newItemWithPhotos(photos);
  });
});

var light=document.getElementById("light"), lightimg=document.getElementById("lightimg"),
    lightnav=document.getElementById("lightnav"), lightSet=[], lightIx=0;
function openLight(id,ix){
  var it=byId(id); if(!it||!hasPhotos(it)) return;
  lightSet=it.photos; lightIx=ix||0; light.classList.add("on"); paintLight();
}
function paintLight(){
  lightimg.src=lightSet[lightIx].src;
  lightnav.innerHTML = lightSet.length>1
    ? '<button data-step="-1">‹</button><span>'+(lightIx+1)+' / '+lightSet.length
      +'</span><button data-step="1">›</button>' : "";
}
function stepLight(d){ lightIx=(lightIx+d+lightSet.length)%lightSet.length; paintLight() }
light.addEventListener("click",function(e){
  var s=e.target.closest("[data-step]");
  if(s){ stepLight(+s.dataset.step); return }
  light.classList.remove("on");
});

/* =========================================================================
   EVENTS
   ========================================================================= */

board.addEventListener("click",function(e){
  // a link written inside a note goes where it points, not to the editor
  var inline=e.target.closest(".cbody a[href],.rexc a[href]");
  if(inline){ e.stopPropagation(); return }

  // Photos on a card are part of the card. Clicking one opens the note,
  // like clicking anywhere else on it. Zooming happens inside the note.
  var op=e.target.closest("[data-open]");
  if(op){
    e.stopPropagation();
    var oi=byId(op.dataset.open);
    if(oi&&oi.url) window.open(oi.url,"_blank","noopener,noreferrer");
    return;
  }

  var ai=e.target.closest("[data-addimg]");
  if(ai){
    e.stopPropagation();
    var target=byId(ai.dataset.addimg);
    pickFiles(function(photos){ if(target) attachTo(target,photos) });
    return;
  }

  var rf=e.target.closest("[data-refetch]");
  if(rf){
    e.stopPropagation();
    var r=byId(rf.dataset.refetch);
    if(r){
      // wipe what we guessed so every source gets a clean run
      r.image=""; r.desc=""; r.logo=""; r.site=""; r.metaState=null;
      fetchMeta(r,true);
    }
    return;
  }

  var pb=e.target.closest("[data-post]");
  if(pb){
    e.stopPropagation();
    var pit=byId(pb.dataset.post);
    if(!pit) return;
    // already published: edit the post, not the note it came from
    var live=pit.postId&&POSTS.list.filter(function(x){ return x.id===pit.postId })[0];
    openComposer(live?draftFromPost(live):draftFromItem(pit));
    return;
  }

  var pn=e.target.closest("[data-pin]");
  if(pn){ e.stopPropagation(); var p=byId(pn.dataset.pin); if(p){ p.pin=!p.pin; save(); render() } return }

  var ac=e.target.closest("[data-act]");
  if(ac){
    e.stopPropagation();
    var a=byId(ac.dataset.act);
    if(a){
      a.actionable=!a.actionable;
      if(!a.actionable){ a.due=null; a.done=false }
      save(); render();
      toast(a.actionable?"Now a task too":"Checkbox removed");
    }
    return;
  }

  var chk=e.target.closest("[data-check]");
  if(chk){
    e.stopPropagation();
    var c=byId(chk.dataset.check);
    if(c){ c.done=!c.done; c.completedAt=c.done?Date.now():null; save(); render(); if(c.done) toast("Nice.") }
    return;
  }

  // ticking a checklist item straight from the card
  var ck=e.target.closest("[data-ck]");
  if(ck){
    e.stopPropagation();
    var parts=ck.dataset.ck.split("|"), ci=byId(parts[0]);
    if(ci&&ci.checks&&ci.checks[+parts[1]]){
      var c=ci.checks[+parts[1]];
      c.d=!c.d; ci.modified=Date.now();
      save(); render();
    }
    return;
  }

  var au=e.target.closest("[data-auto]");
  if(au){ e.stopPropagation(); S.view=au.dataset.auto; S.tag=null; S.sel={}; render(); return }

  var pk=e.target.closest("[data-pick]");
  if(pk){ e.stopPropagation(); togglePick(pk.dataset.pick); return }

  var row=e.target.closest(".card,.row-item");
  if(!row) return;
  // while a selection is live, clicking adds to it rather than opening
  if(selCount()) togglePick(row.dataset.id); else openEditor(row.dataset.id);
});

/* ---- multi-select ----------------------------------------------------
   The tick appears on hover. Once anything is picked, a plain click on a
   card adds to the selection instead of opening it — so you can rattle
   through a page without aiming at small targets. Esc clears.
   --------------------------------------------------------------------- */
var selbar=document.getElementById("selbar"), selcnt=document.getElementById("selcnt");
function selIds(){ return Object.keys(S.sel) }
function selCount(){ return selIds().length }
function paintSel(){
  var n=selCount();
  selbar.classList.toggle("on",n>0);
  document.body.classList.toggle("selecting",n>0);
  selcnt.textContent=n+" selected";
}
function togglePick(id){
  if(S.sel[id]) delete S.sel[id]; else S.sel[id]=1;
  render();
}
function clearSel(){ S.sel={}; render() }

selbar.addEventListener("click",function(e){
  var b=e.target.closest("[data-sel]"); if(!b) return;
  var ids=selIds(), n=ids.length;
  if(!n) return;
  var act=b.dataset.sel;

  if(act==="all"){
    visible().forEach(function(x){ S.sel[x.id]=1 });
    render(); return;
  }
  if(act==="clear"){ clearSel(); return }

  if(act==="arch"){
    // if everything picked is already archived, put it all back instead
    var allArch=ids.every(function(id){ var x=byId(id); return x&&x.archived });
    S.items.forEach(function(x){
      if(S.sel[x.id]){ x.archived=!allArch; x.modified=Date.now() }
    });
    S.sel={}; save(); render();
    toast(allArch?(n+" put back"):(n+" archived"));
    return;
  }

  if(act==="del"){
    askChoice("Delete "+n+" item"+(n===1?"":"s")+"?",
      "This can't be undone. Export first if you might want them back.",
      [{label:"Cancel",value:false,kind:"sec"},{label:"Delete",value:true,kind:"dan"}],
      function(go){
        if(!go) return;
        // keep the words before the rows go
        S.items.forEach(function(x){ if(S.sel[x.id]) remember(x,"deleted by you") });
        S.items=S.items.filter(function(x){ return !S.sel[x.id] });
        S.sel={}; save(); render(); toast(n+" deleted — the text is in History");
      });
    return;
  }

  // adding: your most-used tags that aren't already on all of them
  // removing: only tags actually present on the selection
  var counts={}, onSel={};
  S.items.forEach(function(x){
    (x.tags||[]).forEach(function(t){
      counts[t]=(counts[t]||0)+1;
      if(S.sel[x.id]) onSel[t]=(onSel[t]||0)+1;
    });
  });
  var sugs = act==="tag"
    ? Object.keys(counts).filter(function(t){ return (onSel[t]||0)<n })
        .sort(function(a,b){ return counts[b]-counts[a] }).slice(0,6)
    : Object.keys(onSel).sort(function(a,b){ return onSel[b]-onSel[a] });

  askTag(act==="tag"?"Tag "+n+" item"+(n===1?"":"s"):"Remove a tag from "+n+" item"+(n===1?"":"s"),
    act==="tag" ? "Pick one you already use, or type a new one."
                : "These are the tags currently on your selection.",
    sugs, act==="tag"?"Add":"Remove",
    function(word){
      var tag=String(word).trim().toLowerCase().replace(/^#/,"").replace(/\s+/g,"-");
      if(!tag) return;
      var touched=0;
      S.items.forEach(function(x){
        if(!S.sel[x.id]) return;
        x.tags=x.tags||[];
        var at=x.tags.indexOf(tag);
        if(act==="tag"&&at<0){ x.tags.push(tag); x.modified=Date.now(); touched++ }
        if(act==="untag"&&at>=0){ x.tags.splice(at,1); x.modified=Date.now(); touched++ }
      });
      save(); render();
      toast(touched?("#"+tag+(act==="tag"?" added to ":" removed from ")+touched):"Nothing changed");
    });
});

/* ---- a small dialog for choices that need more than yes/no ---- */
var ask=document.getElementById("ask"), askbox=document.getElementById("askbox"), askCB=null;
/* =========================================================================
   POSTS — the public side.

   Nothing in here reads or writes S.items. Publishing takes a copy, and the
   copy is the only thing that ever leaves. That is deliberate: the private
   library and the public one share no code path, so a mistake in this file
   cannot expose a note you never published.

   Everything in the posts table is public by definition — there is no flag
   to get wrong. If you don't want it on the web, it isn't in the table.
   ========================================================================= */
var POSTS={
  list:[],          // your published posts, newest first
  profile:null,     // {handle, display_name, bio, avatar}
  loaded:false,
  busy:false,
  err:"",
  draft:null,       // what the composer is holding, or null
  pdraft:null       // …and what the profile sheet is holding. Only ever one
};                  // of the two, which is how the overlay knows its mode

/* The user id is in the access token, not in the session object we keep.
   Decoding without verifying is fine here: we're reading our own id to put
   in our own row, and the server checks it against auth.uid() regardless. */
function jwtSub(tok){
  try{
    var p=(tok||"").split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    p+="===".slice((p.length+3)%4);
    return JSON.parse(atob(p)).sub||"";
  }catch(e){ return "" }
}
function myUid(){ return SYNC.session?jwtSub(SYNC.session.access_token):"" }
function uuid(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
    var r=Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16);
  });
}
function mediaBase(){ return SUPA.url+"/storage/v1/object/public/post-media/" }
function copyText(t){
  if(!t) return;
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy") }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).catch(fallback);
  else fallback();
}
function authHeaders(extra){
  var h={ apikey:SUPA.key, Authorization:"Bearer "+(SYNC.session?SYNC.session.access_token:"") };
  if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k] });
  return h;
}
function rest(path,opts){
  opts=opts||{};
  var h=authHeaders({ "Content-Type":"application/json" });
  if(opts.prefer) h["Prefer"]=opts.prefer;
  return fetch(SUPA.url+"/rest/v1"+path,{
    method:opts.method||"GET", headers:h,
    body:opts.body!==undefined?JSON.stringify(opts.body):undefined
  }).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=JSON.parse(t) }catch(e){}
      if(!r.ok) throw { msg:(j&&(j.message||j.hint||j.error_description))||("HTTP "+r.status) };
      return j;
    });
  });
}

/* Where the world reads you. Built from wherever the app is served, so it is
   right on the live site and honest about being nothing on a local file. */
function publicUrl(id){
  var h=POSTS.profile&&POSTS.profile.handle;
  if(!h||location.protocol==="file:") return "";
  var dir=location.origin+location.pathname.replace(/[^/]*$/,"");
  return dir+"p/?u="+encodeURIComponent(h)+(id?"&p="+encodeURIComponent(id):"");
}

function loadPosts(force){
  if(!SYNC.session){ POSTS.list=[]; POSTS.profile=null; POSTS.loaded=false; return Promise.resolve() }
  if(POSTS.loaded&&!force) return Promise.resolve();
  POSTS.busy=true; if(S.view==="posts") render();
  return withFreshSession().then(function(){
    var uid=myUid();
    if(!uid) throw { msg:"could not read your account id from the session" };
    return Promise.all([
      rest("/profiles?select=user_id,handle,display_name,bio,avatar&user_id=eq."+uid),
      rest("/posts?select=id,body,photos,link,created_at,edited_at&author=eq."+uid
           +"&order=created_at.desc")
    ]);
  }).then(function(r){
    POSTS.profile=(r[0]||[])[0]||null;
    POSTS.list=r[1]||[];
    POSTS.loaded=true; POSTS.err="";
  }).catch(function(e){
    POSTS.err=(e&&e.msg)||"could not reach the server";
  }).then(function(){
    POSTS.busy=false;
    if(S.view==="posts") render();
  });
}

/* ---- media -----------------------------------------------------------
   Photos live in the note as base64 data URLs, which is fine for a local
   library and hopeless for a public page — a row would carry the bytes and
   every visitor would download all of them before seeing a word. Publishing
   uploads each one and keeps a URL. */
function dataUrlToBlob(u){
  var m=/^data:([^;,]+);base64,([\s\S]*)$/.exec(u||"");
  if(!m) return null;
  try{
    var bin=atob(m[2]), arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:m[1]});
  }catch(e){ return null }
}
function uploadPhoto(postId,photo,ix){
  var src=(photo&&photo.src)||photo&&photo.url||"";
  if(!/^data:/.test(src))                       // already uploaded — reuse it
    return Promise.resolve(src?{url:src,w:photo.w||null,h:photo.h||null}:null);
  var blob=dataUrlToBlob(src);
  if(!blob) return Promise.resolve(null);
  var ext=/png/i.test(blob.type)?"png":/webp/i.test(blob.type)?"webp":"jpg";
  var path=myUid()+"/"+postId+"/"+ix+"."+ext;    // the folder is your user id,
  return fetch(SUPA.url+"/storage/v1/object/post-media/"+path,{   // which is what
    method:"POST",                                                // the storage
    headers:authHeaders({ "Content-Type":blob.type, "x-upsert":"true" }),
    body:blob                                                     // policy checks
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw { msg:"image upload failed — "+t.slice(0,120) } });
    return { url:mediaBase()+path, w:photo.w||null, h:photo.h||null };
  });
}
function dropMedia(post){
  var paths=((post&&post.photos)||[]).map(function(p){
    var m=/\/post-media\/(.+)$/.exec(p&&p.url||""); return m?decodeURIComponent(m[1]):null;
  }).filter(Boolean);
  if(!paths.length) return Promise.resolve();
  return fetch(SUPA.url+"/storage/v1/object/post-media",{
    method:"DELETE", headers:authHeaders({ "Content-Type":"application/json" }),
    body:JSON.stringify({ prefixes:paths })
  }).catch(function(){});   // an orphaned image is untidy, not dangerous
}

/* ---- publishing ---------------------------------------------------- */
function publishDraft(d){
  var isNew=!d.id, id=d.id||uuid();
  return withFreshSession().then(function(){
    return Promise.all((d.photos||[]).map(function(p,ix){ return uploadPhoto(id,p,ix) }));
  }).then(function(shots){
    var row={ body:sanitizeRich(d.body||""), photos:shots.filter(Boolean), link:d.link||null };
    if(isNew){
      row.id=id;
      row.author=myUid();
      return rest("/posts",{ method:"POST", prefer:"return=representation", body:row });
    }
    row.edited_at=new Date().toISOString();
    return rest("/posts?id=eq."+id,{ method:"PATCH", prefer:"return=representation", body:row });
  }).then(function(rows){
    var saved=(rows||[])[0];
    if(!saved) throw { msg:"the server accepted it but returned nothing" };
    var at=POSTS.list.map(function(p){ return p.id }).indexOf(saved.id);
    if(at>=0) POSTS.list[at]=saved; else POSTS.list.unshift(saved);
    return saved;
  });
}
function unpublish(id){
  var post=POSTS.list.filter(function(p){ return p.id===id })[0];
  return withFreshSession()
    .then(function(){ return rest("/posts?id=eq."+id,{ method:"DELETE" }) })
    .then(function(){ return dropMedia(post) })
    .then(function(){
      POSTS.list=POSTS.list.filter(function(p){ return p.id!==id });
      // the note it came from stops claiming to be published
      S.items.forEach(function(i){ if(i.postId===id){ i.postId=""; i.modified=Date.now() } });
      save();
    });
}

/* ---- turning things into drafts ------------------------------------- */
function draftFromItem(i){
  var link=hasLink(i)?{ url:i.url, title:i.title||"", desc:i.desc||"",
                        image:i.image||"", site:i.site||host(i.url) }:null;
  var body=i.body||"";
  // With a link the title belongs to the card, so printing it twice reads badly
  if(!link&&i.title) body='<strong>'+esc(i.title)+'</strong>'+(body?"<br>"+body:"");
  return { id:"", source:i.id, body:body, link:link,
           photos:(i.photos||[]).map(function(p){ return {src:p.src,w:p.w,h:p.h} }) };
}
function draftFromPost(p){
  return { id:p.id, source:"", body:p.body||"", link:p.link||null,
           photos:(p.photos||[]).map(function(x){ return {src:x.url,w:x.w,h:x.h} }) };
}

function readComposer(){
  var body=document.getElementById("p-body");
  if(body) POSTS.draft.body=sanitizeRich(body.innerHTML);
}
function composerError(msg){
  var e=document.getElementById("p-err"); if(e) e.textContent=msg||"";
}
function openComposer(draft){
  if(!SYNC.session) return toast("Sign in first — posts live on the server");
  if(!POSTS.profile) return toast("No public profile yet. Run the Posts setup in Supabase.");
  POSTS.pdraft=null;            // only one sheet at a time
  POSTS.draft=draft;
  paintComposer();
  pscrim.classList.add("on");
  setTimeout(function(){
    var b=document.getElementById("p-body");

  },50);

function closeComposer(){

  pscrim.classList.remove("on"); psheet.innerHTML="";
}

/* ---- the profile ------------------------------------------------------
   Four fields, all of them public by design. The handle is the odd one: it
   is the address, so changing it silently breaks every link anyone has kept.
   The dialog says so rather than discovering it for you. */
function openProfile(){
  if(!SYNC.session) return toast("Sign in first");
  var p=POSTS.profile||{};
  POSTS.draft=null;
  POSTS.pdraft={ handle:p.handle||"", display_name:p.display_name||"",
                 bio:p.bio||"", avatar:p.avatar||"", was:p.handle||"" };
  paintProfile();
  pscrim.classList.add("on");
  setTimeout(function(){ var f=document.getElementById("pr-name"); if(f) f.focus() },50);
}
function paintProfile(){
  var d=POSTS.pdraft; if(!d) return;
  psheet.innerHTML=
     '<div class="phead"><h3>Your public profile</h3></div>'
    +'<div class="prow"><div class="pav" id="pr-av">'
      +(d.avatar?'<img src="'+esc(d.avatar)+'" alt="">'
                :esc((d.display_name||d.handle||"?").slice(0,1).toUpperCase()))
    +'</div><div style="flex:1;min-width:0">'
      +'<label class="plab" for="pr-name">Name</label>'
      +'<input class="pin" id="pr-name" maxlength="60" placeholder="Thodoris" value="'+esc(d.display_name)+'">'
      +'<div style="display:flex;gap:8px;margin-top:6px">'
        +'<button class="pbtn" id="pr-pick" style="padding:7px 13px;font-size:12.5px">Change picture</button>'
        +(d.avatar?'<button class="pbtn danger" id="pr-noav" style="padding:7px 13px;font-size:12.5px">Remove</button>':"")
      +'</div>'
    +'</div></div>'
    +'<label class="plab" for="pr-handle">Handle — this is your address</label>'
    +'<input class="pin" id="pr-handle" maxlength="24" spellcheck="false" '
      +'placeholder="tgeorgakopoulos" value="'+esc(d.handle)+'">'
    +'<div class="phint" id="pr-url"></div>'
    +'<label class="plab" for="pr-bio">Bio</label>'
    +'<textarea class="pin" id="pr-bio" rows="3" maxlength="240" '
      +'placeholder="One line about what you post.">'+esc(d.bio)+'</textarea>'
    +'<div class="pact"><span class="perr" id="p-err"></span><span class="grow"></span>'
      +'<button class="pbtn" id="pr-cancel">Cancel</button>'
      +'<button class="pbtn primary" id="pr-save">Save</button></div>';
  paintHandleHint();
}
/* Repainting the profile sheet rebuilds its inputs, so whatever is typed in
   them has to be lifted into the draft first or picking a picture silently
   discards the name you just wrote. */
function keepProfileFields(){
  var d=POSTS.pdraft; if(!d) return;
  var n=document.getElementById("pr-name"), b=document.getElementById("pr-bio"),
      h=document.getElementById("pr-handle");
  if(n) d.display_name=n.value;
  if(b) d.bio=b.value;
  if(h) d.handle=h.value;
}
function paintHandleHint(){
  var el=document.getElementById("pr-url"), inp=document.getElementById("pr-handle");
  if(!el||!inp) return;
  var h=inp.value.trim().toLowerCase(), d=POSTS.pdraft;
  var dir=location.protocol==="file:"?"…/everything/"
        :location.origin+location.pathname.replace(/[^/]*$/,"");
  el.textContent=h?(dir+"p/?u="+h):"";
  el.classList.toggle("warn", !!(h&&d.was&&h!==d.was));
  if(h&&d.was&&h!==d.was)
    el.textContent+="  — every link to your old address stops working";
}
function saveProfile(){
  var d=POSTS.pdraft; if(!d) return;
  d.display_name=document.getElementById("pr-name").value.trim();
  d.bio=document.getElementById("pr-bio").value.trim();
  var h=document.getElementById("pr-handle").value.trim().toLowerCase();
  if(!/^[a-z0-9_]{2,24}$/.test(h))
    return composerError("A handle is 2–24 characters: letters, numbers and _");
  d.handle=h;
  var btn=document.getElementById("pr-save");
  btn.disabled=true; btn.textContent="Saving…"; composerError("");
  withFreshSession().then(function(){
    return rest("/profiles?user_id=eq."+myUid(),{
      method:"PATCH", prefer:"return=representation",
      body:{ handle:d.handle, display_name:d.display_name, bio:d.bio, avatar:d.avatar||null }
    });
  }).then(function(rows){
    POSTS.profile=(rows||[])[0]||POSTS.profile;
    closeComposer(); render(); toast("Profile saved");
  }).catch(function(e){
    btn.disabled=false; btn.textContent="Save";
    var m=(e&&e.msg)||"could not save";
    composerError(/duplicate|unique/i.test(m)?("@"+d.handle+" is taken"):m);
  });
}
/* The avatar goes in the same bucket as post images, in a folder of its own
   so unpublishing a post can never sweep it away. One fixed path, overwritten,
   with a cache-buster — otherwise browsers keep showing the old face. */
function uploadAvatar(photo){
  var blob=dataUrlToBlob(photo.src);
  if(!blob) return Promise.reject({ msg:"could not read that image" });
  var path=myUid()+"/avatar/pic."+(/png/i.test(blob.type)?"png":"jpg");
  return withFreshSession().then(function(){
    return fetch(SUPA.url+"/storage/v1/object/post-media/"+path,{
      method:"POST",
      headers:authHeaders({ "Content-Type":blob.type, "x-upsert":"true" }),
      body:blob
    });
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw { msg:"upload failed — "+t.slice(0,100) } });
    return mediaBase()+path+"?v="+Date.now();
  });
}

pscrim.addEventListener("mousedown",function(e){ if(e.target===pscrim) closeComposer() });

psheet.addEventListener("input",function(e){
  if(e.target.id==="pr-handle"||e.target.id==="pr-name") paintHandleHint();
});

psheet.addEventListener("click",function(e){
  /* ---- profile mode ---- */
  if(POSTS.pdraft){
    if(e.target.closest("#pr-cancel")) return closeComposer();
    if(e.target.closest("#pr-save")) return saveProfile();
    if(e.target.closest("#pr-noav")){
      POSTS.pdraft.avatar=""; keepProfileFields(); paintProfile(); return;
    }
    if(e.target.closest("#pr-pick")){
      pickFiles(function(shots){
        if(!shots.length) return;
        keepProfileFields();
        composerError("Uploading…");
        uploadAvatar(shots[0]).then(function(url){
          POSTS.pdraft.avatar=url; paintProfile();
        }).catch(function(err){ composerError((err&&err.msg)||"upload failed") });
      });
      return;
    }
    return;
  }

  var d=POSTS.draft; if(!d) return;
  var f=e.target.closest("[data-pf]");
  if(f){
    e.preventDefault();
    var k=f.dataset.pf;
    if(k==="img"){ pickFiles(function(shots){
      readComposer();
      d.photos=(d.photos||[]).concat(shots.map(function(p){ return {src:p.src,w:p.w,h:p.h} }));
      paintComposer();
    }); return }
    if(k==="addlink"){
      readComposer();
      askText("Attach a link","The card shows the address and the site. For a "
        +"cover image and a real title, save the page with the extension first, "
        +"then post that note — the extension can read the page, this box can't.",
        "https://","Attach",function(v){
          v=(v||"").trim();
          if(!v) return;
          if(!SAFE_HREF.test(v)) return composerError("That doesn't look like a web address");
          d.link={ url:v, title:host(v)||v, desc:"", image:"", site:host(v) };
          paintComposer();
        });
      return;
    }
    document.getElementById("p-body").focus();
    if(k==="link"){
      var sel=String(getSelection());
      if(!sel) return composerError("Select some words first");
      askText("Link","Where should “"+esc(sel)+"” point?","https://","Link",function(v){
        v=(v||"").trim();
        document.getElementById("p-body").focus();
        if(v&&SAFE_HREF.test(v)) document.execCommand("createLink",false,v);
      });
      return;
    }
    try{
      document.execCommand({bold:"bold",italic:"italic",
        ul:"insertUnorderedList",ol:"insertOrderedList"}[k],false,null);
    }catch(err){}
    return;
  }
  if(e.target.closest("[data-droplink]")){ readComposer(); d.link=null; paintComposer(); return }
  var ri=e.target.closest("[data-dropimg]");
  if(ri){ readComposer(); d.photos.splice(+ri.dataset.dropimg,1); paintComposer(); return }
  if(e.target.closest("#p-cancel")){ closeComposer(); return }
  if(e.target.closest("#p-go")) submitComposer();
});

// keep the editor's rules: plain text in, images become attachments
psheet.addEventListener("paste",function(e){
  if(!POSTS.draft||!e.clipboardData) return;
  var imgs=imageFilesFrom(e.clipboardData);
  if(imgs.length){
    e.preventDefault(); e.stopPropagation();
    takeFiles(imgs,function(shots){
      readComposer();
      POSTS.draft.photos=(POSTS.draft.photos||[])
        .concat(shots.map(function(p){ return {src:p.src,w:p.w,h:p.h} }));
      paintComposer();
    });
    return;
  }
  var txt=e.clipboardData.getData("text/plain");
  if(txt==null) return;
  e.preventDefault();
  try{ document.execCommand("insertText",false,txt) }catch(err){}
},true);

psheet.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){
    e.preventDefault();
    if(POSTS.pdraft) saveProfile(); else submitComposer();
  }
});

function submitComposer(){
  var d=POSTS.draft; if(!d) return;
  readComposer();
  if(!richToText(d.body).trim()&&!d.link&&!(d.photos||[]).length)
    return composerError("Nothing to post yet");
  var go=document.getElementById("p-go");
  go.disabled=true; go.textContent=d.id?"Updating…":"Publishing…";
  composerError("");
  publishDraft(d).then(function(saved){
    // the note remembers what it became, so it can't be posted twice by accident
    if(d.source){
      var it=byId(d.source);
      if(it&&!it.postId){ it.postId=saved.id; it.modified=Date.now(); save() }
    }
    closeComposer();
    render();
    toast(d.id?"Post updated":"Published");
  }).catch(function(e){
    go.disabled=false; go.textContent=d.id?"Update":"Publish";
    composerError((e&&e.msg)||"could not publish");
  });
}

function blankDraft(){ return { id:"", source:"", body:"", link:null, photos:[] } }

board.addEventListener("click",function(e){

/* =========================================================================
   WHAT IS ACTUALLY IN THIS BROWSER

   Written because a note lost changes on reload and there was no way to see
   why from the outside. A separate diagnostic page cannot help: localStorage
   belongs to one origin, so the only place that can measure this is the app.
   ========================================================================= */
function storageReport(){
  var rows=[], total=0;
  for(var k=0;k<localStorage.length;k++){
    var key=localStorage.key(k);
    var n=(localStorage.getItem(key)||"").length;
    rows.push({key:key,bytes:n}); total+=n;
  }
  rows.sort(function(a,b){ return b.bytes-a.bytes });

  var photoBytes=0, withPhotos=0, biggest=null, empties=[];
  S.items.forEach(function(i){
    var pb=(i.photos||[]).reduce(function(t,p){ return t+((p.src||"").length) },0);
    if(pb){ photoBytes+=pb; withPhotos++ }
    var size=JSON.stringify(i).length;
    if(!biggest||size>biggest.size) biggest={id:i.id,title:i.title,size:size};
    var empty=!i.title&&!richToText(i.body).trim()&&!i.url
      &&!(i.photos||[]).length&&!(i.checks||[]).length;
    if(empty) empties.push(i);
  });
  return { rows:rows, total:total, items:S.items.length, photoBytes:photoBytes,
           withPhotos:withPhotos, biggest:biggest, empties:empties,
           queued:Object.keys(SYNC.queue).length,
           shadowed:Object.keys(SYNC.shadow).length };
}

function showStorage(){
  var r=storageReport();
  var kb=function(n){ return (n/1024).toFixed(0)+" KB" };
  var pct=Math.round(r.total/5242880*100);
  var html='<div class="stat"><b>'+kb(r.total)+'</b> used of roughly 5 MB — <b>'
    +pct+'%</b></div>'
    +'<table class="sttab">'+r.rows.map(function(x){
      return '<tr><td>'+esc(x.key)+'</td><td>'+kb(x.bytes)+'</td></tr>' }).join("")
    +'</table>'
    +'<div class="stat">'+r.items+' notes · '+r.withPhotos+' with photographs, '
    +kb(r.photoBytes)+' of image data'+(r.photoBytes?' — this is what fills it up':'')+'</div>'
    +(r.biggest?'<div class="stat">Largest note: '+esc(r.biggest.title||"untitled")
      +' at '+kb(r.biggest.size)+'</div>':"")
    +'<div class="stat">'+r.queued+' waiting to sync · '+r.shadowed+' tracked</div>'
    +(r.empties.length?'<div class="stat warn">'+r.empties.length
      +' note'+(r.empties.length===1?'':'s')+' with nothing in them '
      +'<button class="btn" id="stpurge">Remove them</button></div>':"");
  askChoice("Storage",html,[{label:"Close",value:0,kind:"sec"}],function(){});
  var purge=document.getElementById("stpurge");
  if(purge) purge.addEventListener("click",function(){
    var gone=0;
    S.items=S.items.filter(function(i){
      var empty=!i.title&&!richToText(i.body).trim()&&!i.url
        &&!(i.photos||[]).length&&!(i.checks||[]).length;
      if(empty){ remember(i,"empty note removed"); gone++ }
      return !empty;
    });
    save(); render(); closeAsk(); toast(gone+" empty note"+(gone===1?"":"s")+" removed");
  });
}

/* =========================================================================
   LOCAL AGAINST THE SERVER

   You should not have to take my word for it that nothing else was lost.
   This reads every row the database holds and lays it beside what is in this
   browser, naming anything the two disagree about. It writes nothing.
   ========================================================================= */
function compareWithServer(){
  if(!SYNC.session) return Promise.reject({msg:"Sign in first"});
  return withFreshSession().then(function(){
    return fetch(SUPA.url+"/rest/v1/items?select=id,data,modified,deleted",
      { headers:supaHeaders(true) });
  }).then(function(r){
    if(!r.ok) throw {msg:"Could not read the server ("+r.status+")"};
    return r.json();
  }).then(function(rows){
    var here={}, out={ onlyHere:[], onlyServer:[], newerHere:[], newerServer:[], same:0,
                       tombstones:0, serverRows:rows.length, localRows:S.items.length };
    S.items.forEach(function(i){ here[i.id]=i });
    var seen={};
    rows.forEach(function(row){
      /* Deletes are soft: the row stays with a flag so other devices learn
         about it instead of resurrecting the note. Counted rather than
         ignored — an unexplained difference between two totals is precisely
         the kind of thing that makes a person distrust the report. */
      if(row.deleted){ out.tombstones++; return }
      seen[row.id]=1;
      var mine=here[row.id];
      var theirs=row.data&&row.data.id?normalizeItem(row.data):null;
      if(!theirs) return;
      if(!mine){ out.onlyServer.push(theirs); return }
      if(sig(mine)===sig(theirs)){ out.same++; return }
      ((mine.modified||0)>=(theirs.modified||0)?out.newerHere:out.newerServer)
        .push({mine:mine,theirs:theirs});
    });
    S.items.forEach(function(i){ if(!seen[i.id]) out.onlyHere.push(i) });
    return out;
  });
}

function showCompare(){
  askChoice("Checking…","<div class='stat'>Reading every row from the server.</div>",
    [{label:"Cancel",value:0,kind:"sec"}],function(){});
  compareWithServer().then(function(r){
    var name=function(i){ return esc(i.title||richToText(i.body).slice(0,60)||"untitled") };
    var block=function(title,list,render){
      if(!list.length) return "";
      return '<div class="stat"><b>'+esc(title)+' — '+list.length+'</b></div>'
        +'<table class="sttab">'+list.slice(0,25).map(render).join("")+'</table>'
        +(list.length>25?'<div class="stat">…and '+(list.length-25)+' more</div>':"");
    };
    var clean=!r.onlyHere.length&&!r.onlyServer.length&&!r.newerServer.length;
    var live=r.serverRows-r.tombstones;
    var html='<div class="stat"><b>'+r.localRows+'</b> notes here · <b>'+live
      +'</b> live on the server · <b>'+r.same+'</b> identical</div>'
      +(r.tombstones?'<div class="stat">'+r.tombstones+' further rows are notes you have '
        +'deleted. They stay as markers so your other devices delete them too, and hold '
        +'no content.</div>':"")
      +(clean?'<div class="stat">Nothing is missing from this browser.</div>':"")
      + block("Only on the server — this browser never got them",r.onlyServer,
          function(i){ return '<tr><td>'+name(i)+'</td><td>'+esc(agoText(i.modified))+'</td></tr>' })
      + block("Newer on the server than here",r.newerServer,
          function(p){ return '<tr><td>'+name(p.theirs)+'</td><td>'+esc(agoText(p.theirs.modified))+'</td></tr>' })
      + block("Only here, not yet uploaded",r.onlyHere,
          function(i){ return '<tr><td>'+name(i)+'</td><td>'+esc(agoText(i.modified))+'</td></tr>' })
      + block("Newer here than on the server",r.newerHere,
          function(p){ return '<tr><td>'+name(p.mine)+'</td><td>'+esc(agoText(p.mine.modified))+'</td></tr>' })
      +(clean?"":'<div class="stat">Nothing has been changed. Bring the server '
        +'copies down, or let yours go up — either way the version that loses '
        +'is kept in that note&rsquo;s History.</div>');
    var choices=[{label:"Close",value:0,kind:"sec"}];
    if(r.onlyServer.length||r.newerServer.length)
      choices.push({label:"Take the server's copies",value:1});
    askChoice("This browser against the server",html,choices,function(v){
      if(v!==1) return;
      var rows=r.onlyServer.map(function(i){ return {id:i.id,data:i,deleted:false,
        modified:new Date().toISOString()} })
        .concat(r.newerServer.map(function(p){ return {id:p.theirs.id,data:p.theirs,
          deleted:false,modified:new Date().toISOString()} }));
      // route it through the ordinary merge, so history is written as usual
      rows.forEach(function(row){ delete SYNC.shadow[row.id] });
      applyIncoming(rows);
      save(); render();
      toast(rows.length+" brought down from the server");
    });
  }).catch(function(e){
    askChoice("Couldn't check","<div class='stat warn'>"+esc((e&&e.msg)||"Something went wrong")
      +"</div>",[{label:"Close",value:0,kind:"sec"}],function(){});
  });
}

/* Renaming a tag. The obvious place is the tag's own page, so there's a
   Rename button in the header whenever you're looking at one. Right-clicking
   it in the sidebar does the same thing, for when you already know. */
function renameTag(old){
  var used=S.items.filter(function(x){ return (x.tags||[]).indexOf(old)>=0 }).length;
  askText("Rename #"+old,
    "Renaming changes it on all <b>"+used+"</b> item"+(used===1?"":"s")+" that carry it. "
    +"If a tag by the new name already exists, the two merge.",
    old, "Rename",
    function(v){
      var next=v.trim().toLowerCase().replace(/^#/,"").replace(/\s+/g,"-");
      if(!next||next===old) return;
      var merged=S.items.some(function(x){
        return (x.tags||[]).indexOf(old)>=0 && (x.tags||[]).indexOf(next)>=0;
      });
      var n=0;
      S.items.forEach(function(x){
        var at=(x.tags||[]).indexOf(old);
        if(at<0) return;
        x.tags.splice(at,1);
        if(x.tags.indexOf(next)<0) x.tags.push(next);
        x.modified=Date.now(); n++;
      });
      if(S.tag===old) S.tag=next;
      if(S.layouts["tag:"+old]){                   // the page keeps its layout
        S.layouts["tag:"+next]=S.layouts["tag:"+old];
        delete S.layouts["tag:"+old];
        try{ localStorage.setItem("trove.layouts",JSON.stringify(S.layouts)) }catch(err){}
      }
      save(); render();
      toast("#"+old+" → #"+next+" on "+n+" item"+(n===1?"":"s")+(merged?" · merged":""));
    });
}

/* Keyboard focus is layered, and each layer swallows what belongs to it.
   Without this, ⌘K or an undo pressed inside an open note also reached the
   board behind it — which is why text was appearing and vanishing in the
   capture field while you were typing in the editor. */
function isTyping(){
  var el=document.activeElement;
  if(!el) return false;
  var t=(el.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||el.isContentEditable;
}

document.addEventListener("keydown",function(e){
  // 0. a question is on screen and owns the keyboard until answered
  if(ask.classList.contains("on")){
    if(e.key==="Escape"){ e.preventDefault(); closeAsk(); askCB=null }
    return;
  }
  // 1. the lightbox is on top of everything
  if(light.classList.contains("on")){
    if(e.key==="Escape"){ e.preventDefault(); light.classList.remove("on") }
    else if(e.key==="ArrowRight"){ e.preventDefault(); stepLight(1) }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); stepLight(-1) }
    return;
  }

  // 2. an open note is modal. Escape leaves; every other key — including
  //    ⌘X, ⌘Z and the app's own shortcuts — belongs to the editor alone.
  if(scrim.classList.contains("on")){
    if(e.key==="Escape") dismissEditor();   // saves, rather than discarding
    return;
  }

  // 3. app-level shortcuts, only once nothing above has claimed the keyboard
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault(); capin.focus(); return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="j"){
    e.preventDefault(); toggleTaskbar(); return;
  }
  if(e.key==="Escape"&&selCount()){ clearSel(); return }
  if(e.key==="Escape"&&taskbarOpen()&&!isTyping()){ setTaskbar(false); return }
  if(e.key==="/"&&!isTyping()){ e.preventDefault(); document.getElementById("q").focus() }
});

/* The name. "Everything" is the one in use; "Trove" is kept as the fallback,
   one click away on the logo. */
var BRANDS=["Everything","Trove"];
/* Set it as large as the sidebar will take, then back off one pixel at a time
   until it fits. Guessing from character counts is unreliable with a script
   face — and the font arrives after first paint, so this runs again then. */
var BRAND_MAX=52, BRAND_MIN=26;
function fitBrand(){
  var el=document.getElementById("brandname");
  if(!el||!el.clientWidth) return;
  var size=BRAND_MAX;
  el.style.fontSize=size+"px";
  while(size>BRAND_MIN && el.scrollWidth>el.clientWidth){
    size-=1;
    el.style.fontSize=size+"px";
  }
}
function setBrand(name){
  var n=BRANDS.indexOf(name)>=0?name:BRANDS[0];
  document.getElementById("brandname").textContent=n;
  document.title=n;
  // the tagline follows whichever name is in use
  document.getElementById("tagline").textContent="This is "+n;
  document.getElementById("copyline").textContent="© "+new Date().getFullYear()+" Social Capital";
  fitBrand();
  try{ localStorage.setItem("trove.brand",n) }catch(e){}
}
/* A missing webfont fails silently, which is a miserable thing to debug. Ask
   the browser whether it actually has Cookie, and say so if it doesn't. */
function checkBrandFont(){
  var el=document.getElementById("fonthint");
  if(!el) return;
  var ok=true;
  try{ ok=document.fonts.check('30px "Cookie"') }catch(e){}
  el.style.display=ok?"none":"";
}
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(function(){ fitBrand(); checkBrandFont() });
}
window.addEventListener("resize",fitBrand);
document.getElementById("brand").addEventListener("click",function(){
  var cur=document.getElementById("brandname").textContent;
  setBrand(BRANDS[(BRANDS.indexOf(cur)+1)%BRANDS.length]);
});

/* ---- sync controls ---- */
function paintSync(){
  var b=document.getElementById("syncbtn");
  if(!b) return;
  if(!SYNC.on){ b.style.display="none"; return }
  /* Short, and all roughly the same length — the label changes several times
     a minute, and a button that resizes each time reads as a fault. */
  var waiting=Object.keys(SYNC.queue).length;
  var label, cls="";
  if(!SYNC.session){ label="☁ Sign in"; cls="out" }
  else if(SYNC.status==="busy"){ label="☁ Syncing"; cls="busy" }
  else if(SYNC.status==="offline"){ label="☁ Offline"; cls="err" }
  else if(SYNC.status==="error"){ label="☁ Failed"; cls="err" }
  else if(waiting){ label="☁ "+waiting+" to go"; cls="busy" }
  else label="☁ Synced";
  b.textContent=label;
  b.className="ghost syncbtn"+(cls?" "+cls:"");
  b.title=SYNC.session
    ? (SYNC.session.email?("Signed in as "+SYNC.session.email):"Signed in")
      +(SYNC.note?" — "+SYNC.note:"")
    : "Sync this library across your devices";
}

document.getElementById("syncbtn").addEventListener("click",function(){
  if(!SYNC.session){
    askLogin(function(email,pw){
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("That doesn't look like an email");
      if(!pw||pw.length<6) return toast("Use at least six characters");
      toast("Signing in…");
      signInOrUp(email,pw).then(function(){
        paintSync();
        // never let sample content masquerade as yours
        if(DEMO){
          S.items=[]; SYNC.shadow={}; SYNC.queue={};
          SYNC.lastPull="1970-01-01T00:00:00Z";
          notDemoAnyMore();
          try{ localStorage.setItem(KEY,"[]") }catch(e){}
        }
        return syncNow();
      }).then(function(){
        loadPosts(true);          // so the ◈ markers and the Posts count are true
        toast("Signed in — library synced");
      }).catch(function(e){
        toast(String(e&&(e.msg||e.error_description||e.message)||"Couldn't sign in"));
      });
    });
    return;
  }
  askChoice("Sync",
    (SYNC.session.email?"Signed in as <b>"+esc(SYNC.session.email)+"</b>.":"Signed in.")
    +" "+(Object.keys(SYNC.queue).length
      ? Object.keys(SYNC.queue).length+" change(s) waiting to go up."
      : "Everything here is up to date.")
    +(SYNC.note?"<br><br>Last problem: "+esc(SYNC.note):""),
    [{label:"Sign out",value:"out",kind:"dan"},
     {label:"Close",value:null,kind:"sec"},
     {label:"Sync now",value:"now"}],
    function(v){
      if(v==="now"){ syncNow().then(function(){ toast("Synced") }) }
      if(v==="out"){
        askChoice("Sign out?",
          "Your library stays on this device. It simply stops syncing.",
          [{label:"Cancel",value:false,kind:"sec"},{label:"Sign out",value:true,kind:"dan"}],
          function(go){ if(go){ signOut(); toast("Signed out") } });
      }
    });
});

document.getElementById("szdown").addEventListener("click",function(){ setNoteSize(sizeIx-1) });
document.getElementById("szup").addEventListener("click",function(){ setNoteSize(sizeIx+1) });

/* The Reset button lived here. It replaced the library with sample content —
   harmless when that library was a demo, and actively hazardous now: with
   sync on, a reset would push twelve sample notes to every device you own and
   delete everything real in the process. There is no undo, and nothing it did
   that Import can't do better. Removed rather than guarded. */

var tEl=document.getElementById("toast"), tTimer;
function toast(msg){
  tEl.textContent=msg; tEl.classList.add("on");
  clearTimeout(tTimer); tTimer=setTimeout(function(){ tEl.classList.remove("on") },1700);
}

/* ============ boot ============ */
function backfill(){
  S.items.forEach(function(i){ if(i.url&&!i.image&&i.metaState!=="fail") fetchMeta(i) });
}
try{ var th=localStorage.getItem("trove.theme"); if(th) document.documentElement.setAttribute("data-theme",th) }catch(e){}
try{ var ft=localStorage.getItem("trove.font"); if(ft) setFont(ft) }catch(e){}
try{ var ly=localStorage.getItem("trove.layouts"); if(ly) S.layouts=JSON.parse(ly)||{} }catch(e){}
try{ var ns=localStorage.getItem("trove.notesize"); setNoteSize(ns==null?2:parseInt(ns,10)) }
catch(e){ setNoteSize(2) }
try{ setQuotes(localStorage.getItem("trove.quotes")||"gr") }catch(e){ setQuotes("gr") }
try{ setBrand(localStorage.getItem("trove.brand")||"Everything") }catch(e){ setBrand("Everything") }

try{
  if(localStorage.getItem("trove.grp.tasks")==="0"){
    document.getElementById("grp-tasks").classList.add("closed");
    document.querySelector('[data-toggle="tasks"]').classList.add("closed");
  }
}catch(e){}
attachSmartQuotes(capin,false);
var stored=load();
if(stored){
  S.items=stored;
  try{ DEMO=localStorage.getItem("trove.demo")==="1" }catch(e){}
} else {
  S.items=enrich(seed());
  DEMO=true;
  try{ localStorage.setItem("trove.demo","1") }catch(e){}
}
save(); render(); refreshCap();
/* One more sidebar paint after the first frame. I could not reproduce the
   missing Notes count in a simulated browser, and rather than guess at a
   cause for a third time, this simply repaints once the page is real. It
   costs a fraction of a millisecond; a count that is silently absent costs
   more than that in doubt. If it turns out to be a real ordering fault, this
   hides the symptom — so it is written down here, not buried. */
if(window.requestAnimationFrame) requestAnimationFrame(function(){ paintSidebar() });
else setTimeout(paintSidebar,0);
BOOTED=true;   // from here on, a save means a person did something
// the column is a per-screen preference, so it stays on this device
try{ if(localStorage.getItem(TBKEY)) setTaskbar(true) }catch(e){}
// tasks are not a page any more; a stored one would show a board nothing points at
if(TBVIEWS[S.view]){ S.view="all"; setTaskbar(true); setTaskFilter("tasks") }

/* Photographs live in IndexedDB now, which is asynchronous, so the first
   paint has the notes and not yet the pictures. This fills them in and
   repaints — usually before anyone notices, and harmlessly if not. */
hydratePhotos();

setTimeout(backfill,350);

/* ---- start syncing ---- */
if(SYNC.on){
  loadSession();
  paintSync();
  /* The first render happens above, before this block runs, so it painted a
     sidebar for a signed-out user and hid Posts. Nothing corrected it until
     the next render, which is why the row appeared the moment you clicked
     anything at all. */
  paintSidebar();
  if(SYNC.session){
    syncNow();
    loadPosts();                  // cheap, and the note cards need to know

    setInterval(function(){ if(SYNC.session&&SYNC.status!=="busy") pullChanges() },60000);
    window.addEventListener("focus",function(){ if(SYNC.session) syncNow() });
    window.addEventListener("online",function(){ if(SYNC.session) syncNow() });
    // don't leave with edits stranded in the queue
    window.addEventListener("pagehide",function(){
      if(Object.keys(SYNC.queue).length) pushChanges();
    });
  }
}
})();

/* Offline. The worker keeps a copy of the app so it opens on the Underground,
   on a plane, or when the wifi is lying about being connected. Your library
   was always local anyway; this just means the app itself is too. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
