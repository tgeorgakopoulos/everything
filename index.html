  }
  if(i.compiled) foot.push('<button class="tag docmark" data-auto="compiled" '
      +'title="See every compiled document">⇥ compiled</button>');
  if(A&&i.due!=null) foot.push('<span class="due '+dueClass(i.due)+'">◔ '+fmtDue(i.due,i.timed)+'</span>');
  if(A&&i.due==null&&!i.done) foot.push('<span class="due later">◇ Someday</span>');
  (i.tags||[]).forEach(function(t){ foot.push('<span class="tag">#'+esc(t)+'</span>') });

  if(S.sel[i.id]) cls+=" picked";
  return '<article class="'+cls+'" data-id="'+i.id+'"'+(canReorder()?' draggable="true"':"")+'>'
    +(i.pin?'<div class="pinned"></div>':"")
    +'<button class="pick" data-pick="'+i.id+'" title="Select">✓</button>'
    +'<div class="quick">'
      +(L?'<button data-open="'+i.id+'" class="go" title="Open link in a new tab">↗</button>':"")
      +(L?'<button data-refetch="'+i.id+'" title="Fetch the preview again">↻</button>':"")
      +'<button data-pin="'+i.id+'" class="'+(i.pin?"on":"")+'" title="Pin">◆</button>'
      +'<button data-act="'+i.id+'" class="'+(A?"on":"")+'" title="'+(A?"Remove checkbox":"Make actionable")+'">☑</button>'
      +'<button data-addimg="'+i.id+'" title="Add images">⊞</button>'
    +'</div>'
    +gallery+cover
    +'<div class="head">'+checkbox+'<div style="min-width:0;flex:1">'+title+srcline+'</div></div>'
    // your own words win. The fetched excerpt is only a stand-in for them.
    +(i.body?'<div class="cbody">'+i.body+'</div>'
      : (L&&i.desc?'<div class="desc">'+esc(i.desc)+'</div>':""))

/* One row for list layout. Same data, much less of it. */
function rowHTML(i){
  var L=hasLink(i), A=hasAction(i), P=hasPhotos(i);

    +'<div class="rtitle">'+(esc(i.title)||'<span style="color:var(--faint)">Untitled</span>')+'</div>'
    +'<div class="rexc">'+exc.join(" · ")+'</div>'
    +'<div class="rtags">'+tags+'</div>'
    +'<div class="rdue">'+due+'</div>'

      +(L?'<button data-open="'+i.id+'" class="go" title="Open link in a new tab">↗</button>':"")

    +'</div></div>';
}

/* Render a set of items in whichever layout the current lens is using. */
function block(list){
  var lay=layoutFor();
  if(lay==="list") return '<div class="list">'+list.map(rowHTML).join("")+'</div>';
  return '<div class="grid '+(lay==="cards"?"cards":"mood")+'">'+list.map(cardHTML).join("")+'</div>';
}

/* Pinned items get their own block rather than merely sorting first.
   In the card grid, sorting first is enough — the grid fills left to right,
   so they take the top row. Moodboard is CSS columns, which fill top to
   bottom: sorting first there ran the pinned items down the left-hand edge
   instead of across the top. Giving them a container of their own makes the
   masonry balance them across the width in every layout. */
function pinSplit(list,restLabel){
  var pins=list.filter(function(i){ return i.pin }),
      rest=list.filter(function(i){ return !i.pin });
  if(!pins.length||!rest.length) return block(list);   // no split worth marking
  return '<div class="grouphead">Pinned</div>'+block(pins)
        +'<div class="grouphead">'+esc(restLabel)+'</div>'+block(rest);
}

function bucket(i){
  if(i.due==null) return "Someday";
  var d=dayOf(i.due)-todayKey();
  if(d<0) return "Overdue";
  if(d===0) return "Today";
  if(d===1) return "Tomorrow";
  if(d<7) return "This week";
  return "Later";
}

function render(){
  var list=visible(), lens=LENS[S.view]||LENS.all;
  document.getElementById("viewtitle").textContent =
    S.q?'"'+S.q+'"' : S.tag?"#"+S.tag : lens.title;
  document.getElementById("lensnote").textContent = (S.q||S.tag)?"" : lens.note;

  if(!list.length){
    board.innerHTML='<div class="empty"><div class="big">◌</div>'
      +(S.q?"Nothing matches that.":"Nothing here yet — capture something above.")+'</div>';
  } else if((S.view==="tasks"||S.view==="upcoming")&&!S.q&&!S.tag){
    var order=["Overdue","Today","Tomorrow","This week","Later","Someday"], groups={};
    list.forEach(function(i){ (groups[bucket(i)]=groups[bucket(i)]||[]).push(i) });
    board.innerHTML=order.filter(function(k){return groups[k]}).map(function(k){
      var g=groups[k], links=g.filter(hasLink).length;
      return '<div class="grouphead">'+k+'<span class="gn">'+g.length
        +(links?' · '+links+' also '+(links===1?'a link':'links'):"")+'</span></div>'
        +block(g);
    }).join("");
  } else if(S.view==="all"&&!S.q&&!S.tag){
    board.innerHTML=pinSplit(list,"Recent");
  } else {
    board.innerHTML=pinSplit(list, S.q?"Results":S.tag?"#"+S.tag:lens.title);
  }

  var lay=layoutFor();
  document.querySelectorAll("#layoutseg button").forEach(function(b){
    b.classList.toggle("on", b.dataset.lay===lay);
  });
  // compiling only means something where there are links to compile
  var nlinks=list.filter(hasLink).length;
  document.getElementById("compilebtn").style.display=nlinks?"":"none";
  paintSel();
  paintBackupHint();

  var all=S.items;
  function count(v){ return all.filter(LENS[v].test).length }
  ["all","today","overdue","upcoming","someday","notes","links","tasks","done","archived","compiled"].forEach(function(v){
    var e=document.getElementById("c-"+v); if(e) e.textContent=count(v)||"";
  });
  var narch=count("archived");
  document.getElementById("nav-archived").style.display=(narch||S.view==="archived")?"":"none";
  // Overdue only exists when something is overdue — an empty warning is noise
  var od=count("overdue");
  document.getElementById("nav-overdue").style.display=(od||S.view==="overdue")?"":"none";
  // a task subcategory is open: make sure the group it lives in is visible
  if({today:1,overdue:1,upcoming:1,someday:1,done:1}[S.view]){
    document.getElementById("grp-tasks").classList.remove("closed");
    document.querySelector('[data-toggle="tasks"]').classList.remove("closed");
  }

  // the tag page gets a rename control; nothing else does
  document.getElementById("tagedit").style.display=S.tag?"":"none";

  var counts={};
  all.forEach(function(i){ if(!i.done)(i.tags||[]).forEach(function(x){ counts[x]=(counts[x]||0)+1 }) });
  var ncomp=count("compiled");
  var autoRow=ncomp?('<button class="nav auto'+(S.view==="compiled"?" on":"")+'" data-view="compiled"'
      +' title="Applied automatically — can\'t be added or removed by hand">'
      +'<span class="lock">⇥</span>compiled<span class="n">'+ncomp+'</span></button>'):"";
  document.getElementById("taglist").innerHTML=autoRow+Object.keys(counts)
    .sort(function(a,b){ return counts[b]-counts[a] })
    .map(function(k){
      return '<button class="nav'+(S.tag===k?" on":"")+'" data-tag="'+esc(k)+'"'
        +' title="Right-click to rename #'+esc(k)+' everywhere">'
        +'<span class="dot" style="background:hsl('+hue(k)+' 50% 62%)"></span>'
        +esc(k)+'<span class="n">'+counts[k]+'</span></button>';
    }).join("");

  document.querySelectorAll(".sidebar .nav[data-view]").forEach(function(b){
    b.classList.toggle("on", !S.tag&&!S.q&&b.dataset.view===S.view);
  });
  document.querySelectorAll(".mobtabs button").forEach(function(b){
    b.classList.toggle("on", !S.tag&&b.dataset.view===S.view);
  });
}

/* =========================================================================
   SYNC — one library, several devices.

   Talks to Supabase over plain HTTP rather than through their SDK. That keeps
   the app a single file with no dependencies, keeps it working from file://,
   and satisfies the extension's content policy, which forbids remote scripts.
   It's about two hundred lines instead of a hundred kilobytes.

   The shape of it:
     · every edit is written locally first and drawn immediately
     · a diff against a shadow copy works out what actually changed
     · changes queue and go up when there's a connection
     · on open, on focus, and once a minute, it asks for what changed there
     · the later edit wins, per item, judged by the app's own modified stamp
     · deletions are marked rather than dropped, so they travel

   Nothing here is on the critical path: pull the plug and the app behaves
   exactly as it did before any of this existed.
   ========================================================================= */
var SUPA={
  url:"https://hzbnvkvhcpdodmylgqxb.supabase.co",
  key:"sb_publishable_acuePtNZl9GO4dq7Tav6FA_tp6-4VyM"
};

var SYNC={
  on:!!(SUPA.url&&SUPA.key),
  session:null,          // {access_token, refresh_token, expires_at, email}
  shadow:{},             // id -> the JSON we believe the server has
  queue:{},              // id -> "put" | "del"
  lastPull:"1970-01-01T00:00:00Z",
  status:"off",          // off | out | idle | busy | error | offline
  note:"",
  timer:null
};

function supaHeaders(auth){
  var h={ "apikey":SUPA.key, "Content-Type":"application/json" };
  if(auth&&SYNC.session) h["Authorization"]="Bearer "+SYNC.session.access_token;

function loadSession(){
  try{
    var raw=localStorage.getItem("trove.session");
    if(raw) SYNC.session=JSON.parse(raw);
    SYNC.lastPull=localStorage.getItem("trove.lastPull")||SYNC.lastPull;
    var sh=localStorage.getItem("trove.shadow");
    if(sh) SYNC.shadow=JSON.parse(sh);
    var q=localStorage.getItem("trove.queue");
    if(q) SYNC.queue=JSON.parse(q);
  }catch(e){}
}
function keepSession(){
  try{
    if(SYNC.session) localStorage.setItem("trove.session",JSON.stringify(SYNC.session));
    else localStorage.removeItem("trove.session");
    localStorage.setItem("trove.lastPull",SYNC.lastPull);
    localStorage.setItem("trove.shadow",JSON.stringify(SYNC.shadow));
    localStorage.setItem("trove.queue",JSON.stringify(SYNC.queue));
  }catch(e){}

/* ---- auth ----
   Email and password, and no email is ever sent.

   The two obvious alternatives both fail here. A magic link has to redirect
   you somewhere, and browsers refuse to redirect into chrome-extension:// or
   file:// addresses. A typed code would need the email template changed to
   include one — and since June 2026 Supabase locks template editing on new
   free projects unless you bring your own mail server.

   A password sidesteps all of it: one round trip, no inbox, no rate limit,
   works identically on every device and offline-tolerant afterwards. */

function keepAuth(j,email){
  if(!j||!j.access_token) throw { msg:"no session returned" };
  SYNC.session={
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:Date.now()+((j.expires_in||3600)*1000),
    email:(j.user&&j.user.email)||email
  };
  keepSession();
  return true;
}
function authPost(path,body){
  return fetch(SUPA.url+path,{
    method:"POST", headers:supaHeaders(false), body:JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok) throw j;
      return j;
    });
  });
}
function signInPassword(email,pw){
  return authPost("/auth/v1/token?grant_type=password",{ email:email, password:pw })
    .then(function(j){ return keepAuth(j,email) });
}
function signUpPassword(email,pw){
  return authPost("/auth/v1/signup",{ email:email, password:pw })
    .then(function(j){
      if(!j.access_token) throw { msg:"account made, but it needs email confirmation — turn that off in Supabase" };
      return keepAuth(j,email);
    });
}
/* One button for both cases: sign in, and if there's no such account yet,
   make one. A wrong password on an existing account surfaces as exactly that
   rather than as a confusing signup error. */
function errText(e){
  return String((e&&(e.error_description||e.msg||e.message||e.error))||"");
}
function signInOrUp(email,pw){
  return signInPassword(email,pw).catch(function(e){
    var msg=errText(e);
    if(!/invalid login credentials/i.test(msg)) throw e;

    /* Supabase answers "invalid login credentials" both for an unknown email
       and for a wrong password — deliberately, so nobody can probe which
       addresses exist. So try creating the account, and read the failure:

         "already registered"  -> the email is known, the password is wrong
         "signups not allowed" -> we can't create one, so the pair simply
                                  doesn't open anything here

       Reporting the signup error verbatim was misleading: it made a mistyped
       password look like a configuration problem. */
    return signUpPassword(email,pw).catch(function(e2){
      var m2=errText(e2);
      if(/already registered|already exists|user_already/i.test(m2))
        throw { msg:"Wrong password for "+email };
      if(/signup|sign.?up/i.test(m2)&&/disabled|not allowed/i.test(m2))
        throw { msg:"No account here matches that email and password — check both" };
      throw e2;
    });
  });
}

function refreshSession(){
  if(!SYNC.session||!SYNC.session.refresh_token) return Promise.reject("no session");
  return fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST", headers:supaHeaders(false),
    body:JSON.stringify({ refresh_token:SYNC.session.refresh_token })
  }).then(function(r){ if(!r.ok) throw 0; return r.json() })
    .then(function(j){
      SYNC.session={ access_token:j.access_token, refresh_token:j.refresh_token,
        expires_at:Date.now()+((j.expires_in||3600)*1000),
        email:(j.user&&j.user.email)||(SYNC.session&&SYNC.session.email) };
      keepSession();
    });
}
function withFreshSession(){
  if(!SYNC.session) return Promise.reject("signed out");
  if(SYNC.session.expires_at-Date.now()>60000) return Promise.resolve();
  return refreshSession();
}
function signOut(){
  SYNC.session=null; SYNC.shadow={}; SYNC.queue={};
  SYNC.lastPull="1970-01-01T00:00:00Z";
  keepSession(); paintSync(); render();
}

/* ---- change detection ----
   The app mutates S.items freely and calls save(). Rather than ask every
   mutation site to declare what it touched, compare against a shadow copy of
   what the server last saw. Cheap at this scale, and impossible to forget. */
function stampChanges(){
  if(!SYNC.on) return;
  var seen={};
  S.items.forEach(function(i){
    seen[i.id]=1;
    var now=JSON.stringify(i);
    if(SYNC.shadow[i.id]!==now) SYNC.queue[i.id]="put";
  });
  Object.keys(SYNC.shadow).forEach(function(id){
    if(!seen[id]) SYNC.queue[id]="del";
  });
  keepSession();
  schedulePush();
}
function schedulePush(){
  if(!SYNC.on||!SYNC.session) { paintSync(); return }
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(pushChanges,1200);   // let a burst of edits settle
  paintSync();
}

/* ---- push ---- */
function pushChanges(){
  if(!SYNC.on||!SYNC.session) return Promise.resolve();
  var ids=Object.keys(SYNC.queue);
  if(!ids.length){ SYNC.status="idle"; paintSync(); return Promise.resolve() }

  var byId={};
  S.items.forEach(function(i){ byId[i.id]=i });
  var rows=ids.map(function(id){
    if(SYNC.queue[id]==="del"||!byId[id]) return { id:id, data:{}, deleted:true };
    return { id:id, data:byId[id], deleted:false };
  });

  SYNC.status="busy"; paintSync();
  return withFreshSession().then(function(){
    return fetch(SUPA.url+"/rest/v1/items?on_conflict=id",{
      method:"POST",
      headers:Object.assign(supaHeaders(true),{ "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body:JSON.stringify(rows)
    });
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    rows.forEach(function(row){
      if(row.deleted) delete SYNC.shadow[row.id];
      else SYNC.shadow[row.id]=JSON.stringify(row.data);
      delete SYNC.queue[row.id];
    });
    SYNC.status="idle"; SYNC.note=""; keepSession(); paintSync();
  }).catch(function(e){
    // keep the queue; it'll go up on the next attempt
    SYNC.status=navigator.onLine?"error":"offline";
    SYNC.note=String(e&&e.message||e);
    paintSync();
  });
}

/* ---- pull ---- */
function pullChanges(){
  if(!SYNC.on||!SYNC.session) return Promise.resolve();
  SYNC.status="busy"; paintSync();
  return withFreshSession().then(function(){
    var q="/rest/v1/items?select=id,data,modified,deleted"
      +"&modified=gt."+encodeURIComponent(SYNC.lastPull)
      +"&order=modified.asc";
    return fetch(SUPA.url+q,{ headers:supaHeaders(true) });
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(rows){
    if(rows.length) applyIncoming(rows);
    if(rows.length) SYNC.lastPull=rows[rows.length-1].modified;
    SYNC.status="idle"; SYNC.note=""; keepSession(); paintSync();
    return rows.length;
  }).catch(function(e){
    SYNC.status=navigator.onLine?"error":"offline";
    SYNC.note=String(e&&e.message||e);
    paintSync();
  });
}

/* Merge rule: the later edit wins, per item, judged by the app's own
   `modified` stamp rather than the server's. The server clock says when a row
   arrived; the item's own stamp says when a person actually changed it. */
function applyIncoming(rows){
  var byId={}, changed=0;
  S.items.forEach(function(i,ix){ byId[i.id]=ix });

  rows.forEach(function(row){
    var here=byId[row.id]!==undefined?S.items[byId[row.id]]:null;

    if(row.deleted){
      if(here){ S.items.splice(byId[row.id],1); rebuildIndex(); changed++ }
      delete SYNC.shadow[row.id];
      return;
    }
    var incoming=normalizeItem(row.data);
    if(!incoming) return;
    if(!here){
      /* Arrive at the top, not the bottom. Array order is the manual order,
         and the device that made this put it at the front — appending here
         meant the same note sat first on one machine and last on another. */
      S.items.unshift(incoming); rebuildIndex(); changed++;
    } else if((incoming.modified||0)>(here.modified||0)){
      // don't clobber something being edited right now
      if(S.editing===incoming.id) return;
      S.items[byId[row.id]]=incoming; changed++;
    }
    SYNC.shadow[row.id]=JSON.stringify(incoming);
  });

  function rebuildIndex(){ byId={}; S.items.forEach(function(i,ix){ byId[i.id]=ix }) }

  if(changed){
    try{ localStorage.setItem(KEY,JSON.stringify(S.items)) }catch(e){}
    render();
    toast(changed+" change"+(changed===1?"":"s")+" from another device");
  }
}

function syncNow(){
  return pullChanges().then(pushChanges);
}

/* =========================================================================
   BACKUP — the whole library as a file you own.

   Everything lives in this browser's storage, which is not a safe place for
   the only copy of anything. Export writes one plain-text .json file: every
   item, every image, every setting. Import reads it back, either merging it
   with what's here or replacing it outright.

   The format is deliberately dull and readable — a version number, a
   timestamp, a settings object and a flat array of items. Anything that can
   read JSON can read your notes, including you, in a text editor, in ten
   years, without this app.
   ========================================================================= */
var EXPORT_FORMAT="everything.library", EXPORT_VERSION=1;
var SETTING_KEYS=["trove.theme","trove.font","trove.quotes","trove.notesize",
  "trove.layouts","trove.brand","trove.grp.tasks"];

function settingsSnapshot(){
  var out={};
  SETTING_KEYS.forEach(function(k){
    try{ var v=localStorage.getItem(k); if(v!=null) out[k]=v }catch(e){}
  });
  return out;
}

// Fill in anything an older or hand-edited file is missing, so a partial
// record can never poison the app.
function normalizeItem(o){
  if(!o||typeof o!=="object") return null;
  if(o.type&&o.actionable===undefined) o=migrate([o])[0];   // a v1-era record
  var now=Date.now();
  return {
    id:String(o.id||uid()),
    title:String(o.title||""),
    body:toRich(o.body||""),
    url:String(o.url||""), image:String(o.image||""), desc:String(o.desc||""),
    logo:String(o.logo||""), site:String(o.site||""),
    metaState:o.metaState||null, titleAuto:!!o.titleAuto,
    actionable:!!o.actionable, due:(typeof o.due==="number")?o.due:null,
    timed:(o.timed!==undefined)?!!o.timed
      :!!(o.due&&(new Date(o.due).getHours()||new Date(o.due).getMinutes())),
    done:!!o.done, tint:String(o.tint||""), compiled:!!o.compiled,
    tags:Array.isArray(o.tags)?o.tags.map(String):[],
    photos:Array.isArray(o.photos)?o.photos.filter(function(p){ return p&&p.src }):[],
    checks:Array.isArray(o.checks)?o.checks.filter(function(c){ return c&&c.t })
      .map(function(c){ return {t:String(c.t),d:!!c.d} }):[],
    archived:!!o.archived,
    pin:!!o.pin,
    created:(typeof o.created==="number")?o.created:now,
    modified:(typeof o.modified==="number")?o.modified:(o.created||now)
  };
}

function exportLibrary(){
  var payload={
    format:EXPORT_FORMAT,
    version:EXPORT_VERSION,
    app:document.title,
    exportedAt:new Date().toISOString(),
    itemCount:S.items.length,
    settings:settingsSnapshot(),
    items:S.items
  };
  try{
    var text=JSON.stringify(payload,null,2);
    var blob=new Blob([text],{type:"application/json"});
    var d=new Date(), pad=function(n){ return (n<10?"0":"")+n };
    var name="everything-"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".json";
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
    try{ localStorage.setItem("trove.lastExport",String(Date.now())) }catch(e){}
    paintBackupHint();
    var kb=Math.round(text.length/1024);
    toast(S.items.length+" items exported · "+(kb>1024?(kb/1024).toFixed(1)+" MB":kb+" KB"));
  }catch(e){ toast("Couldn't build the file") }
}

function applyImport(data,mode){
  var incoming=(data.items||[]).map(normalizeItem).filter(Boolean);
  if(!incoming.length) return toast("Nothing to import");

  if(mode==="replace"){
    S.items=incoming;
    // settings travel with a full replace, not with a merge
    if(data.settings){
      Object.keys(data.settings).forEach(function(k){
        if(SETTING_KEYS.indexOf(k)>=0){ try{ localStorage.setItem(k,data.settings[k]) }catch(e){} }
      });
    }
    S.sel={}; save(); render();
    toast("Replaced with "+incoming.length+" items — reload to apply settings");
    return;
  }

  // merge: unknown ids are added, known ids win on whichever was edited last
  var byId={}, added=0, updated=0;
  S.items.forEach(function(x,ix){ byId[x.id]=ix });
  incoming.forEach(function(n){
    if(byId[n.id]===undefined){ S.items.push(n); added++ }
    else{
      var cur=S.items[byId[n.id]];
      if((n.modified||0)>(cur.modified||0)){ S.items[byId[n.id]]=n; updated++ }
    }
  });
  S.sel={}; save(); render();
  toast(added+" added, "+updated+" updated"+(added+updated?"":" — nothing new"));
}

function readImportFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    var data;
    try{ data=JSON.parse(fr.result) }catch(e){ return toast("That isn't a readable .json file") }
    if(!data||!Array.isArray(data.items)) return toast("No library found in that file");
    var n=data.items.length;
    var when=data.exportedAt?new Date(data.exportedAt).toLocaleString():"an unknown date";
    askChoice("Import "+n+" item"+(n===1?"":"s"),
      "From a backup made <b>"+esc(when)+"</b>.<br><br>"
      +"<b>Merge</b> keeps everything you have now and adds what's missing. "
      +"Where both copies exist, the one edited more recently wins.<br><br>"
      +"<b>Replace</b> discards your current "+S.items.length+" items entirely.",
      [{label:"Cancel",value:null,kind:"sec"},
       {label:"Replace",value:"replace",kind:"dan"},
       {label:"Merge",value:"merge"}],
      function(mode){
        if(!mode) return;
        if(mode!=="replace") return applyImport(data,mode);
        askChoice("Discard the "+S.items.length+" items here?",
          "Replacing throws away everything currently in the app and puts the "
          +"backup in its place. There is no undo.",
          [{label:"Cancel",value:false,kind:"sec"},{label:"Replace",value:true,kind:"dan"}],
          function(go){ if(go) applyImport(data,"replace") });
      });
  };
  fr.onerror=function(){ toast("Couldn't read that file") };
  fr.readAsText(file);
}

function paintBackupHint(){
  var el=document.getElementById("bkhint");
  if(!el) return;
  var last=0;
  try{ last=parseInt(localStorage.getItem("trove.lastExport")||"0",10) }catch(e){}
  if(!S.items.length){ el.textContent=""; el.className="bkhint"; return }
  if(!last){ el.textContent="Never backed up"; el.className="bkhint warn"; return }
  var days=Math.floor((Date.now()-last)/864e5);
  el.textContent = days<1 ? "Backed up today"
    : "Backed up "+days+" day"+(days===1?"":"s")+" ago";
  el.className="bkhint"+(days>=7?" warn":"");
}

/* =========================================================================
   COMPILE — turn the page you're looking at into one document.

   Each link becomes a paragraph of your own writing about it, with its key
   phrase hyperlinked back to the source. The phrase is the item's title: if
   it appears in what you wrote, the link is applied in place; otherwise the
   title leads the paragraph. Output as a note here, or a .doc you can open
   in Word or Pages with the links intact.
   ========================================================================= */

// Wrap the first plain-text occurrence of `phrase` in an anchor. Works on the
// DOM so it can't break tags, and won't touch text already inside a link.
function linkPhrase(html,phrase,url){
  if(!phrase) return null;
  var box=document.createElement("div");
  box.innerHTML=html;
  var found=null;
  (function walk(node){
    if(found) return;
    for(var k=0;k<node.childNodes.length;k++){
      var n=node.childNodes[k];
      if(found) return;
      if(n.nodeType===3){
        var at=n.data.indexOf(phrase);
        if(at>=0){ found={node:n,at:at}; return }
      } else if(n.nodeType===1 && n.tagName!=="A"){
        walk(n);
      }
    }
  })(box);
  if(!found) return null;
  var t=found.node, tail=t.splitText(found.at);
  tail.splitText(phrase.length);
  var a=document.createElement("a");
  a.setAttribute("href",url);
  a.setAttribute("target","_blank");
  a.setAttribute("rel","noopener noreferrer");
  tail.parentNode.insertBefore(a,tail);
  a.appendChild(tail);
  return box.innerHTML;
}

function compileEntry(i){
  var label=(i.title||host(i.url)||i.url).trim();
  var anchor='<a href="'+esc(i.url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>';
  var body=sanitizeRich(i.body||"");
  if(body){
    var inPlace=linkPhrase(body,label,i.url);
    if(inPlace) return inPlace;             // your sentence, with the link inside it
    return anchor+" — "+body;               // otherwise the title leads
  }
  return anchor+(i.desc?"<br>"+esc(i.desc):"");
}

function compileList(){
  return visible().filter(hasLink);
}
function compileBody(list){
  return list.map(function(i){ return compileEntry(i) }).join("<br><br>");
}
function compileTitle(){
  var lens=(LENS[S.view]||LENS.all).title;
  var scope=S.q?'"'+S.q+'"':(S.tag?"#"+S.tag:lens);
  return scope+" — "+new Date().toLocaleDateString([], {day:"numeric",month:"long",year:"numeric"});
}

function compileToNote(){
  var list=compileList();
  if(!list.length) return toast("No links on this page");
  var now=Date.now();
  var item={id:uid(),title:compileTitle(),body:sanitizeRich(compileBody(list)),
    url:"",image:"",desc:"",logo:"",site:"",metaState:null,titleAuto:false,
    actionable:false,due:null,done:false,tint:"doc",compiled:true,tags:[],photos:[],
    checks:[],archived:false,pin:false,created:now,modified:now};
  S.items.unshift(item);
  S.view="notes"; S.tag=null; S.q=""; document.getElementById("q").value="";
  save(); render();
  toast(list.length+" links compiled into a note");
  setTimeout(function(){ openEditor(item.id) },120);
}

function compileToDoc(){
  var list=compileList();
  if(!list.length) return toast("No links on this page");
  var title=compileTitle();
  var doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" '
    +'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    +'<head><meta charset="utf-8"><title>'+esc(title)+'</title></head><body>'
    +'<h1 style="font-family:Georgia,serif">'+esc(title)+'</h1>'
    +list.map(function(i){
      return '<p style="font-family:Georgia,serif;font-size:12pt;line-height:1.5">'
        +compileEntry(i)+'</p>';
    }).join("")
    +'</body></html>';
  try{
    var blob=new Blob(["﻿"+doc],{type:"application/msword"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=title.replace(/[\/\\:*?"<>|]/g,"-")+".doc";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
    toast(list.length+" links exported");
  }catch(e){ toast("Couldn't build the file") }
}

/* =========================================================================
   CAPTURE
   ========================================================================= */
var capin=document.getElementById("capin"), capmeta=document.getElementById("capmeta"),
    caphint=document.getElementById("caphint"), capicon=document.getElementById("capicon");

// the capture icon is drawn from the same set as the sidebar, so what you're
// about to make is announced in the app's own hand
var CAPI={
  note:'<svg viewBox="0 0 24 24"><path d="M4.5 19.5h15"/>'
    +'<path d="M15.6 4.9a2.1 2.1 0 0 1 3 3L9.4 17.1l-4 1 1-4z"/></svg>',
  link:'<svg viewBox="0 0 24 24"><path d="M10.2 13.8a3.9 3.9 0 0 0 5.6 0l2.5-2.5a3.9 3.9 0 1 0-5.6-5.6l-1 1"/>'
    +'<path d="M13.8 10.2a3.9 3.9 0 0 0-5.6 0l-2.5 2.5a3.9 3.9 0 1 0 5.6 5.6l1-1"/></svg>',
  task:'<svg viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/>'
    +'<path d="M8.2 12.3l2.7 2.7 5-5.4"/></svg>'
};

/* null = let the text decide; true/false = you've overridden it by clicking
   the task chip or pressing ⌘↵. Cleared after every save. */
var capForce=null;
function capActionable(p){ return capForce===null ? p.actionable : capForce }

/* A note is content; a link or a task is a labelled object. So text typed
   for a note becomes the note itself rather than a heading with nothing
   underneath it. Links and tasks keep the text as their label. */
function shapeCapture(p,actionable){
  if(p.url||actionable) return {title:p.title, body:toRich(p.body), checks:[]};

  var whole=p.title+(p.body?"\n"+p.body:"");
  // Paste a list and get a list: if two or more lines after the first are
  // bulleted, they become checklist items and the first line is the title.
  var lines=whole.split(/\r?\n/);
  if(lines.length>2){
    var rest=lines.slice(1).filter(function(l){ return l.trim() });
    var bullets=rest.filter(function(l){ return /^\s*[-*·•]\s+/.test(l) });
    if(bullets.length>=2 && bullets.length===rest.length){
      return {
        title:lines[0].trim(),
        body:"",
        checks:rest.map(function(l){ return {t:l.replace(/^\s*[-*·•]\s+/,"").trim(),d:false} })
      };
    }
  }
  return {title:"", body:toRich(whole), checks:[]};
}

function refreshCap(){
  capin.style.height="auto";
  capin.style.height=Math.min(capin.scrollHeight,180)+"px";
  if(!capin.value.trim()){ capmeta.classList.add("hide"); capicon.innerHTML=CAPI.note; return }
  capmeta.classList.remove("hide");
  var p=parse(capin.value), act=capActionable(p);
  capicon.innerHTML = act?CAPI.task : p.url?CAPI.link : CAPI.note;
  var bits=['<span class="chip">✎ note</span>'];
  if(p.url) bits.push('<span class="chip blue">⚭ link</span>');
  // this chip is a switch, not a readout — click it to force a checkbox on or off
  bits.push('<button class="chip tog'+(act?" acc":"")+'" id="cap-act" '
    +'title="'+(act?"Remove the checkbox":"Give this a checkbox")+'">☑ task</button>');
  if(p.due!=null) bits.push('<span class="chip '+(dueClass(p.due)==="past"?"red":"green")+'">◔ '+fmtDue(p.due,p.timed)+'</span>');
  else if(act) bits.push('<span class="chip">◇ Someday</span>');
  p.tags.forEach(function(t){ bits.push('<span class="chip">#'+esc(t)+'</span>') });
  bits.push('<span class="hint" style="margin-left:4px"><kbd>↵</kbd> save · '
    +'<kbd>⇧↵</kbd> new line · <kbd>⌘↵</kbd> as task</span>');
  caphint.innerHTML=bits.join(" ");
  var tog=document.getElementById("cap-act");
  if(tog) tog.addEventListener("click",function(){ capForce=!act; refreshCap(); capin.focus() });
}
/* After saving, stay put if the current lens can show the new item; otherwise
   follow it to a lens that can. Saving a link from Links keeps you in Links;
   jotting a note there moves you to Notes rather than filing it out of sight. */
function followItem(item){
  if(S.tag && (item.tags||[]).indexOf(S.tag)<0) S.tag=null;
  if(S.q){ S.q=""; document.getElementById("q").value="" }
  var lens=LENS[S.view];
  if(S.tag) return;
  if(!lens || !lens.test(item)) S.view=homeLens(item);
}

function commit(asTask){
  if(!capin.value.trim()) return;
  var p=parse(capin.value), now=Date.now();
  var act=(asTask===true)?true:capActionable(p);
  var shape=shapeCapture(p,act);
  var item={id:uid(),title:shape.title,body:shape.body,url:p.url,image:"",desc:"",logo:"",site:"",
    metaState:null,titleAuto:p.titleAuto,actionable:act,due:p.due,timed:!!p.timed,done:false,
    tint:"",tags:p.tags,photos:[],checks:shape.checks,archived:false,pin:false,created:now,modified:now};
  S.items.unshift(item);
  capin.value=""; capForce=null; refreshCap(); save();
  var names=[]; if(p.url) names.push("Links"); if(act) names.push("Tasks");
  if(!names.length) names.push("Notes");
  followItem(item);
  if(item.url) fetchMeta(item); else render();
  toast("Saved · "+names.join(" + "));
}

  scrim.classList.add("on");

  /* Browsers don't reliably scroll a contenteditable caret into view, and the
     sticky action bar covers the bottom of the sheet — so a long note left the
     cursor underneath it. Nudge the sheet whenever the caret leaves the frame. */
  /* Finding the caret's position on screen. A collapsed range on a freshly
     created empty line reports no rectangle at all — the old code then fell
     back to the containing element, which on an empty line is the whole note
     body. Its top is near the start of the note, so pressing Enter mid-way
     through a long note flung the view to the top. The fallback is now only
     trusted if it's the size of a line rather than the size of the note. */
  function caretRect(){
    var sel=window.getSelection();
    if(!sel||!sel.rangeCount) return null;
    var r=sel.getRangeAt(0).cloneRange();
    r.collapse(true);
    var rect=r.getClientRects()[0];
    if(rect&&rect.height) return rect;
    var node=r.startContainer;
    var el=(node&&node.nodeType===1)?node:(node&&node.parentNode);
    if(el&&el.getBoundingClientRect){
      var er=el.getBoundingClientRect();
      if(er.height&&er.height<=120) return er;      // a line, not the whole body
    }
    return null;
  }
  function keepCaretVisible(allowUp){
    var rect=caretRect();
    if(!rect) return;
    var box=sheet.getBoundingClientRect(), pad=118;   // room for the pinned bars
    if(rect.bottom>box.bottom-pad) sheet.scrollTop+=rect.bottom-(box.bottom-pad)+28;
    else if(allowUp&&rect.top<box.top+16) sheet.scrollTop-=box.top+16-rect.top+28;
  }

  /* ---- checklist ----

   "close", is not a trade worth making. Cancel is the explicit discard. */
var editorApply=null;
function dismissEditor(){ if(editorApply) editorApply(); else close() }

/* A click fires on the nearest common ancestor of press and release — so
   selecting text and releasing outside the sheet used to register as a click
   on the backdrop, and shut the note. Only treat it as a backdrop click if
   the press started there too. */
var pressedBackdrop=false;
scrim.addEventListener("mousedown",function(e){ pressedBackdrop=(e.target===scrim) });
scrim.addEventListener("click",function(e){
  if(e.target===scrim&&pressedBackdrop) dismissEditor();
  pressedBackdrop=false;
});

/* Photo edits inside the editor. These live outside openEditor so their
   listeners are registered exactly once — registering them per-open was
   what caused one dropped image to land in every note opened that session. */
function editingItem(){ return S.editing?byId(S.editing):null }
function repaintGallery(){
  var it=editingItem(), g=document.getElementById("e-gal");
  if(it&&g) g.innerHTML=photoGrid(it,true);
}
function addPhotosToEditing(photos){
  var it=editingItem();
  if(!it||!photos.length) return;
  it.photos=(it.photos||[]).concat(photos);
  it.modified=Date.now();
  save(); repaintGallery(); render();
  toast(photos.length+" image"+(photos.length>1?"s":"")+" added");
}
sheet.addEventListener("click",function(e){
  var rm=e.target.closest("[data-rmimg]");
  if(rm){
    e.preventDefault(); e.stopPropagation();
    var it=editingItem(); if(!it||!it.photos) return;
    it.photos.splice(+rm.dataset.rmimg,1);
    save(); repaintGallery(); render();
    return;
  }
  // A link inside the editable body would otherwise just place the caret.
  // Clicking one should go where it points, as it does everywhere else.
  var a=e.target.closest(".ebody a[href]");
  if(a){
    e.preventDefault(); e.stopPropagation();
    var href=a.getAttribute("href")||"";
    if(SAFE_HREF.test(href)) window.open(href,"_blank","noopener,noreferrer");
    return;
  }
  // inside the open note, a photo zooms
  var ph=e.target.closest("[data-photo]");
  if(ph){ e.stopPropagation(); openLight(ph.dataset.photo,+ph.dataset.idx) }
});
sheet.addEventListener("dragover",function(e){
  if(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],"Files")>=0) e.preventDefault();
});
sheet.addEventListener("drop",function(e){
  if(internalDrag) return;
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length) return;
  e.preventDefault(); e.stopPropagation();
  takeFiles(e.dataTransfer.files,function(photos){ addPhotosToEditing(photos) });
});

/* ⌘V with an image on the clipboard adds it to the open note.
   Bound to the document rather than the sheet because a paste fires at
   whatever holds focus, and with a note open that might be the body, the
   title, a checklist row, or nothing at all — but it always means the same
   thing. Registered once, at the top level: attaching this inside openEditor
   is what made a single dropped image land in every note opened that session.
   Text pastes fall straight through to the body's own plain-text handler. */
document.addEventListener("paste",function(e){
  if(!S.editing) return;
  var imgs=imageFilesFrom(e.clipboardData);
  if(!imgs.length) return;
  e.preventDefault(); e.stopPropagation();
  takeFiles(imgs,function(photos){ addPhotosToEditing(photos) });
},true);

/* =========================================================================
   IMAGE INPUT — file picker, drag & drop, paste, lightbox
   ========================================================================= */
function byId(id){ return S.items.filter(function(x){ return x.id===id })[0] }

var filepick=document.getElementById("filepick"), pickCB=null;
function pickFiles(cb){ pickCB=cb; filepick.value=""; filepick.click() }
filepick.addEventListener("change",function(){
  if(!filepick.files||!filepick.files.length) return;
  var cb=pickCB; pickCB=null;
  takeFiles(filepick.files,function(photos){ if(cb) cb(photos) });
});

/* ---- drag & drop ------------------------------------------------------
   Two rules keep this predictable:
   1. Exactly one handler processes a drop, guarded by a lock, so a single
      file can never be added twice.
   2. Drops only count inside the board or the open editor. Everywhere else
      is inert, and the hint pill says so before you let go.
   --------------------------------------------------------------------- */
var veil=document.getElementById("dropveil"), hotCard=null, dropBusy=false;

/* Two completely separate drags share this app: rearranging your own cards,
   and importing image files from outside. internalDrag keeps them apart —
   without it, dragging a card's photo looks exactly like dropping a file. */
var dragId=null, internalDrag=false;

function hasFiles(e){
  if(internalDrag) return false;
  return !!(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],"Files")>=0);
}

var dropline=document.getElementById("dropline");

function clearMarks(){
  board.querySelectorAll(".dropbefore,.dropafter").forEach(function(el){
    el.classList.remove("dropbefore","dropafter");
  });
}
function hideLine(){ dropline.classList.remove("on") }

// Draw the insertion line into the gap that just opened, in viewport coords.
function showLine(el,after,horiz){
  var r=el.getBoundingClientRect(), s=dropline.style;
  dropline.className="dropline on "+(horiz?"vert":"horiz");
  if(horiz){                                  // cards sit side by side → upright bar
    s.left=((after?r.right+14:r.left-18))+"px";
    s.top=(r.top+8)+"px";
    s.width="4px";
    s.height=Math.max(24,r.height-16)+"px";
  } else {                                    // stacked → bar lying across
    s.left=(r.left+2)+"px";
    s.top=((after?r.bottom+20:r.top-24))+"px";
    s.width=Math.max(40,r.width-4)+"px";
    s.height="4px";
  }
}
/* Marking a target opens the gap, which moves the target — so the line is
   placed once immediately (so it responds at once) and again once the gap
   has finished opening. Its own CSS transition turns the correction into a
   glide rather than a jump. */
var lineTimer;
function markTarget(el,after,horiz){
  clearMarks();
  el.classList.add(after?"dropafter":"dropbefore");
  showLine(el,after,horiz);
  clearTimeout(lineTimer);
  lineTimer=setTimeout(function(){
    if(internalDrag&&el.parentNode) showLine(el,after,horiz);
  },210);
}

function endReorder(){
  clearTimeout(lineTimer);
  clearMarks(); hideLine();
  board.querySelectorAll(".dragging").forEach(function(el){ el.classList.remove("dragging") });
  internalDrag=false; dragId=null;
}
function moveItem(id,targetId,after){
  if(!id||!targetId||id===targetId) return;
  var from=-1,to=-1,k;
  for(k=0;k<S.items.length;k++) if(S.items[k].id===id) from=k;
  if(from<0) return;
  var it=S.items.splice(from,1)[0];
  for(k=0;k<S.items.length;k++) if(S.items[k].id===targetId) to=k;
  if(to<0) S.items.unshift(it); else S.items.splice(after?to+1:to,0,it);
  save(); render();
}

board.addEventListener("dragstart",function(e){
  var el=e.target.closest(".card,.row-item");
  if(!el||!canReorder()){ e.preventDefault(); return }
  internalDrag=true; dragId=el.dataset.id;
  el.classList.add("dragging");
  try{
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("application/x-trove-item",dragId);
    e.dataTransfer.setData("text/plain","");     // Firefox refuses an empty payload
  }catch(err){}
});
board.addEventListener("dragover",function(e){
  if(!internalDrag) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect="move" }catch(err){}

  var el=e.target.closest(".card,.row-item");
  // Drifting over a gap between cards keeps the last target rather than
  // flickering the indicator off — the aim stays where you last pointed it.
  if(!el||el.dataset.id===dragId) return;

  var r=el.getBoundingClientRect();
  var horiz=(layoutFor()==="cards");
  var after = horiz ? e.clientX>r.left+r.width/2 : e.clientY>r.top+r.height/2;
  if(el.classList.contains(after?"dropafter":"dropbefore")) return;  // no change
  markTarget(el,after,horiz);
});
board.addEventListener("drop",function(e){
  if(!internalDrag) return;
  e.preventDefault(); e.stopPropagation();
  var mark=board.querySelector(".dropbefore,.dropafter");
  if(mark) moveItem(dragId,mark.dataset.id,mark.classList.contains("dropafter"));
  endReorder();
});
board.addEventListener("dragend",endReorder);
function clearHot(){ if(hotCard){ hotCard.classList.remove("dropping"); hotCard=null } }
function endDrag(){
  clearHot();
  veil.classList.remove("on","no");
  board.classList.remove("armed");
}
// One funnel for every image import. The lock closes the door until the
// current batch has finished decoding.
function takeFiles(files,cb){
  if(dropBusy) return;
  dropBusy=true;
  readImages(files).then(function(photos){
    dropBusy=false;
    if(photos.length) cb(photos);
  },function(){ dropBusy=false });
}
function zoneAt(x,y){
  var el=document.elementFromPoint(x,y);
  if(!el||!el.closest) return {zone:"none"};
  if(el.closest("#sheet")) return {zone:"editor"};
  if(scrim.classList.contains("on")) return {zone:"none"};
  var card=el.closest(".card,.row-item");
  if(card) return {zone:"card",card:card};
  if(el.closest("#board")||el.closest(".capwrap")) return {zone:"board"};
  return {zone:"none"};
}

window.addEventListener("dragover",function(e){
  if(!hasFiles(e)) return;
  var z=zoneAt(e.clientX,e.clientY);
  if(z.zone==="none"){
    e.dataTransfer.dropEffect="none";
    clearHot(); board.classList.remove("armed");
    veil.textContent="Drop over a note or the board";
    veil.classList.add("on","no");
    return;
  }
  e.preventDefault();
  e.dataTransfer.dropEffect="copy";
  veil.classList.remove("no");
  veil.classList.add("on");
  if(z.zone==="card"){
    if(z.card!==hotCard){ clearHot(); hotCard=z.card; hotCard.classList.add("dropping") }
    board.classList.remove("armed");
    veil.textContent="Add to this note";
  } else {
    clearHot();
    if(z.zone==="board"){ board.classList.add("armed"); veil.textContent="Drop to create a new note" }
    else { board.classList.remove("armed"); veil.textContent="Add to this note" }
  }
});
window.addEventListener("dragleave",function(e){
  // only when the pointer actually leaves the window
  if(e.clientX<=0&&e.clientY<=0) endDrag();
});
window.addEventListener("dragend",endDrag);
window.addEventListener("drop",function(e){
  if(internalDrag){ endDrag(); return }        // rearranging, not importing
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length){ endDrag(); return }
  var z=zoneAt(e.clientX,e.clientY), target=hotCard;
  endDrag();
  if(z.zone==="editor") return;          // the sheet's own handler takes it
  e.preventDefault();
  if(z.zone==="none") return;            // outside the board: ignore entirely
  takeFiles(e.dataTransfer.files,function(photos){
    var item=(z.zone==="card"&&(target||z.card))?byId((target||z.card).dataset.id):null;
    if(item) attachTo(item,photos); else newItemWithPhotos(photos);
  });
});

// paste an image while the capture box has focus
capin.addEventListener("paste",function(e){
  var files=imageFilesFrom(e.clipboardData);
  if(!files.length) return;
  e.preventDefault();
  takeFiles(files,function(photos){
    var text=capin.value.trim();
    if(text){                              // pasted alongside typed text → one item
      var p=parse(capin.value), now=Date.now(), act=capActionable(p), sh=shapeCapture(p,act);
      S.items.unshift({id:uid(),title:sh.title,body:sh.body,url:p.url,image:"",desc:"",logo:"",site:"",
        metaState:null,titleAuto:p.titleAuto,actionable:act,due:p.due,timed:!!p.timed,done:false,
        tint:"",tags:p.tags,photos:photos,checks:sh.checks,archived:false,pin:false,created:now,modified:now});
      capin.value=""; capForce=null; refreshCap(); followItem(S.items[0]); save(); render();
      toast("Saved with "+photos.length+" image"+(photos.length>1?"s":""));
    } else newItemWithPhotos(photos);
  });
});

var light=document.getElementById("light"), lightimg=document.getElementById("lightimg"),
    lightnav=document.getElementById("lightnav"), lightSet=[], lightIx=0;
function openLight(id,ix){
  var it=byId(id); if(!it||!hasPhotos(it)) return;
  lightSet=it.photos; lightIx=ix||0; light.classList.add("on"); paintLight();
}
function paintLight(){
  lightimg.src=lightSet[lightIx].src;
  lightnav.innerHTML = lightSet.length>1
    ? '<button data-step="-1">‹</button><span>'+(lightIx+1)+' / '+lightSet.length
      +'</span><button data-step="1">›</button>' : "";
}
function stepLight(d){ lightIx=(lightIx+d+lightSet.length)%lightSet.length; paintLight() }
light.addEventListener("click",function(e){
  var s=e.target.closest("[data-step]");
  if(s){ stepLight(+s.dataset.step); return }
  light.classList.remove("on");
});

/* =========================================================================
   EVENTS
   ========================================================================= */

board.addEventListener("click",function(e){
  // a link written inside a note goes where it points, not to the editor
  var inline=e.target.closest(".cbody a[href],.rexc a[href]");
  if(inline){ e.stopPropagation(); return }

  // Photos on a card are part of the card. Clicking one opens the note,
  // like clicking anywhere else on it. Zooming happens inside the note.
  var op=e.target.closest("[data-open]");
  if(op){
    e.stopPropagation();
    var oi=byId(op.dataset.open);
    if(oi&&oi.url) window.open(oi.url,"_blank","noopener,noreferrer");
    return;
  }

  var ai=e.target.closest("[data-addimg]");
  if(ai){
    e.stopPropagation();
    var target=byId(ai.dataset.addimg);
    pickFiles(function(photos){ if(target) attachTo(target,photos) });
    return;
  }

  var rf=e.target.closest("[data-refetch]");
  if(rf){
    e.stopPropagation();
    var r=byId(rf.dataset.refetch);
    if(r){
      // wipe what we guessed so every source gets a clean run
      r.image=""; r.desc=""; r.logo=""; r.site=""; r.metaState=null;
      fetchMeta(r,true);
    }
    return;
  }

  var pn=e.target.closest("[data-pin]");
  if(pn){ e.stopPropagation(); var p=byId(pn.dataset.pin); if(p){ p.pin=!p.pin; save(); render() } return }

  var ac=e.target.closest("[data-act]");
  if(ac){
    e.stopPropagation();
    var a=byId(ac.dataset.act);
    if(a){
      a.actionable=!a.actionable;
      if(!a.actionable){ a.due=null; a.done=false }
      save(); render();
      toast(a.actionable?"Now a task too":"Checkbox removed");
    }
    return;
  }

  var chk=e.target.closest("[data-check]");
  if(chk){
    e.stopPropagation();
    var c=byId(chk.dataset.check);
    if(c){ c.done=!c.done; c.completedAt=c.done?Date.now():null; save(); render(); if(c.done) toast("Nice.") }
    return;
  }

  // ticking a checklist item straight from the card
  var ck=e.target.closest("[data-ck]");
  if(ck){
    e.stopPropagation();
    var parts=ck.dataset.ck.split("|"), ci=byId(parts[0]);
    if(ci&&ci.checks&&ci.checks[+parts[1]]){
      var c=ci.checks[+parts[1]];
      c.d=!c.d; ci.modified=Date.now();
      save(); render();
    }
    return;
  }

  var au=e.target.closest("[data-auto]");
  if(au){ e.stopPropagation(); S.view=au.dataset.auto; S.tag=null; S.sel={}; render(); return }

  var pk=e.target.closest("[data-pick]");
  if(pk){ e.stopPropagation(); togglePick(pk.dataset.pick); return }

  var row=e.target.closest(".card,.row-item");
  if(!row) return;
  // while a selection is live, clicking adds to it rather than opening
  if(selCount()) togglePick(row.dataset.id); else openEditor(row.dataset.id);
});

/* ---- multi-select ----------------------------------------------------
   The tick appears on hover. Once anything is picked, a plain click on a
   card adds to the selection instead of opening it — so you can rattle
   through a page without aiming at small targets. Esc clears.
   --------------------------------------------------------------------- */
var selbar=document.getElementById("selbar"), selcnt=document.getElementById("selcnt");
function selIds(){ return Object.keys(S.sel) }
function selCount(){ return selIds().length }
function paintSel(){
  var n=selCount();
  selbar.classList.toggle("on",n>0);
  document.body.classList.toggle("selecting",n>0);
  selcnt.textContent=n+" selected";
}
function togglePick(id){
  if(S.sel[id]) delete S.sel[id]; else S.sel[id]=1;
  render();
}
function clearSel(){ S.sel={}; render() }

selbar.addEventListener("click",function(e){
  var b=e.target.closest("[data-sel]"); if(!b) return;
  var ids=selIds(), n=ids.length;
  if(!n) return;
  var act=b.dataset.sel;

  if(act==="all"){
    visible().forEach(function(x){ S.sel[x.id]=1 });
    render(); return;
  }
  if(act==="clear"){ clearSel(); return }

  if(act==="arch"){
    // if everything picked is already archived, put it all back instead
    var allArch=ids.every(function(id){ var x=byId(id); return x&&x.archived });
    S.items.forEach(function(x){
      if(S.sel[x.id]){ x.archived=!allArch; x.modified=Date.now() }
    });
    S.sel={}; save(); render();
    toast(allArch?(n+" put back"):(n+" archived"));
    return;
  }

  if(act==="del"){
    askChoice("Delete "+n+" item"+(n===1?"":"s")+"?",
      "This can't be undone. Export first if you might want them back.",
      [{label:"Cancel",value:false,kind:"sec"},{label:"Delete",value:true,kind:"dan"}],
      function(go){
        if(!go) return;
        S.items=S.items.filter(function(x){ return !S.sel[x.id] });
        S.sel={}; save(); render(); toast(n+" deleted");
      });
    return;
  }

  // adding: your most-used tags that aren't already on all of them
  // removing: only tags actually present on the selection
  var counts={}, onSel={};
  S.items.forEach(function(x){
    (x.tags||[]).forEach(function(t){
      counts[t]=(counts[t]||0)+1;
      if(S.sel[x.id]) onSel[t]=(onSel[t]||0)+1;
    });
  });
  var sugs = act==="tag"
    ? Object.keys(counts).filter(function(t){ return (onSel[t]||0)<n })
        .sort(function(a,b){ return counts[b]-counts[a] }).slice(0,6)
    : Object.keys(onSel).sort(function(a,b){ return onSel[b]-onSel[a] });

  askTag(act==="tag"?"Tag "+n+" item"+(n===1?"":"s"):"Remove a tag from "+n+" item"+(n===1?"":"s"),
    act==="tag" ? "Pick one you already use, or type a new one."
                : "These are the tags currently on your selection.",
    sugs, act==="tag"?"Add":"Remove",
    function(word){
      var tag=String(word).trim().toLowerCase().replace(/^#/,"").replace(/\s+/g,"-");
      if(!tag) return;
      var touched=0;
      S.items.forEach(function(x){
        if(!S.sel[x.id]) return;
        x.tags=x.tags||[];
        var at=x.tags.indexOf(tag);
        if(act==="tag"&&at<0){ x.tags.push(tag); x.modified=Date.now(); touched++ }
        if(act==="untag"&&at>=0){ x.tags.splice(at,1); x.modified=Date.now(); touched++ }
      });
      save(); render();
      toast(touched?("#"+tag+(act==="tag"?" added to ":" removed from ")+touched):"Nothing changed");
    });
});

/* ---- a small dialog for choices that need more than yes/no ---- */
var ask=document.getElementById("ask"), askbox=document.getElementById("askbox"), askCB=null;
function askChoice(title,html,choices,cb){
  askCB=cb;
  askbox.innerHTML='<h3>'+esc(title)+'</h3><p>'+html+'</p><div class="askrow">'
    +choices.map(function(c,ix){
      return '<button class="btn'+(c.kind?" "+c.kind:"")+'" data-ch="'+ix+'">'+esc(c.label)+'</button>';
    }).join("")+'</div>';
  ask.classList.add("on");
  askbox.onclick=function(e){
    var b=e.target.closest("[data-ch]"); if(!b) return;
    // Take the callback and clear it BEFORE running it. If the callback opens
    // a second dialog — as Replace does, to confirm — clearing afterwards
    // wiped the new dialog's callback, and its buttons did nothing.
    var cb=askCB;
    askCB=null;
    closeAsk();
    if(cb) cb(choices[+b.dataset.ch].value);
  };
}
/* Same dialog, with a field. Used instead of the browser's own prompt, which
   appears detached from the app and looks nothing like it. */
function askText(title,html,initial,label,cb){
  askbox.innerHTML='<h3>'+esc(title)+'</h3><p>'+html+'</p>'
    +'<input class="askin" id="askinput" spellcheck="false" value="'+esc(initial)+'">'
    +'<div class="askrow"><button class="btn sec" data-ax="0">Cancel</button>'
    +'<button class="btn" data-ax="1">'+esc(label)+'</button></div>';
  ask.classList.add("on");
  var input=document.getElementById("askinput");
  setTimeout(function(){ input.focus(); input.select() },40);
  function finish(ok){ var v=input.value; closeAsk(); askCB=null; if(ok) cb(v) }
  askCB=function(){};
  askbox.onclick=function(e){
    var b=e.target.closest("[data-ax]"); if(!b) return;
    finish(b.dataset.ax==="1");
  };
  input.onkeydown=function(e){
    if(e.key==="Enter"){ e.preventDefault(); finish(true) }
    if(e.key==="Escape"){ e.preventDefault(); finish(false) }
  };
}
/* Same dialog again, with the tags you already use offered as chips — the
   tagging experience should be the same everywhere in the app, not "pick
   from a list here, type blind there". Clicking a chip applies it at once. */
function askTag(title,html,suggestions,label,cb){
  askbox.innerHTML='<h3>'+esc(title)+'</h3><p>'+html+'</p>'
    +(suggestions.length
      ? '<div class="askchips">'+suggestions.map(function(t){
          return '<button class="sug" data-tagpick="'+esc(t)+'">#'+esc(t)+'</button>';
        }).join("")+'</div>'
      : '')
    +'<input class="askin" id="askinput" spellcheck="false" placeholder="'
      +(suggestions.length?"or type another":"type a tag")+'">'
    +'<div class="askrow"><button class="btn sec" data-ax="0">Cancel</button>'
    +'<button class="btn" data-ax="1">'+esc(label)+'</button></div>';
  ask.classList.add("on");
  var input=document.getElementById("askinput");
  setTimeout(function(){ input.focus() },40);
  function finish(val){ closeAsk(); askCB=null; if(val) cb(val) }
  askCB=function(){};
  askbox.onclick=function(e){
    var chip=e.target.closest("[data-tagpick]");
    if(chip){ finish(chip.dataset.tagpick); return }
    var b=e.target.closest("[data-ax]"); if(!b) return;
    finish(b.dataset.ax==="1"?input.value:null);
  };
  input.onkeydown=function(e){
    if(e.key==="Enter"){ e.preventDefault(); finish(input.value) }
    if(e.key==="Escape"){ e.preventDefault(); finish(null) }
  };
}
/* Two fields, one button. Used only for signing in. */
function askLogin(cb){
  askbox.innerHTML='<h3>Sync across your devices</h3>'
    +'<p>Pick an email and a password. The same pair on any device — Mac, '
    +'phone, iPad — opens the same library.<br><br>'
    +'First time through, this creates the account. After that it signs you '
    +'in. No email is sent and nothing to confirm.</p>'
    +'<input class="askin" id="askemail" type="email" spellcheck="false" '
      +'autocomplete="username" placeholder="you@example.com">'
    +'<input class="askin" id="askpw" type="password" '
      +'autocomplete="current-password" placeholder="a password you choose">'
    +'<div class="askrow"><button class="btn sec" data-ax="0">Cancel</button>'
    +'<button class="btn" data-ax="1">Continue</button></div>';
  ask.classList.add("on");
  var em=document.getElementById("askemail"), pw=document.getElementById("askpw");
  setTimeout(function(){ em.focus() },40);
  function finish(ok){
    var a=em.value.trim(), b=pw.value;
    closeAsk(); askCB=null;
    if(ok) cb(a,b);
  }
  askCB=function(){};
  askbox.onclick=function(e){
    var t=e.target.closest("[data-ax]"); if(!t) return;
    finish(t.dataset.ax==="1");
  };
  [em,pw].forEach(function(el){
    el.onkeydown=function(e){
      if(e.key==="Enter"){ e.preventDefault(); finish(true) }
      if(e.key==="Escape"){ e.preventDefault(); finish(false) }
    };
  });
}

/* Renaming a tag. The obvious place is the tag's own page, so there's a
   Rename button in the header whenever you're looking at one. Right-clicking
   it in the sidebar does the same thing, for when you already know. */
function renameTag(old){
  var used=S.items.filter(function(x){ return (x.tags||[]).indexOf(old)>=0 }).length;
  askText("Rename #"+old,
    "Renaming changes it on all <b>"+used+"</b> item"+(used===1?"":"s")+" that carry it. "
    +"If a tag by the new name already exists, the two merge.",
    old, "Rename",
    function(v){
      var next=v.trim().toLowerCase().replace(/^#/,"").replace(/\s+/g,"-");
      if(!next||next===old) return;
      var merged=S.items.some(function(x){
        return (x.tags||[]).indexOf(old)>=0 && (x.tags||[]).indexOf(next)>=0;
      });
      var n=0;
      S.items.forEach(function(x){
        var at=(x.tags||[]).indexOf(old);
        if(at<0) return;
        x.tags.splice(at,1);
        if(x.tags.indexOf(next)<0) x.tags.push(next);
        x.modified=Date.now(); n++;
      });
      if(S.tag===old) S.tag=next;
      if(S.layouts["tag:"+old]){                   // the page keeps its layout
        S.layouts["tag:"+next]=S.layouts["tag:"+old];
        delete S.layouts["tag:"+old];
        try{ localStorage.setItem("trove.layouts",JSON.stringify(S.layouts)) }catch(err){}
      }
      save(); render();
      toast("#"+old+" → #"+next+" on "+n+" item"+(n===1?"":"s")+(merged?" · merged":""));
    });
}
document.getElementById("tagedit").addEventListener("click",function(){

/* Keyboard focus is layered, and each layer swallows what belongs to it.
   Without this, ⌘K or an undo pressed inside an open note also reached the
   board behind it — which is why text was appearing and vanishing in the
   capture field while you were typing in the editor. */
function isTyping(){
  var el=document.activeElement;
  if(!el) return false;
  var t=(el.tagName||"").toLowerCase();
  return t==="input"||t==="textarea"||el.isContentEditable;
}

document.addEventListener("keydown",function(e){
  // 0. a question is on screen and owns the keyboard until answered
  if(ask.classList.contains("on")){
    if(e.key==="Escape"){ e.preventDefault(); closeAsk(); askCB=null }
    return;
  }
  // 1. the lightbox is on top of everything
  if(light.classList.contains("on")){
    if(e.key==="Escape"){ e.preventDefault(); light.classList.remove("on") }
    else if(e.key==="ArrowRight"){ e.preventDefault(); stepLight(1) }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); stepLight(-1) }
    return;
  }

  // 2. an open note is modal. Escape leaves; every other key — including
  //    ⌘X, ⌘Z and the app's own shortcuts — belongs to the editor alone.
  if(scrim.classList.contains("on")){
    if(e.key==="Escape") dismissEditor();   // saves, rather than discarding
    return;
  }

  // 3. app-level shortcuts, only once nothing above has claimed the keyboard
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault(); capin.focus(); return;
  }
  if(e.key==="Escape"&&selCount()){ clearSel(); return }
  if(e.key==="/"&&!isTyping()){ e.preventDefault(); document.getElementById("q").focus() }
});

/* Typeface switch — Geologica is fetched from Google Fonts the first time you
   ask for it, so the app still works offline on the system face. */
function setFont(f){
  if(f==="geologica"&&!document.getElementById("gfont")){
    var l=document.createElement("link");
    l.id="gfont"; l.rel="stylesheet";
    // range form — Geologica is variable, so 350 and friends all resolve
    l.href="https://fonts.googleapis.com/css2?family=Geologica:wght@200..600&display=swap";
    document.head.appendChild(l);
  }
  document.documentElement.setAttribute("data-font",f);
  document.getElementById("fontbtn").textContent = f==="geologica"?"Aa Geologica 200":"Aa System";
  try{ localStorage.setItem("trove.font",f) }catch(e){}
}

/* The name. "Everything" is the one in use; "Trove" is kept as the fallback,
   one click away on the logo. */
var BRANDS=["Everything","Trove"];
/* Set it as large as the sidebar will take, then back off one pixel at a time
   until it fits. Guessing from character counts is unreliable with a script
   face — and the font arrives after first paint, so this runs again then. */
var BRAND_MAX=52, BRAND_MIN=26;
function fitBrand(){
  var el=document.getElementById("brandname");
  if(!el||!el.clientWidth) return;
  var size=BRAND_MAX;
  el.style.fontSize=size+"px";
  while(size>BRAND_MIN && el.scrollWidth>el.clientWidth){
    size-=1;
    el.style.fontSize=size+"px";
  }
}
function setBrand(name){
  var n=BRANDS.indexOf(name)>=0?name:BRANDS[0];
  document.getElementById("brandname").textContent=n;
  document.title=n;
  // the tagline follows whichever name is in use
  document.getElementById("tagline").textContent="This is "+n;
  document.getElementById("copyline").textContent="© "+new Date().getFullYear()+" Social Capital";
  fitBrand();
  try{ localStorage.setItem("trove.brand",n) }catch(e){}
}
/* A missing webfont fails silently, which is a miserable thing to debug. Ask
   the browser whether it actually has Cookie, and say so if it doesn't. */
function checkBrandFont(){
  var el=document.getElementById("fonthint");
  if(!el) return;
  var ok=true;
  try{ ok=document.fonts.check('30px "Cookie"') }catch(e){}
  el.style.display=ok?"none":"";
}
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(function(){ fitBrand(); checkBrandFont() });
}
window.addEventListener("resize",fitBrand);
document.getElementById("brand").addEventListener("click",function(){
  var cur=document.getElementById("brandname").textContent;
  setBrand(BRANDS[(BRANDS.indexOf(cur)+1)%BRANDS.length]);
});

/* ---- sync controls ---- */
function paintSync(){
  var b=document.getElementById("syncbtn");
  if(!b) return;
  if(!SYNC.on){ b.style.display="none"; return }
  /* Short, and all roughly the same length — the label changes several times
     a minute, and a button that resizes each time reads as a fault. */
  var waiting=Object.keys(SYNC.queue).length;
  var label, cls="";
  if(!SYNC.session){ label="☁ Sign in"; cls="out" }
  else if(SYNC.status==="busy"){ label="☁ Syncing"; cls="busy" }
  else if(SYNC.status==="offline"){ label="☁ Offline"; cls="err" }
  else if(SYNC.status==="error"){ label="☁ Failed"; cls="err" }
  else if(waiting){ label="☁ "+waiting+" to go"; cls="busy" }
  else label="☁ Synced";
  b.textContent=label;
  b.className="ghost syncbtn"+(cls?" "+cls:"");
  b.title=SYNC.session
    ? (SYNC.session.email?("Signed in as "+SYNC.session.email):"Signed in")
      +(SYNC.note?" — "+SYNC.note:"")
    : "Sync this library across your devices";
}

document.getElementById("syncbtn").addEventListener("click",function(){
  if(!SYNC.session){
    askLogin(function(email,pw){
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("That doesn't look like an email");
      if(!pw||pw.length<6) return toast("Use at least six characters");
      toast("Signing in…");
      signInOrUp(email,pw).then(function(){
        paintSync();
        // never let sample content masquerade as yours
        if(DEMO){
          S.items=[]; SYNC.shadow={}; SYNC.queue={};
          SYNC.lastPull="1970-01-01T00:00:00Z";
          notDemoAnyMore();
          try{ localStorage.setItem(KEY,"[]") }catch(e){}
        }
        return syncNow();
      }).then(function(){
        toast("Signed in — library synced");
      }).catch(function(e){
        toast(String(e&&(e.msg||e.error_description||e.message)||"Couldn't sign in"));
      });
    });
    return;
  }
  askChoice("Sync",
    (SYNC.session.email?"Signed in as <b>"+esc(SYNC.session.email)+"</b>.":"Signed in.")
    +" "+(Object.keys(SYNC.queue).length
      ? Object.keys(SYNC.queue).length+" change(s) waiting to go up."
      : "Everything here is up to date.")
    +(SYNC.note?"<br><br>Last problem: "+esc(SYNC.note):""),
    [{label:"Sign out",value:"out",kind:"dan"},
     {label:"Close",value:null,kind:"sec"},
     {label:"Sync now",value:"now"}],
    function(v){
      if(v==="now"){ syncNow().then(function(){ toast("Synced") }) }
      if(v==="out"){
        askChoice("Sign out?",
          "Your library stays on this device. It simply stops syncing.",
          [{label:"Cancel",value:false,kind:"sec"},{label:"Sign out",value:true,kind:"dan"}],
          function(go){ if(go){ signOut(); toast("Signed out") } });
      }
    });
});

/* The Reset button lived here. It replaced the library with sample content —
   harmless when that library was a demo, and actively hazardous now: with
   sync on, a reset would push twelve sample notes to every device you own and
   delete everything real in the process. There is no undo, and nothing it did
   that Import can't do better. Removed rather than guarded. */

var tEl=document.getElementById("toast"), tTimer;
function toast(msg){
  tEl.textContent=msg; tEl.classList.add("on");
  clearTimeout(tTimer); tTimer=setTimeout(function(){ tEl.classList.remove("on") },1700);
}

/* ============ boot ============ */
function backfill(){
  S.items.forEach(function(i){ if(i.url&&!i.image&&i.metaState!=="fail") fetchMeta(i) });
}
try{ var th=localStorage.getItem("trove.theme"); if(th) document.documentElement.setAttribute("data-theme",th) }catch(e){}

try{ var ly=localStorage.getItem("trove.layouts"); if(ly) S.layouts=JSON.parse(ly)||{} }catch(e){}
try{ var ns=localStorage.getItem("trove.notesize"); setNoteSize(ns==null?2:parseInt(ns,10)) }
catch(e){ setNoteSize(2) }
try{ setQuotes(localStorage.getItem("trove.quotes")||"gr") }catch(e){ setQuotes("gr") }
try{ setBrand(localStorage.getItem("trove.brand")||"Everything") }catch(e){ setBrand("Everything") }

try{
  if(localStorage.getItem("trove.grp.tasks")==="0"){
    document.getElementById("grp-tasks").classList.add("closed");
    document.querySelector('[data-toggle="tasks"]').classList.add("closed");
  }
}catch(e){}
attachSmartQuotes(capin,false);
var stored=load();
if(stored){
  S.items=stored;
  try{ DEMO=localStorage.getItem("trove.demo")==="1" }catch(e){}
} else {
  S.items=enrich(seed());
  DEMO=true;
  try{ localStorage.setItem("trove.demo","1") }catch(e){}
}
save(); render(); refreshCap();
BOOTED=true;   // from here on, a save means a person did something
setTimeout(backfill,350);

/* ---- start syncing ---- */
if(SYNC.on){
  loadSession();
  paintSync();
  if(SYNC.session){
    syncNow();
    setInterval(function(){ if(SYNC.session&&SYNC.status!=="busy") pullChanges() },60000);
    window.addEventListener("focus",function(){ if(SYNC.session) syncNow() });
    window.addEventListener("online",function(){ if(SYNC.session) syncNow() });
    // don't leave with edits stranded in the queue
    window.addEventListener("pagehide",function(){
      if(Object.keys(SYNC.queue).length) pushChanges();
    });
  }
}
})();

/* Offline. The worker keeps a copy of the app so it opens on the Underground,
   on a plane, or when the wifi is lying about being connected. Your library
   was always local anyway; this just means the app itself is too. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
