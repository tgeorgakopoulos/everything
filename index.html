<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F5F4">
<title>Everything</title>
<!-- Four things in a square: a collection. Same mark as the All icon, inline
     so the app stays a single file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F6B63'/%3E%3Cg fill='%23F3F5F4'%3E%3Crect x='13' y='13' width='17' height='17' rx='5'/%3E%3Crect x='34' y='13' width='17' height='17' rx='5'/%3E%3Crect x='13' y='34' width='17' height='17' rx='5'/%3E%3Crect x='34' y='34' width='17' height='17' rx='5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Everything">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cookie&display=swap">
<style>
  :root{
    --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#FAFCFB;
    --ink:#161A19; --muted:#616D6B; --faint:#7F8B89;
    /* body copy on cards — clearly readable, still subordinate to the title */
    --read:#3C4544;
    /* controls: nav rows, buttons, toggles. Deliberately darker than --muted
       so you never have to hunt for an interactive element. */
    --ui:#4C5755;
    /* app-wide text scale, driven by the A− / A+ controls in the sidebar */
    --tscale:1;
    --line:rgba(22,26,25,.13); --line-strong:rgba(22,26,25,.26);
    --accent:#1F6B63; --accent-soft:rgba(31,107,99,.12);
    --blue:#44579F; --green:#5F8442; --red:#B4443A;
    --shadow:0 1px 2px rgba(22,26,25,.04), 0 6px 20px -8px rgba(22,26,25,.10);
    --shadow-lg:0 10px 40px -12px rgba(22,26,25,.22);
    --r:14px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
    /* what your writing is set in. The chrome always uses --sans; only this
       follows the typeface switch. */
    --content:var(--sans);
  }
  /* The previous palette, kept for reference. Warmer, and by your account
     better in daily use than the teal that replaced it — paste back over the
     light and dark blocks above to return to it.
       light  bg #F7F6F3  surface #FFFFFF  surface-2 #FDFCFA
              ink #1A1917  muted #6E6A62  faint #89847C  read #45433D  ui #57534B
              line rgba(26,25,23,.13)  line-strong rgba(26,25,23,.26)
              accent #C2683F  accent-soft rgba(194,104,63,.10)
              blue #3E6EA8  green #4B7B52  red #B4443A
       dark   bg #131211  surface #1C1B19  surface-2 #211F1D
              ink #EDEBE6  muted #ABA69C  faint #837E75  read #C6C2BA  ui #BDB8AE
              accent #E08A5F  accent-soft rgba(224,138,95,.14)
              blue #7FA8D8  green #7FB088  red #E0736A                        */
  /* Everything you write. The interface around it is deliberately excluded —
     the sidebar, buttons and headings stay on the system face, which keeps
     the chrome quiet and lets the typeface switch be about your words. */
  .ctitle,.cbody,.desc,.etitle,.ebody,.rtitle,.rexc,.chk,.ckin,
  .cap textarea{font-family:var(--content)}

  /* Geologica at ExtraLight (200), scoped to that content only. */
  [data-font="geologica"]{
    --content:"Geologica",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  /* Light (300) rather than ExtraLight (200) for anything you write in.
     ExtraLight is lovely on a logo and thin on a paragraph — it sat below the
     system face's natural weight and made writing feel faint. Change 300 to
     200 here to go back. */
  [data-font="geologica"] .cbody,
  [data-font="geologica"] .ebody,
  [data-font="geologica"] .desc,
  [data-font="geologica"] .rexc,
  [data-font="geologica"] .chk,
  [data-font="geologica"] .cap textarea{font-weight:300;letter-spacing:.004em}
  /* Titles need real weight against a 200 body. 360 was too close to the
     body text to read as a heading, and collapses entirely if only the
     ExtraLight cut of Geologica is installed rather than the variable font. */
  [data-font="geologica"] .ctitle,
  [data-font="geologica"] .etitle,
  [data-font="geologica"] .rtitle,
  [data-font="geologica"] .ckin{font-weight:500;letter-spacing:.002em}
  [data-font="geologica"] .cbody strong,
  [data-font="geologica"] .cbody b,
  [data-font="geologica"] .ebody strong,
  [data-font="geologica"] .ebody b{font-weight:600}
  [data-theme="dark"]{
    --bg:#101413; --surface:#181E1D; --surface-2:#1D2423;
    --ink:#E8EDEC; --muted:#9EAAA8; --faint:#798482; --read:#BFC8C7;
    --ui:#B4BFBD;
    --line:rgba(232,237,236,.14); --line-strong:rgba(232,237,236,.28);
    --accent:#4FB3A6; --accent-soft:rgba(79,179,166,.16);
    --blue:#95A6E4; --green:#9BBA72; --red:#E0736A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
    --shadow-lg:0 10px 40px -12px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
    line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,textarea,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  ::selection{background:var(--accent-soft)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;height:100vh;height:100dvh}
  .sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:14px 10px 10px;gap:2px;overflow-y:auto}
  .brand{display:block;padding:2px 6px 18px;width:100%;text-align:center;
    user-select:none;border-radius:9px}
  /* Cookie is a script face — it carries far less optical weight per point
     than the UI type, so it needs real size to outrank the view heading.
     The size is a starting point: fitBrand() steps it down if the actual
     font metrics turn out wider than the sidebar. */
  .brand h1{font-family:"Cookie","Snell Roundhand","Brush Script MT",cursive;
    font-size:52px;font-weight:400;line-height:1;letter-spacing:.005em;
    color:var(--ink);padding:2px 0 12px;white-space:nowrap;overflow:hidden;
    transition:color .14s,transform .16s cubic-bezier(.2,.8,.3,1);
    transform-origin:center}
  .brand:hover h1{color:var(--accent);transform:rotate(-1.2deg) scale(1.02)}
  .navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);padding:16px 12px 6px;font-weight:600;display:flex;align-items:center;gap:6px}
  /* padding-right reserves a gutter for the disclosure arrow on every row,
     so the counts line up in one column whether a row has an arrow or not */
  .nav{display:flex;align-items:center;gap:9px;padding:7px 26px 7px 10px;border-radius:9px;
    color:var(--ui);font-weight:520;transition:background .12s,color .12s;
    width:100%;text-align:left;position:relative}
  .nav:hover{background:var(--line);color:var(--ink)}
  .nav.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:560}
  /* Drawn icons rather than typographic symbols — consistent stroke and
     optical weight, and they carry the accent, which is the only colour in
     the sidebar besides the tag dots. */
  .nav .ico{width:18px;height:18px;flex:none;display:grid;place-items:center;
    color:var(--accent);opacity:.85;transition:opacity .12s,transform .12s}
  .nav .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;
    stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
  .nav:hover .ico{opacity:1}
  .nav.on .ico{opacity:1}
  .nav.sub .ico,.nav.sub .ico svg{width:16px;height:16px}
  .nav .n{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nav.on .n{color:var(--muted)}
  /* one level of nesting, no more — deeper is where sidebars start to rot */
  .nav.sub{padding-left:29px;font-size:13px}
  .nav.sub .ico{font-size:11.5px;opacity:.7}
  .navgroup{position:relative}
  .navgroup::before{content:"";position:absolute;left:19px;top:2px;bottom:2px;
    width:1px;background:var(--line)}
  .navgroup.closed{display:none}
  .caret{position:absolute;right:3px;top:50%;margin-top:-11px;
    width:22px;height:22px;line-height:21px;text-align:center;font-size:13px;
    color:var(--ui);transition:transform .15s,background .12s,color .12s;border-radius:6px}
  .caret:hover{color:var(--ink);background:var(--line-strong)}
  .caret.closed{transform:rotate(-90deg)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  /* a tag the app assigns and you can't edit — the glyph replaces the dot */
  .nav.auto .lock{width:8px;font-size:10px;color:var(--accent);flex:none;text-align:center}
  .nav.auto{font-style:italic}
  .tag.docmark{cursor:pointer}
  .tag.docmark:hover{border-color:var(--accent);color:var(--accent)}
  /* settings sit above a fence; the footer hangs below it */
  .sidefoot{margin-top:auto;padding:11px 4px 12px;display:flex;gap:3px;align-items:center;
    flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .sidefooter{padding:11px 8px 4px;color:var(--faint);font-size:10px;
    line-height:1.5;letter-spacing:.01em;text-align:center}
  .sidefooter .tagline{font-style:italic;color:var(--muted);margin-top:2px;font-size:10.5px}
  .ghost{padding:5px 8px;border-radius:8px;color:var(--ui);font-size:11.5px;font-weight:540;
    border:1px solid transparent;transition:.12s}
  .ghost:hover{background:var(--line);color:var(--ink);border-color:var(--line-strong)}

  .main{display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:flex-start;gap:12px;padding:16px 26px 0}
  .title{font-size:22px;font-weight:660;letter-spacing:-.02em}
  .lensnote{color:var(--faint);font-size:12px;margin-top:2px}
  /* the toggle and the search field share a row and a baseline */
  .topright{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
  .compilewrap{position:relative}
  .compilebtn{height:34px;padding:0 12px;border:1px solid var(--line-strong);
    border-radius:10px;font-size:12.5px;background:var(--surface)}
  .compilebtn.on{border-color:var(--accent);color:var(--accent)}
  .menu{position:absolute;top:40px;right:0;min-width:212px;z-index:45;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:5px;display:none}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
  .menu button:hover{background:var(--line)}
  .menu button b{display:block;font-size:12.5px;font-weight:590;color:var(--ink)}
  .menu button span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .menuwrap{position:relative}
  .menu.up{top:auto;bottom:32px;left:0;right:auto;min-width:196px}

  .bkhint{width:100%;font-size:10.5px;color:var(--faint);padding:7px 4px 0;
    line-height:1.4;text-align:center}
  .bkhint.warn{color:var(--accent);font-weight:560}
  /* fixed width so a changing label can't reflow the settings row */
  .syncbtn{min-width:92px;text-align:center;white-space:nowrap}
  .syncbtn.busy{color:var(--accent);border-color:var(--accent)}
  .syncbtn.err{color:var(--red);border-color:var(--red)}
  .syncbtn.out{border-style:dashed}

  /* a small dialog for choices that need more than yes/no */
  .askbox{background:var(--surface);border-radius:16px;padding:22px 24px;
    width:min(430px,100%);box-shadow:var(--shadow-lg);
    animation:pop .18s cubic-bezier(.2,.8,.3,1)}
  .askbox h3{font-size:16px;font-weight:650;letter-spacing:-.01em;margin-bottom:8px}
  .askbox p{font-size:13px;color:var(--read);line-height:1.6}
  .askbox p b{color:var(--ink)}
  .askrow{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .askchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .askin{width:100%;margin-top:12px;padding:10px 13px;border-radius:10px;
    border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);
    font-size:15px;font-weight:560;outline:none}
  .askin:focus{border-color:var(--accent)}

  .titlerow{display:flex;align-items:center;gap:9px}
  .tagedit{font-size:11.5px;padding:4px 9px}
  .search{position:relative;display:flex;align-items:center}
  .search input{width:210px;height:34px;padding:0 11px 0 30px;border-radius:10px;
    border:1px solid var(--line-strong);background:var(--surface);outline:none;
    transition:width .18s,border-color .15s}
  .search input:focus{width:260px;border-color:var(--accent)}
  .search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--ui);font-size:13px}

  /* ---------- capture ---------- */
  .capwrap{padding:14px 26px 10px}
  .cap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:10px 12px;transition:border-color .15s,box-shadow .15s}
  .cap:focus-within{border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
  .caprow{display:flex;align-items:flex-start;gap:10px}
  .capicon{width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:2px;
    color:var(--accent);opacity:.85}
  .capicon svg{width:20px;height:20px;fill:none;stroke:currentColor;
    stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
  .cap textarea{flex:1;border:0;outline:none;background:none;resize:none;overflow:hidden;
    font-size:calc(14.5px*var(--tscale));line-height:1.55;min-height:22px;max-height:180px}
  .cap textarea::placeholder{color:var(--muted)}
  .capmeta{display:flex;align-items:center;gap:6px;padding-top:9px;margin-top:8px;
    border-top:1px solid var(--line);flex-wrap:wrap}
  .capmeta.hide{display:none}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;
    font-size:11.5px;font-weight:560;background:var(--line);color:var(--ui);
    border:1px solid var(--line-strong)}
  .chip.acc{background:var(--accent-soft);color:var(--accent)}
  .chip.blue{background:rgba(68,87,159,.12);color:var(--blue)}
  .chip.red{background:rgba(180,68,58,.12);color:var(--red)}
  .chip.green{background:rgba(95,132,66,.13);color:var(--green)}
  .chip.tog{cursor:pointer;transition:.12s}
  .chip.tog:hover{border-color:var(--accent);color:var(--accent)}
  .chip.tog.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .capsave{margin-left:auto;background:var(--ink);color:var(--bg);padding:5px 13px;
    border-radius:8px;font-size:12px;font-weight:580}
  .capsave:hover{opacity:.88}
  .hint{color:var(--muted);font-size:11.5px}
  kbd{font-family:var(--sans);font-size:10.5px;border:1px solid var(--line-strong);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ui);font-weight:560}

  /* ---------- board ---------- */
  .board{flex:1;overflow-y:auto;padding:6px 26px 80px}
  .grouphead{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
    font-weight:640;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
  .grouphead .gn{color:var(--faint);opacity:.7;font-weight:500;letter-spacing:0;text-transform:none}
  /* ---- three layouts ---- */
  /* Moodboard: masonry columns, images at their natural proportions */
  .grid.mood{columns:4 250px;column-gap:14px}
  /* Cards: every card exactly the same height. The title takes up to three
     lines; whatever it doesn't use, the body gets. Adjust --cardh to taste. */
  .grid.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));
    gap:14px;align-items:start;--cardh:334px}
  .grid.cards .card{margin-bottom:0;height:var(--cardh);
    display:flex;flex-direction:column;overflow:hidden}
  /* image block is a constant, so the text area below it is constant too */
  .grid.cards .photos,.grid.cards .thumb{flex:none}
  .grid.cards .photos.n1 .ph{aspect-ratio:auto!important;height:130px}
  .grid.cards .photos.n2,.grid.cards .photos.n3,.grid.cards .photos.nx{height:130px}
  .grid.cards .thumb,.grid.cards .thumb.tall{height:130px}
  .grid.cards .head,.grid.cards .foot{flex:none}
  .grid.cards .ctitle{display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}
  /* body absorbs the leftover space and fades out rather than cutting mid-line */
  .grid.cards .cbody,.grid.cards .desc{flex:1 1 auto;min-height:0;display:block;
    overflow:hidden;-webkit-line-clamp:unset;
    -webkit-mask-image:linear-gradient(#000 76%,transparent 100%);
    mask-image:linear-gradient(#000 76%,transparent 100%)}

  /* List: columns, like a mail client. Title and excerpt share the width, and
     tags and dates align into their own right-hand columns — so a wide window
     buys you more of the note rather than more empty space. */
  /* A single column at a comfortable measure, left aligned. Multiple columns
     turned a sorted list into something you had to navigate rather than read;
     a list should go straight down. Extra window width is left as margin. */
  .list{display:flex;flex-direction:column;gap:1px;max-width:880px}
  .row-item{margin-bottom:0;
    display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;
    cursor:pointer;position:relative;border:1px solid transparent;
    transition:border-color .12s,box-shadow .12s,opacity .12s,transform .14s,
      margin .19s cubic-bezier(.2,.8,.3,1)}
  .row-item:hover{border-color:var(--line);box-shadow:var(--shadow)}
  .row-item .box{margin-top:0}
  .rthumb{width:40px;height:40px;border-radius:8px;overflow:hidden;flex:none;
    background:var(--line);position:relative}
  .rthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .rtitle{flex:0 1 40%;min-width:104px;font-weight:570;font-size:calc(13.5px*var(--tscale));letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rexc{flex:1 1 auto;min-width:0;font-size:calc(12.5px*var(--tscale));color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rexc strong,.rexc b,.rexc em,.rexc i{font-weight:inherit;font-style:inherit;color:inherit}
  .rsrc{color:var(--muted);font-weight:560}
  .rtags{flex:none;display:flex;gap:5px;max-width:150px;overflow:hidden}
  .rdue{flex:none;width:104px;text-align:right;font-size:11px}
  /* In a row the date is a column, not a badge — it needs no pill around it.
     This selector has to out-rank .due.today / .due.past, which are defined
     further down the stylesheet, hence the extra .row-item. */
  .row-item .rdue .due{background:none;border:0;padding:0;font-weight:600;
    display:inline;white-space:nowrap}
  .row-item .quick{position:static;transform:none;flex:none;box-shadow:none;
    background:none;border:0;padding:0;width:52px;justify-content:flex-end;z-index:4}
  .row-item:hover .quick{transform:none}
  /* A row is only 46px tall in places — a corner ribbon would swallow it.
     Mark the whole left edge instead, which is the list idiom anyway. */
  .row-item .pinned{top:0;bottom:0;left:0;width:4px;height:auto;overflow:visible;
    background:var(--accent);
    border-radius:calc(var(--r) - 1px) 0 0 calc(var(--r) - 1px)}
  .row-item .pinned::before{display:none}
  .row-item.done .rtitle{text-decoration:line-through;color:var(--faint)}
  .row-item.done{opacity:.55}

  .lay{display:flex;background:var(--line);border:1px solid var(--line-strong);
    border-radius:10px;padding:2px;flex:none;height:34px;align-items:center}
  .lay button{height:26px;padding:0 10px;border-radius:7px;font-size:13px;
    color:var(--ui);display:flex;align-items:center;transition:.12s}
  .lay button:hover{color:var(--ink)}
  .lay button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

  /* ---------- ONE card, slots appear per facet ---------- */
  .card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:13px 14px;margin-bottom:14px;cursor:pointer;position:relative;
    transition:transform .14s cubic-bezier(.2,.7,.3,1),box-shadow .14s,border-color .14s,
      margin .19s cubic-bezier(.2,.8,.3,1)}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
  .card.haslink{padding-top:13px}

  /* cover — link facet. Full-bleed too, so covers and photos read the same. */
  .thumb{position:relative;height:132px;overflow:hidden;
    margin:-13px -14px 12px;border-radius:13px 13px 0 0}
  .thumb.tall{height:178px}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .4s ease}
  .thumb img.in{opacity:1}
  .skel{position:absolute;inset:0;background-image:linear-gradient(90deg,
    transparent,rgba(255,255,255,.55),transparent);background-size:220% 100%;
    animation:sweep 1.3s ease-in-out infinite}
  [data-theme="dark"] .skel{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
  @keyframes sweep{0%{background-position:220% 0}100%{background-position:-120% 0}}

  /* photos — user-attached images, full-bleed to the card edges.
     Negative margins cancel the card's padding so the image meets the border. */
  .photos{display:grid;gap:3px;overflow:hidden;
    margin:-13px -14px 12px;border-radius:13px 13px 0 0}
  .photos.n1{grid-template-columns:1fr}
  .photos.n2{grid-template-columns:1fr 1fr;height:148px}
  .photos.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;height:172px}
  .photos.n3 .ph:first-child{grid-row:span 2}
  .photos.nx{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:172px}
  /* width:100% is load-bearing. A grid item carrying aspect-ratio behaves like a
     replaced element: if anything caps its height, it shrinks its WIDTH to keep
     the ratio, leaving gaps at the sides. That only ever bit portrait images,
     because they were the only ones tall enough to hit the cap. */
  .ph{position:relative;overflow:hidden;background:var(--line);min-height:0;
    width:100%;cursor:pointer}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph.more::after{content:"+"attr(data-more);position:absolute;inset:0;
    background:rgba(26,25,23,.55);color:#fff;display:grid;place-items:center;
    font-size:18px;font-weight:640;letter-spacing:-.02em}
  .card.done .photos{filter:grayscale(1);opacity:.6}

  /* Images must never be draggable themselves. A dragged <img> hands the
     browser an image payload, which the file importer then treated as an
     upload — that's how dragging a card's photo pasted it into another card. */
  .card img,.row-item img{-webkit-user-drag:none;user-select:none}

  /* ---- reordering ----
     Two cues working together: the neighbours slide apart to open a real gap
     where the card will land, and a thick line drops into that gap. The gap
     says "there is room here"; the line says "exactly here". */
  .card[draggable="true"],.row-item[draggable="true"]{cursor:grab}
  .card[draggable="true"]:active,.row-item[draggable="true"]:active{cursor:grabbing}
  .card.dragging,.row-item.dragging{opacity:.32;transform:scale(.98)}

  /* the gap. Vertical flow in moodboard and list, horizontal in cards. */
  .grid.mood .card.dropbefore{margin-top:44px}
  .grid.mood .card.dropafter{margin-bottom:58px}   /* 14 base + 44 */
  .grid.cards .card.dropbefore{margin-left:32px}
  .grid.cards .card.dropafter{margin-right:32px}
  .list .row-item.dropbefore{margin-top:40px}
  .list .row-item.dropafter{margin-bottom:41px}    /* 1 base + 40 */

  /* the line. Lives on <body> at fixed coordinates so no card's overflow
     can clip it, and glides between positions instead of blinking. */
  .dropline{position:fixed;z-index:66;background:var(--accent);border-radius:99px;
    pointer-events:none;opacity:0;
    box-shadow:0 0 0 4px var(--accent-soft),0 3px 12px -3px var(--accent);
    transition:opacity .12s ease,top .13s cubic-bezier(.2,.8,.3,1),
      left .13s cubic-bezier(.2,.8,.3,1),width .13s ease,height .13s ease}
  .dropline.on{opacity:1}
  .dropline::before,.dropline::after{content:"";position:absolute;
    width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .dropline.horiz::before{left:-3px;top:50%;margin-top:-4.5px}
  .dropline.horiz::after{right:-3px;top:50%;margin-top:-4.5px}
  .dropline.vert::before{top:-3px;left:50%;margin-left:-4.5px}
  .dropline.vert::after{bottom:-3px;left:50%;margin-left:-4.5px}

  /* drop targets — a small hint pill, not a blocking overlay, so you can
     still see which card you're aiming at */
  .card.dropping{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
    transform:translateY(-2px) scale(1.012)}
  .dropveil{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);
    z-index:70;background:var(--surface);color:var(--ink);padding:10px 20px;border-radius:12px;
    font-size:13px;font-weight:580;box-shadow:var(--shadow-lg);border:1.5px dashed var(--accent);
    pointer-events:none;opacity:0;transition:opacity .14s,transform .14s;white-space:nowrap}
  .dropveil.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .dropveil.no{border-color:var(--line-strong);color:var(--faint);border-style:solid}
  #board.armed{outline:2px dashed var(--accent-soft);outline-offset:-10px;border-radius:16px}

  /* lightbox */
  .light{position:fixed;inset:0;z-index:80;display:none;place-items:center;
    background:rgba(12,11,10,.88);padding:28px}
  .light.on{display:grid}
  .light img{max-width:100%;max-height:100%;border-radius:10px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
  .light .nav{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;color:rgba(255,255,255,.8);font-size:12px}
  .light .nav button{color:#fff;padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.14)}

  /* editor gallery — full-bleed to the sheet edges, same as on a card */
  .egal{margin:-30px -34px 18px;border-radius:20px 20px 0 0;overflow:hidden;position:relative}
  .egal .photos{margin:0;border-radius:0}
  /* in the editor a fixed height is fine — set it explicitly rather than
     capping an aspect-ratio, so the width still stretches edge to edge */
  .egal .photos.n1 .ph{aspect-ratio:auto!important;height:min(50vh,440px)}
  .egal .photos.n2{height:230px}
  .egal .photos.n3,.egal .photos.nx{height:280px}
  .egal .ph{cursor:zoom-in}
  .egal .rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    background:rgba(26,25,23,.62);color:#fff;font-size:11px;display:grid;place-items:center;
    line-height:1;opacity:0;transition:opacity .12s;z-index:2}
  .egal .ph:hover .rm{opacity:1}
  .egal .rm:hover{background:var(--red)}
  .egalbar{display:flex;gap:8px;align-items:center;margin:20px 0 6px;
    padding-top:14px;border-top:1px solid var(--line)}
  .addimg{padding:7px 13px;border-radius:9px;border:1px dashed var(--line-strong);
    color:var(--ui);font-size:12.5px;font-weight:560}
  .addimg:hover{border-color:var(--accent);color:var(--accent)}
  .wc{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .szgrp{display:flex;gap:1px;align-items:center}
  .szbtn{padding:5px 7px;font-size:11.5px;font-weight:600}
  .szbtn:disabled{opacity:.3;cursor:default}
  .szbtn:disabled:hover{background:none;color:var(--muted)}
  .szval{font-size:10.5px;color:var(--faint);min-width:34px;text-align:center;
    font-variant-numeric:tabular-nums}
  .fmt{font-size:13px;min-width:30px;justify-content:center}
  .fmt b{font-weight:800}
  .fmt i{font-family:Georgia,serif}

  /* head row */
  .head{display:flex;gap:9px;align-items:flex-start}
  .ctitle{font-weight:600;font-size:calc(14.5px*var(--tscale));letter-spacing:-.01em;line-height:1.35}
  .srcline{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
  .fav{width:15px;height:15px;border-radius:4px;flex:none;display:grid;place-items:center;
    font-size:8.5px;font-weight:700;color:#fff;overflow:hidden;position:relative}
  .fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
  /* the fetched excerpt stays quiet — it isn't your writing */
  .desc{color:var(--muted);font-size:calc(12.5px*var(--tscale));line-height:1.52;margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* your own words get real contrast */
  .cbody{color:var(--read);font-size:calc(13.5px*var(--tscale));line-height:1.58;margin-top:7px;
    display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word}
  .cbody strong,.cbody b{font-weight:700;color:var(--ink)}
  .cbody em,.cbody i{font-style:italic}
  .cbody u{text-decoration:underline}
  .cbody a,.ebody a{color:var(--blue);text-decoration:underline;
    text-underline-offset:2px;text-decoration-thickness:1px}
  .cbody a:hover,.ebody a:hover{text-decoration-thickness:2px}
  .cbody ul,.cbody ol,.ebody ul,.ebody ol{margin:6px 0 6px 1.15em;padding:0}
  .cbody li,.ebody li{margin:2px 0}
  .cbody ul,.ebody ul{list-style:disc}
  .cbody ol,.ebody ol{list-style:decimal}
  .ebody li{line-height:1.6}
  .ebody a{cursor:pointer}

  /* Short, text-only notes get set large — a stray thought should look like one,
     not like a truncated paragraph. */
  .card.display{padding:20px 20px}
  .card.display .cbody{font-size:calc(18.5px*var(--tscale));line-height:1.46;color:var(--ink);
    letter-spacing:-.011em;-webkit-line-clamp:12;margin-top:6px}
  .card.display .ctitle{font-size:14px;font-weight:620;color:var(--muted);
    text-transform:none;letter-spacing:0}
  .card.display.xl .cbody{font-size:calc(23px*var(--tscale));line-height:1.38;letter-spacing:-.018em}
  .card.display.titleonly .ctitle{font-size:calc(18.5px*var(--tscale));font-weight:600;color:var(--ink);
    line-height:1.45;letter-spacing:-.011em}
  .card.display.titleonly.xl .ctitle{font-size:calc(23px*var(--tscale));line-height:1.38;letter-spacing:-.018em}

  /* action facet */
  .box{width:17px;height:17px;border-radius:50%;border:1.8px solid var(--muted);
    flex:none;margin-top:2px;display:grid;place-items:center;transition:.14s;
    font-size:10px;color:transparent}
  .box:hover{border-color:var(--accent);transform:scale(1.1)}
  .card.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
  .card.done .ctitle{text-decoration:line-through;color:var(--faint)}
  .card.done{opacity:.55}
  .card.done .thumb{filter:grayscale(1);opacity:.6}

  /* checklist inside an item — distinct from the item's own checkbox */
  .checks{margin-top:9px;display:flex;flex-direction:column;gap:1px}
  .chk{display:flex;gap:8px;align-items:flex-start;padding:2px 0;
    font-size:calc(12.8px*var(--tscale));line-height:1.45;color:var(--read)}
  .cbox{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-strong);
    flex:none;margin-top:2px;display:grid;place-items:center;font-size:8px;
    color:transparent;transition:.12s;cursor:pointer}
  .cbox:hover{border-color:var(--accent)}
  .chk.on .cbox{background:var(--accent);border-color:var(--accent);color:#fff}
  .chk.on span:last-child{text-decoration:line-through;color:var(--faint)}
  .chkmore{font-size:11px;color:var(--faint);padding-left:22px;margin-top:2px}
  .ckprog{font-size:11px;font-weight:600;color:var(--muted);background:var(--line);
    border:1px solid var(--line-strong);padding:2px 7px;border-radius:99px;
    font-variant-numeric:tabular-nums}
  .ckprog.all{color:var(--green);border-color:rgba(95,132,66,.42)}

  /* editor list */
  .cklist{display:flex;flex-direction:column;gap:3px;margin:6px 0 8px}
  .ckrow{display:flex;gap:9px;align-items:center}
  .ckrow .cbox{width:17px;height:17px;font-size:10px;margin:0}
  .ckin{flex:1;border:0;border-bottom:1px solid transparent;background:none;outline:none;
    font-size:14px;padding:4px 2px;margin:0!important;color:var(--ink)}
  .ckin:focus{border-bottom-color:var(--line-strong)}
  .ckrow.done .ckin{text-decoration:line-through;color:var(--faint)}
  .ckdel{width:22px;height:22px;border-radius:6px;color:var(--faint);font-size:11px;
    flex:none;opacity:0;transition:.12s}
  .ckrow:hover .ckdel{opacity:1}
  .ckdel:hover{background:var(--line);color:var(--red)}

  .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .due{font-size:11px;font-weight:580;display:inline-flex;gap:4px;align-items:center;
    padding:2px 7px;border-radius:99px;background:var(--line)}
  .due.past{color:var(--red);background:rgba(180,68,58,.13)}
  .due.today{color:var(--accent);background:var(--accent-soft)}
  .due.later{color:var(--muted)}
  .tag{font-size:10.5px;font-weight:570;color:var(--ui);background:var(--line);
    padding:2px 7px;border-radius:99px;border:1px solid var(--line-strong)}

  /* The toolbox is a lot of small targets. Rather than make it louder, hovering
     washes the card back toward its own colour so the tools are what your eye
     lands on. The veil takes the card's background, so a tinted card fades to
     its tint rather than to white. */
  .card::after,.row-item::after{content:"";position:absolute;inset:0;
    background:inherit;opacity:0;pointer-events:none;border-radius:inherit;
    transition:opacity .16s;z-index:1}
  .card:hover::after{opacity:.58}
  .row-item:hover::after{opacity:.42}

  /* quick facet toggles on hover — conversion in one click */
  .quick{position:absolute;top:7px;right:7px;display:flex;gap:2px;padding:3px;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
    box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-3px) scale(.97);
    transition:opacity .14s,transform .14s;z-index:4}
  .card:hover .quick{opacity:1;transform:translateY(0) scale(1)}
  .quick button{width:26px;height:24px;border-radius:7px;font-size:12px;color:var(--ui);
    display:grid;place-items:center}
  .quick button:hover{background:var(--line);color:var(--ink)}
  .quick button.on{color:var(--accent)}
  .quick button.go{color:var(--blue);font-weight:700}
  .quick button.go:hover{background:rgba(68,87,159,.14);color:var(--blue)}
  /* pinned — a ribbon folded over the top-left corner.
     The square is a clipping window: the band inside is longer than the
     corner it crosses, so both ends are cut flush against the card's edges
     and it reads as a ribbon rather than a triangle.

     The geometry is tighter than it looks. The band's centre line sits
     11.7px along the diagonal, so the band spans 7 to 16 — past the corner
     radius, which stops at 5.4, but short of where the title's first glyph
     begins, at 19. Any larger and a text-only card wears the ribbon through
     its own first word. On a card with a cover the ribbon lands on the
     image, which is where it looks best. */
  .pinned{position:absolute;top:0;left:0;width:30px;height:30px;overflow:hidden;
    pointer-events:none;z-index:3;transition:opacity .16s;
    /* the card's radius is on its border box; this box starts inside the
       1px border, so it needs the inner radius or a sliver of accent shows
       past the corner in moodboard, where the card does not clip its own
       children */
    border-radius:calc(var(--r) - 1px) 0 0 0}
  .pinned::before{content:"";position:absolute;top:4px;left:-14px;width:44px;height:9px;
    background:var(--accent);transform:rotate(-45deg);
    box-shadow:0 1px 3px rgba(0,0,0,.20)}
  /* The select circle lives in this exact corner, so on hover the ribbon
     stands aside — the toolbar's ◆ already shows the same state. */
  .card:hover .pinned,.row-item:hover .pinned{opacity:0}

  /* selection */
  .pick{position:absolute;top:8px;left:8px;z-index:4;width:21px;height:21px;border-radius:50%;
    border:1.8px solid var(--line-strong);background:var(--surface);color:transparent;
    display:grid;place-items:center;font-size:11px;z-index:3;
    opacity:0;transform:scale(.85);transition:.12s}
  .card:hover .pick,.row-item:hover .pick{opacity:1;transform:scale(1)}
  .pick:hover{border-color:var(--accent)}
  .card.picked .pick,.row-item.picked .pick{opacity:1;transform:scale(1);
    background:var(--accent);border-color:var(--accent);color:#fff}
  .card.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .row-item.picked{border-color:var(--accent);background:var(--accent-soft)}
  .row-item .pick{position:static;flex:none;opacity:0;width:19px;height:19px}
  .row-item:hover .pick,.row-item.picked .pick{opacity:1}
  body.selecting .pick{opacity:1;transform:scale(1)}

  .selbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(24px);
    background:var(--ink);color:var(--bg);border-radius:13px;padding:8px 10px 8px 16px;
    display:none;align-items:center;gap:8px;z-index:75;box-shadow:var(--shadow-lg);
    opacity:0;transition:opacity .16s,transform .16s}
  .selbar.on{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
  .selbar .cnt{font-size:12.5px;font-weight:600;margin-right:4px;white-space:nowrap}
  .selbar button{padding:6px 12px;border-radius:9px;font-size:12px;font-weight:560;
    background:rgba(255,255,255,.14);color:var(--bg);white-space:nowrap}
  .selbar button:hover{background:rgba(255,255,255,.26)}
  .selbar button.dan{color:#FF9A90}
  .selbar button.dan:hover{background:rgba(255,120,110,.28)}
  .refetch{font-size:10.5px;color:var(--faint);text-decoration:underline;text-underline-offset:2px}
  .refetch:hover{color:var(--accent)}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:blink 1.1s ease-in-out infinite;flex:none}
  @keyframes blink{50%{opacity:.25}}
  .empty{text-align:center;color:var(--faint);padding:70px 20px}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.5}

  /* ---------- editor ---------- */
  .scrim{position:fixed;inset:0;background:rgba(26,25,23,.28);backdrop-filter:blur(3px);
    display:none;place-items:center;z-index:50;padding:20px}
  .scrim.on{display:grid}
  .sheet{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);
    width:min(820px,100%);max-height:88vh;overflow:auto;padding:30px 34px 0;
    scroll-padding-bottom:120px;
    animation:pop .18s cubic-bezier(.2,.8,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
  .sheet input,.sheet textarea{width:100%;border:0;outline:none;background:none;margin-bottom:8px}
  .etitle{font-size:calc(25px*var(--tscale));font-weight:660;letter-spacing:-.025em;line-height:1.25;
    color:var(--ink);margin-bottom:12px}
  /* the note body is the point of this window — give it room, weight and contrast */
  .ebody{font-size:calc(16px*var(--tscale));line-height:1.72;min-height:46vh;width:100%;
    color:var(--ink);font-family:var(--content);margin-bottom:4px;
    outline:none;white-space:pre-wrap;word-break:break-word}
  .ebody:empty:before{content:attr(data-ph);color:var(--faint)}
  .ebody strong,.ebody b{font-weight:700}
  .ebody em,.ebody i{font-style:italic}
  .sheet ::placeholder{color:var(--faint)}
  .readctx{font-size:13.5px;line-height:1.6;color:var(--muted);padding:11px 14px;
    border-left:2px solid var(--line-strong);background:var(--surface-2);
    border-radius:0 9px 9px 0;margin-bottom:14px}
  .readctx a{color:var(--blue);text-decoration:none}
  .facetbar{display:flex;gap:7px;margin:16px 0 0;padding-top:15px;
    border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
  .facet{display:inline-flex;gap:7px;align-items:center;padding:6px 13px;border-radius:99px;
    border:1px solid var(--line-strong);background:var(--surface-2);font-size:12.5px;
    font-weight:560;color:var(--ui);transition:.14s}
  .facet:hover{border-color:var(--line-strong);color:var(--ink)}
  .facet.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .facet .fi{font-size:13px}
  .sticky{position:sticky;bottom:0;background:var(--surface);
    padding-bottom:22px;margin-top:18px;z-index:2}
  /* Formatting stays within reach of the cursor. Pinned just above the action
     row, so editing the middle of a long note doesn't mean scrolling to the
     end to find bold. */
  .fmtbar{position:sticky;bottom:58px;z-index:3;background:inherit;
    display:flex;gap:7px;align-items:center;padding:9px 0 10px;margin-top:4px;
    border-top:1px solid var(--line)}
  .sheet[class*="tint-"] .fmtbar{background:inherit}
  .panel{display:none;padding:11px 12px;border-radius:11px;background:var(--surface-2);
    border:1px solid var(--line);margin-top:8px}
  .panel.on{display:block}
  .panel label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--faint);font-weight:640;display:block;margin-bottom:5px}
  /* one-click shortcuts for the tags you actually use */
  .tagsug{display:flex;gap:5px;flex:none}
  .sug{font-size:11px;font-weight:560;color:var(--muted);background:var(--line);
    border:1px solid var(--line-strong);border-radius:99px;padding:4px 10px;
    transition:.12s;white-space:nowrap}
  .sug:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  /* Our own date picker. The native one can't be restyled — its calendar and
     buttons live in browser shadow DOM — and it ignores `step` on the minute
     wheel. Building it means both problems go away. */
  .dpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dbtn{cursor:pointer;font-weight:560;color:var(--ink);min-width:170px;text-align:left}
  .dbtn:hover{border-color:var(--accent);color:var(--accent)}
  .dbtn.none{color:var(--muted);font-weight:500}
  .dpop{display:none;margin-top:11px;padding:12px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line-strong)}
  .dpop.on{display:block}
  .dquick{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
  .dquick button{padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:560;
    background:var(--line);color:var(--ui);border:1px solid var(--line-strong)}
  .dquick button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dhead span{font-size:13px;font-weight:600;color:var(--ink)}
  .dhead button{width:26px;height:26px;border-radius:7px;color:var(--ui);font-size:14px}

  .urlrow{display:flex;gap:8px;align-items:center}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);

  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- tints ----
     Declared last so they win over .card, .row-item and .sheet backgrounds,
     which lets a card keep its colour in the list and in the open editor. */
  /* "doc" is reserved for compiled documents and is deliberately absent from
     the colour picker, so a compiled page always looks like one. */
  .tint-doc{background-color:#E2E8E6}

  .card.tint-doc,.row-item.tint-doc{border-color:rgba(88,110,106,.34)}
  .tag.docmark{background:rgba(88,110,106,.16);border-color:rgba(88,110,106,.36);
    color:#4E5B59;letter-spacing:.03em}
  [data-theme="dark"] .tag.docmark{color:#A6B7B4}

  .tint-amber{background-color:#FCF3E3}
  .tint-sage{background-color:#EDF3EC}
  .tint-sky{background-color:#EAF1F8}
  .tint-rose{background-color:#FAEDEC}
  .tint-lilac{background-color:#F0EDF8}
  [data-theme="dark"] .tint-amber{background-color:#2B2418}
  [data-theme="dark"] .tint-sage{background-color:#1B2620}
  [data-theme="dark"] .tint-sky{background-color:#1A2430}
  [data-theme="dark"] .tint-rose{background-color:#2C1E1D}
  [data-theme="dark"] .tint-lilac{background-color:#231F2E}
  /* The action bar is sticky, so text scrolls beneath it — it has to stay
     opaque. On a tinted sheet it takes the sheet's own colour rather than
     going transparent, which is what let text show through it. */
  .sheet[class*="tint-"] .sticky{background:inherit}
  .sheet[class*="tint-"] .panel,
  .sheet[class*="tint-"] .facet,
  .sheet[class*="tint-"] .field{background:transparent}
  .sheet[class*="tint-"] .facet.on{background:var(--accent-soft)}

  /* The menu button only exists where the sidebar can't be permanent. */
  .menubtn{display:none;width:34px;height:34px;border-radius:9px;flex:none;
    align-items:center;justify-content:center;color:var(--ui);
    border:1px solid var(--line-strong);background:var(--surface);margin-right:2px}
  .menubtn svg{width:19px;height:19px;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round}
  .menubtn:active{background:var(--line)}
  .drawerscrim{position:fixed;inset:0;background:rgba(10,14,13,.44);z-index:85;
    display:none;backdrop-filter:blur(2px)}

  .mobtabs{display:none}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    /* On a phone the sidebar becomes a drawer rather than disappearing.
       Hiding it took the settings, the tags and half the lenses with it. */
    .sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(282px,84vw);
      z-index:90;background:var(--bg);border-right:1px solid var(--line-strong);
      transform:translateX(-101%);transition:transform .24s cubic-bezier(.2,.8,.3,1);
      box-shadow:var(--shadow-lg);overflow-y:auto;padding-bottom:26px}
    body.drawer .sidebar{transform:none}
    body.drawer .drawerscrim{display:block}
    .menubtn{display:flex}
    .topbar{align-items:center}
    .topbar{padding:14px 16px 0}
    .capwrap{padding:12px 16px 8px}
    .board{padding:4px 16px 96px}
    .grid.mood{columns:2 150px;column-gap:10px}
    .grid.cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .rthumb{width:36px;height:36px}
    .row-item{padding:8px 10px;gap:10px}
    .rtitle{flex:1 1 auto;min-width:0}
    .rexc,.rtags{display:none}

    .row-item .quick{display:none}
    .lay{margin-left:0!important}
    .grid.cards{--cardh:300px}
    .card{margin-bottom:10px}
    .quick{opacity:.5;transform:none}
    .search input{width:140px}.search input:focus{width:160px}
    .scrim{padding:0}

    .imgstrip .t,.addimg{width:70px;height:70px}
    .facetbar .swatches{margin-left:0!important;width:100%;margin-top:4px}
    .mobtabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
      border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}

<script>
(function(){
"use strict";

/* =========================================================================
   THE MODEL — facets, not types.

   Every item is TEXT (title + body). On top of that it may carry:
     · a LINK facet   — it has a url  → gets a cover image, source line
     · an ACTION facet — it is actionable → gets a checkbox, optional due date

   Nothing is exclusive. An article to read by Friday carries both.
   The sidebar shows filters, not folders:
     Notes = text only   Links = has a url   Tasks = actionable
   Notes and Links don't overlap. Tasks cuts across Links, so an article
   with a deadline is in both — which is the whole point of the model.
   ========================================================================= */

var KEY="trove.v3", K2="trove.v2", K1="trove.v1", mem=null;

function hasLink(i){ return !!(i && i.url) }
function hasAction(i){ return !!(i && i.actionable) }
function hasPhotos(i){ return !!(i && i.photos && i.photos.length) }
function hasChecks(i){ return !!(i && i.checks && i.checks.length) }
function checkDone(i){ return hasChecks(i)?i.checks.filter(function(c){ return c.d }).length:0 }
function isPlain(i){ return !hasLink(i) && !hasAction(i) }

/* ---- storage + migration ---- */
function migrate(old){
  return old.map(function(o){
    return {
      id:o.id, title:o.title||"", body:o.body||"",
      url:o.url||"", image:o.image||"", desc:o.desc||"", logo:o.logo||"",
      site:o.site||"", metaState:o.metaState||null, titleAuto:!!o.titleAuto,
      actionable: o.type==="task" || o.due!=null,
      due: o.due!=null?o.due:null,
      timed:!!(o.due&&(new Date(o.due).getHours()||new Date(o.due).getMinutes())), done:!!o.done,
      tint:o.tint||"", tags:o.tags||[], checks:o.checks||[], archived:!!o.archived, pin:!!o.pin,
      created:o.created||Date.now(), modified:o.created||Date.now()
    };
  });
}
// v3 turned plain-text bodies into rich text. Run every note through once.
function enrich(list){
  list.forEach(function(o){ o.body=toRich(o.body) });
  return list;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r) return JSON.parse(r);
    var two=localStorage.getItem(K2);
    if(two){ var a=enrich(JSON.parse(two)); localStorage.setItem(KEY,JSON.stringify(a)); return a }
    var one=localStorage.getItem(K1);
    if(one){ var b=enrich(migrate(JSON.parse(one))); localStorage.setItem(KEY,JSON.stringify(b)); return b }
  }catch(e){}
  return mem;
}
function save(){
  // the first save after startup is a real edit, so this stops being a demo
  if(BOOTED) notDemoAnyMore();
  // every write is local first; syncing notices afterwards and never blocks it
  if(typeof stampChanges==="function") setTimeout(stampChanges,0);
  try{ localStorage.setItem(KEY, JSON.stringify(S.items)) }catch(e){
    // Browsers cap localStorage at ~5MB. Images are the only thing big enough to hit it.
    // A native app writes real files to disk and never has this problem.
    if(typeof toast==="function") toast("Storage full — this browser caps saved images");
  }
  mem=S.items;
}

var S={items:[], view:"all", q:"", tag:null, layouts:{}, sel:{}};

/* A device opening the app for the first time gets the sample library so it
   isn't a blank page. That content must never be mistaken for yours — signing
   in on a fresh device would otherwise push twelve demo notes into your real
   library. DEMO stays true until you actually change something. */
var DEMO=false, BOOTED=false;
function notDemoAnyMore(){
  if(!DEMO) return;
  DEMO=false;
  try{ localStorage.removeItem("trove.demo") }catch(e){}
}

/* Each lens remembers its own layout, the way Raindrop gives every collection
   its own view settings. The defaults suit what each lens mostly holds. */
var DEFAULT_LAYOUT={all:"mood", today:"list", overdue:"list", upcoming:"list", someday:"list",
  notes:"mood", links:"cards", tasks:"list", done:"list"};

/* A tag is its own page, not a variation of whichever lens you came from —
   so it gets its own key and remembers its own layout. Same for search. */
function pageKey(){
  if(S.q) return "search";
  if(S.tag) return "tag:"+S.tag;
  return S.view;
}
function defaultLayout(){
  if(S.q) return "list";
  if(S.tag) return "mood";
  return DEFAULT_LAYOUT[S.view]||"mood";
}
function layoutFor(){ return S.layouts[pageKey()]||defaultLayout() }
function setLayout(lay){
  S.layouts[pageKey()]=lay;
  try{ localStorage.setItem("trove.layouts",JSON.stringify(S.layouts)) }catch(e){}
}
var TINTS=["","amber","sage","sky","rose","lilac"];
var TINTHEX={"":"transparent",amber:"#FCF3E3",sage:"#EDF3EC",sky:"#EAF1F8",rose:"#FAEDEC",lilac:"#F0EDF8"};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }

/* ---- dates ---- */
function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x }
function todayKey(){ return startOfDay(new Date()).getTime() }
function dayOf(ts){ return startOfDay(new Date(ts)).getTime() }
/* A date can be worn three ways: no date at all (someday), a date on its own,
   or a date with a time. `timed` says which of the last two; when it isn't
   given we infer it from the timestamp, so older records still read right. */
function fmtDue(ts,timed){
  var d=new Date(ts), diff=Math.round((dayOf(ts)-todayKey())/86400000);
  if(timed===undefined) timed=!!(d.getHours()||d.getMinutes());
  var time=timed
    ? d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}).replace(":00","") : "";
  var label;
  if(diff===0) label="Today"; else if(diff===1) label="Tomorrow";
  else if(diff===-1) label="Yesterday";
  else if(diff<-1) label=Math.abs(diff)+" days ago";
  else if(diff<7) label=d.toLocaleDateString([],{weekday:"long"});
  else label=d.toLocaleDateString([],{month:"short",day:"numeric"});
  return label+(time?" · "+time:"");
}
function dueClass(ts){ var d=dayOf(ts), t=todayKey(); return d<t?"past":d===t?"today":"later" }

/* =========================================================================
   CAPTURE PARSER — returns facets, never a single type.
   ========================================================================= */
var DAYS=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

function parse(raw){
  var text=(raw||"").trim();
  var out={title:"",body:"",url:"",tags:[],due:null,timed:false,actionable:false,titleAuto:false};
  if(!text) return out;

  text=text.replace(/(^|\s)#([\p{L}\d_-]+)/gu,function(m,p,t){ out.tags.push(t.toLowerCase()); return p });

  var um=text.match(/https?:\/\/[^\s]+|(^|\s)www\.[^\s]+/i);
  if(um){
    out.url=um[0].trim();
    if(!/^https?:/i.test(out.url)) out.url="https://"+out.url;
    text=text.replace(um[0],"").trim();
  }

  if(/^(todo|task)[:\s]/i.test(text)){ text=text.replace(/^(todo|task)[:\s]+/i,""); out.actionable=true }
  if(/^[-*]\s+|^\[\s*\]\s*/.test(text)){ text=text.replace(/^[-*]\s+|^\[\s*\]\s*/,""); out.actionable=true }
  if(/^(read|watch|call|email|buy|book|send|finish|review|pay|fix)\b/i.test(text)) out.actionable=true;

  var now=new Date(), due=null, hit=null, m, low=text.toLowerCase();

  // A bare day word is only a deadline if it's introduced by a preposition ("by friday")
  // or sits at the end of the line ("water the plants tomorrow", "… tomorrow 7am").
  // Otherwise it's just a word: "notes for the friday standup" stays a plain note.
  function dateAllowed(str,mm){
    var end=mm.index+mm[0].length, nx=str.charAt(end);
    if(nx==="'"||nx==="’") return false;          // possessive: "today's meeting"
    var before=str.slice(0,mm.index).trim(), after=str.slice(end).trim();
    if(/\b(by|on|due|before|until|this|next)$/i.test(before)) return true;
    if(after==="") return true;
    return /^(at\s+)?\d{1,2}(:\d{2})?\s*(am|pm)?[.!]?$/i.test(after);
  }

  if((m=low.match(/\bin (\d+) (day|days|week|weeks)\b/))){
    var n=+m[1]*(/week/.test(m[2])?7:1), d=startOfDay(now); d.setDate(d.getDate()+n); due=d; hit=m[0];
  } else if((m=low.match(/\bnext week\b/))){ var d2=startOfDay(now); d2.setDate(d2.getDate()+7); due=d2; hit=m[0] }
  else if((m=low.match(/\b(today|tonight)\b/))&&dateAllowed(low,m)){ due=startOfDay(now); hit=m[0] }
  else if((m=low.match(/\btomorrow\b/))&&dateAllowed(low,m)){ var d3=startOfDay(now); d3.setDate(d3.getDate()+1); due=d3; hit=m[0] }
  else if((m=low.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/))&&dateAllowed(low,m)){
    var idx=-1; for(var k=0;k<DAYS.length;k++){ if(DAYS[k].indexOf(m[1])===0){ idx=k; break } }
    if(idx>=0){ var d4=startOfDay(now), delta=(idx-d4.getDay()+7)%7||7; d4.setDate(d4.getDate()+delta); due=d4; hit=m[0] }
  }
  if(hit){
    // also swallow a preposition that only existed to introduce the date ("… by friday")
    var esq=hit.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    text=text.replace(new RegExp("\\b(?:by|on|due|before|until|for)\\s+"+esq+"\\b","i"),"")
             .replace(new RegExp("\\b"+esq+"\\b","i"),"").trim();
  }

  var tm=text.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i)||text.match(/\bat\s+(\d{1,2}):(\d{2})\b/);
  if(tm){
    var h=+tm[1], mi=+(tm[2]||0), ap=(tm[3]||"").toLowerCase();
    if(ap==="pm"&&h<12) h+=12; if(ap==="am"&&h===12) h=0;
    if(!due) due=startOfDay(now);
    due=new Date(due); due.setHours(h,mi,0,0);
    if(due.getTime()<Date.now()-6e4 && !hit) due.setDate(due.getDate()+1);
    text=text.replace(tm[0],"").trim();
  }
  if(due){ out.due=due.getTime(); out.actionable=true; out.timed=!!tm }

  text=text.replace(/\s{2,}/g," ").replace(/^[-–—\s]+/,"")
           .replace(/\s+(by|on|at|due|before|until|for|this)$/i,"").trim();
  var nl=text.indexOf("\n");
  if(nl>-1){ out.title=text.slice(0,nl).trim(); out.body=text.slice(nl+1).trim() }
  else out.title=text;

  if(out.url && !out.title){
    out.titleAuto=true;
    try{ out.title=new URL(out.url).hostname.replace(/^www\./,"") }catch(e){ out.title=out.url }
  }
  return out;
}

/* =========================================================================
   LINK METADATA — Open Graph tags via a public helper (CORS workaround).
   In a native Apple app, LinkPresentation does this on-device instead.
   ========================================================================= */
/* Some sites simply refuse anything that isn't a browser with a session —
   Amazon answers 503, the NYT and others block scrapers outright. So the
   chain now mixes several kinds of source, and falls back to things that
   can't fail: an ID-derived thumbnail, and a favicon loaded as an image
   rather than fetched. */

function ytId(u){
  try{
    var url=new URL(u), h=url.hostname.replace(/^www\./,"");
    if(h==="youtu.be") return url.pathname.slice(1).split("/")[0]||"";
    if(h==="youtube.com"||h==="m.youtube.com"||h==="music.youtube.com"){
      var v=url.searchParams.get("v");
      if(v) return v;
      var m=url.pathname.match(/\/(embed|shorts|live|v)\/([^\/?#]+)/);
      if(m) return m[2];
    }
  }catch(e){}
  return "";
}
function faviconFor(u){
  var h=host(u);
  return h?("https://icons.duckduckgo.com/ip3/"+h+".ico"):"";
}

var H_YT={ json:true,
  url:function(u){ return "https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(u) },
  parse:function(j){
    if(!j||!j.title) return null;
    return {title:j.title,desc:"",image:j.thumbnail_url||"",logo:"",site:j.author_name||"YouTube"};
  }};
var H_MICROLINK={ json:true,
  url:function(u){ return "https://api.microlink.io/?url="+encodeURIComponent(u)+"&palette=false" },
  parse:function(j){
    if(!j||j.status!=="success"||!j.data) return null;
    var d=j.data;
    return {title:d.title||"",desc:d.description||"",
      image:(d.image&&d.image.url)||(d.screenshot&&d.screenshot.url)||"",
      logo:(d.logo&&d.logo.url)||"",site:d.publisher||""};
  }};
var H_ALLORIGINS={ json:false,
  url:function(u){ return "https://api.allorigins.win/raw?url="+encodeURIComponent(u) },
  parse:function(t,u){ return fromHTML(t,u) }};
var H_CORSPROXY={ json:false,
  url:function(u){ return "https://corsproxy.io/?url="+encodeURIComponent(u) },
  parse:function(t,u){ return fromHTML(t,u) }};
// a reader service: returns the page as text, and often gets through where
// a raw proxy is refused
var H_READER={ json:false,
  url:function(u){ return "https://r.jina.ai/"+u },
  parse:function(t){
    if(!t||t.length<20) return null;
    var title=(t.match(/^Title:\s*(.+)$/m)||[])[1]||"";
    var img=(t.match(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/)||[])[1]||"";
    var body=t.split(/Markdown Content:\s*/).pop().replace(/!\[[^\]]*\]\([^)]*\)/g,"")
             .replace(/\[[^\]]*\]\([^)]*\)/g,"").replace(/[#*_>`\-]/g," ")
             .replace(/\s+/g," ").trim();
    if(!title&&!img) return null;
    return {title:title.trim(),desc:body.slice(0,300),image:img,logo:"",site:""};
  }};

function helpersFor(u){
  var list=[];
  if(ytId(u)) list.push(H_YT);                 // authoritative for YouTube
  list.push(H_MICROLINK,H_ALLORIGINS,H_CORSPROXY,H_READER);
  return list;
}
function abs(src,base){ try{ return new URL(src,base).href }catch(e){ return src||"" } }
function fromHTML(html,base){
  var doc=new DOMParser().parseFromString(html,"text/html");
  function m(sel){ var e=doc.querySelector(sel); return e?(e.getAttribute("content")||"").trim():"" }
  var title=m('meta[property="og:title"]')||m('meta[name="twitter:title"]')
    ||(doc.querySelector("title")?doc.querySelector("title").textContent.trim():"");
  var desc=m('meta[property="og:description"]')||m('meta[name="twitter:description"]')||m('meta[name="description"]');
  var img=m('meta[property="og:image:secure_url"]')||m('meta[property="og:image"]')
    ||m('meta[name="twitter:image"]')||m('meta[name="twitter:image:src"]');
  var icon=doc.querySelector('link[rel~="apple-touch-icon"]')||doc.querySelector('link[rel~="icon"]');
  return {title:title,desc:desc,image:img?abs(img,base):"",
    logo:icon?abs(icon.getAttribute("href"),base):"",site:m('meta[property="og:site_name"]')};
}
function applyMeta(item,meta){
  if(meta.title&&(item.titleAuto||!item.title)){ item.title=meta.title.slice(0,180); item.titleAuto=false }
  if(meta.desc&&!item.desc) item.desc=meta.desc.slice(0,320);
  if(meta.image) item.image=meta.image;
  if(meta.logo) item.logo=meta.logo;
  if(meta.site) item.site=meta.site;
}
var mqueue=[], mactive=0;
function fetchMeta(item,force){
  if(!item||!item.url) return;
  if(!force&&(item.metaState==="ok"||item.metaState==="loading"||item.metaState==="fail")) return;
  if(item.metaState==="loading") return;
  mqueue.push(item); pump();
}
function pump(){ while(mactive<2&&mqueue.length){ mactive++; runFetch(mqueue.shift()) } }
function runFetch(item){
  item.metaState="loading"; render();

  // Free wins that need no network round-trip and can't be refused.
  var yt=ytId(item.url);
  if(yt) item.image=item.image||("https://i.ytimg.com/vi/"+yt+"/hqdefault.jpg");
  item.logo=item.logo||faviconFor(item.url);

  var chain=helpersFor(item.url), idx=0;
  function attempt(){
    if(idx>=chain.length){ finish(); return }
    var h=chain[idx++], ctl, timer;
    try{ ctl=new AbortController(); timer=setTimeout(function(){ctl.abort()},11000) }catch(e){}
    fetch(h.url(item.url), ctl?{signal:ctl.signal,mode:"cors"}:{mode:"cors"})
      .then(function(r){ if(!r.ok) throw 0; return h.json?r.json():r.text() })
      .then(function(p){
        clearTimeout(timer);
        var meta=h.parse(p,item.url);
        if(!meta||(!meta.title&&!meta.image&&!meta.desc)) throw 0;
        applyMeta(item,meta);
        finish();
      })
      .catch(function(){ clearTimeout(timer); attempt() });
  }
  function finish(){
    // partial success still counts: a thumbnail and an icon beat a dead card
    item.metaState=(item.image||item.desc||!item.titleAuto)?"ok":"fail";
    mactive--; save(); render(); pump();
  }
  attempt();
}

/* =========================================================================
   PHOTOS — drag, drop or paste images onto anything.
   Images are downscaled in the browser before being stored, because
   localStorage is small. A native app stores the original file on disk.
   ========================================================================= */
var MAXDIM=1200, JPEGQ=0.82;

function readImage(file){
  return new Promise(function(res){
    if(!file||!/^image\//.test(file.type)) return res(null);
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth, h=img.naturalHeight, scale=Math.min(1,MAXDIM/Math.max(w,h));
        var cw=Math.round(w*scale), ch=Math.round(h*scale);
        try{
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          c.getContext("2d").drawImage(img,0,0,cw,ch);
          var isPng=/png/i.test(file.type);
          res({src:c.toDataURL(isPng?"image/png":"image/jpeg",JPEGQ), w:cw, h:ch});
        }catch(e){ res({src:fr.result,w:w,h:h}) }
      };
      img.onerror=function(){ res(null) };
      img.src=fr.result;
    };
    fr.onerror=function(){ res(null) };
    fr.readAsDataURL(file);
  });
}
function readImages(files){
  var list=[].slice.call(files||[]).filter(function(f){ return /^image\//.test(f.type) });
  return Promise.all(list.map(readImage)).then(function(r){ return r.filter(Boolean) });
}
/* Pull image files out of a clipboard or drag payload.
   Copying a file in Finder fills .files; copying an image out of a web page
   fills only .items with a synthesised blob. Some sources fill both with the
   same image, so this prefers .files and only falls back — merging the two
   would attach every screenshot twice. */
function imageFilesFrom(dt){
  if(!dt) return [];
  var out=[].slice.call(dt.files||[]).filter(function(f){
    return f && /^image\//.test(f.type||"");
  });
  if(out.length) return out;
  [].slice.call(dt.items||[]).forEach(function(it){
    if(it && it.kind==="file" && /^image\//.test(it.type||"")){
      var f=it.getAsFile(); if(f) out.push(f);
    }
  });
  return out;
}
function attachTo(item,photos){
  if(!photos.length) return;
  item.photos=(item.photos||[]).concat(photos);
  item.modified=Date.now();
  save(); render();
  toast(photos.length+" image"+(photos.length>1?"s":"")+" added");
}
function newItemWithPhotos(photos){
  if(!photos.length) return;
  var now=Date.now();
  var fresh={id:uid(),title:"",body:"",url:"",image:"",desc:"",logo:"",site:"",
    metaState:null,titleAuto:false,actionable:false,due:null,done:false,tint:"",tags:[],
    photos:photos,checks:[],archived:false,pin:false,created:now,modified:now};
  S.items.unshift(fresh);
  followItem(fresh);
  save(); render();
  toast(photos.length>1?photos.length+" images saved as a note":"Image saved as a note");
}

/* =========================================================================
   LENSES
   ========================================================================= */
var LENS={
  // named "All", not "Everything" — that's the app's name now, and having both
  // would read as a bug rather than as a pun
  all:      { title:"All", note:"", test:function(i){ return !i.done } },
  // Today means today. Letting overdue items pile in here is what makes
  // Reminders' Today list useless — it stops meaning "what I planned for now".
  today:    { title:"Today", note:"Dated today — nothing carried over",
              test:function(i){ return hasAction(i)&&!i.done&&i.due!=null&&dayOf(i.due)===todayKey() } },
  overdue:  { title:"Overdue", note:"Past their date — reschedule or let them go",
              test:function(i){ return hasAction(i)&&!i.done&&i.due!=null&&dayOf(i.due)<todayKey() } },
  someday:  { title:"Someday", note:"Actionable, but not yet scheduled",
              test:function(i){ return hasAction(i)&&!i.done&&i.due==null } },
  upcoming: { title:"Upcoming", note:"Dated after today",
              test:function(i){ return hasAction(i)&&!i.done&&i.due!=null&&dayOf(i.due)>todayKey() } },
  notes:    { title:"Notes", note:"Text only — no link, no checkbox",
              test:function(i){ return !hasLink(i)&&!hasAction(i)&&!i.done } },
  links:    { title:"Links", note:"Everything with a link — including links that are also tasks",
              test:function(i){ return hasLink(i)&&!i.done } },
  tasks:    { title:"Tasks", note:"Everything actionable — cuts across notes and links",
              test:function(i){ return hasAction(i)&&!i.done } },
  done:     { title:"Completed", note:"", test:function(i){ return !!i.done } },
  /* Archive is not completion. Completion says "this is finished"; archive says
     "not now" — and it applies to anything, including notes and links, which
     can never be completed. */
  archived: { title:"Archived", note:"Out of the way, still searchable",
              test:function(i){ return !!i.archived } },
  /* A locked tag: applied by the app, browsable like any other, but not
     something you can add or remove by hand. */
  compiled: { title:"⇥ compiled", note:"Documents built from a page of links — assigned automatically",
              test:function(i){ return !!i.compiled && !i.done } }
};

// Where a newly saved item most naturally lives.
function homeLens(i){ return hasLink(i)?"links" : hasAction(i)?"tasks" : "notes" }

function visible(){
  var q=S.q.toLowerCase().trim();
  var list=S.items.filter(function(i){
    // archived items stay out of every view except their own — but search
    // still reaches them, the way Keep's archive does
    if(!q && S.view!=="archived" && i.archived) return false;
    if(q){
      var hay=(i.title+" "+richToText(i.body)+" "+i.url+" "+i.desc+" "+(i.tags||[]).join(" ")).toLowerCase();
      return hay.indexOf(q)>=0;
    }
    if(S.tag) return (i.tags||[]).indexOf(S.tag)>=0 && !i.done;
    return (LENS[S.view]||LENS.all).test(i);
  });
  // Array order IS the order. Sort is stable, so returning 0 for ties keeps
  // whatever arrangement you dragged things into. Date-driven lenses override.
  var byDate=!!{today:1,overdue:1,upcoming:1,someday:1,tasks:1}[S.view];
  list.sort(function(a,b){
    var p=(!!b.pin)-(!!a.pin);
    if(p) return p;
    if(byDate){
      if(a.due!=null&&b.due!=null) return a.due-b.due;
      if(a.due!=null) return -1;
      if(b.due!=null) return 1;
    }
    return 0;
  });
  return list;
}

// Manual arrangement only makes sense where nothing else is claiming the order.
function canReorder(){
  return !S.q && (!!S.tag || !!{all:1,notes:1,links:1,done:1}[S.view]);
}

/* =========================================================================
   RENDER — one card template, slots appear per facet
   ========================================================================= */
var board=document.getElementById("board");
function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c] }) }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,"") }catch(e){ return "" } }
function hue(s){ var h=0; for(var i=0;i<(s||"x").length;i++) h=(h*31+s.charCodeAt(i))%360; return h }

/* ---- typography ------------------------------------------------------
   macOS applies smart quotes in its own text engine. Safari honours that
   setting inside web pages; Chromium browsers ignore it entirely — which is
   why the app produced straight quotes regardless of your system preference.
   A page also can't read that preference. So we do our own substitution and
   let you pick the style, including Greek « ».
   --------------------------------------------------------------------- */
var QUOTES={
  off:null,
  en:{open:"“",close:"”"},   // “ ”
  gr:{open:"«",close:"»"}    // « »
};
var QORDER=["gr","en","off"];
var QLABEL={gr:"« » Greek", en:"“ ” English", off:'" Straight'};
var quoteStyle="gr";

// A quote opens if there's nothing but space or an opening bracket before it.
function opensHere(prev){ return !prev || /[\s(\[{«“‘—–-]/.test(prev) }
function quoteFor(prev,ch){
  var q=QUOTES[quoteStyle];
  if(!q) return null;
  if(ch==='"') return opensHere(prev)?q.open:q.close;
  // the single mark is nearly always an apostrophe, and never a guillemet
  if(ch==="'") return opensHere(prev)?"‘":"’";
  return null;
}
function attachSmartQuotes(el,rich){
  if(!el||el.__sq) return;
  el.__sq=true;
  el.addEventListener("beforeinput",function(e){
    if(quoteStyle==="off") return;
    if(e.inputType!=="insertText"||(e.data!=='"'&&e.data!=="'")) return;
    var prev="";
    if(rich){
      var sel=window.getSelection();
      if(!sel||!sel.rangeCount) return;
      var r=sel.getRangeAt(0);
      if(r.startContainer.nodeType===3&&r.startOffset>0)
        prev=r.startContainer.data.charAt(r.startOffset-1);
    } else {
      var s=el.selectionStart;
      prev=s>0?el.value.charAt(s-1):"";
    }
    var rep=quoteFor(prev,e.data);
    if(!rep) return;
    e.preventDefault();
    if(rich){
      try{ document.execCommand("insertText",false,rep) }catch(err){}
    } else {
      var a=el.value.slice(0,el.selectionStart), b=el.value.slice(el.selectionEnd);
      el.value=a+rep+b;
      el.selectionStart=el.selectionEnd=a.length+rep.length;
      el.dispatchEvent(new Event("input",{bubbles:true}));
    }
  });
}

/* App-wide text scale. Content scales — titles, note bodies, excerpts, the
   capture box — while the chrome around it stays put, so the interface
   doesn't grow along with what you're reading. Bounded at both ends. */
// Shown as a plain type size. 16 is the app's real body size, so it reads as
// "what size is my text" rather than as an abstract percentage.
var SIZES=[12,14,16,18,20,22], BASE=16, sizeIx=2;
function setNoteSize(ix){
  sizeIx=Math.max(0,Math.min(SIZES.length-1,ix));
  document.documentElement.style.setProperty("--tscale",String(SIZES[sizeIx]/BASE));
  var v=document.getElementById("szval");
  if(v) v.textContent=SIZES[sizeIx];
  var lo=document.getElementById("szdown"), hi=document.getElementById("szup");
  if(lo) lo.disabled=(sizeIx===0);
  if(hi) hi.disabled=(sizeIx===SIZES.length-1);
  try{ localStorage.setItem("trove.notesize",String(sizeIx)) }catch(e){}
}

/* ---- rich text -------------------------------------------------------
   Note bodies are real formatted text, not markdown source. They're stored
   as a tiny, strictly whitelisted slice of HTML: bold, italic, underline,
   line breaks. Nothing else survives, including anything pasted in.
   md() below is kept only to upgrade older plain-text notes on first load,
   and would be reused by a Markdown export.
   --------------------------------------------------------------------- */
var RICH_OK={STRONG:1,B:1,EM:1,I:1,U:1,BR:1,A:1,UL:1,OL:1,LI:1};
var SAFE_HREF=/^(https?:|mailto:)/i;
// these are removed along with everything inside them, rather than unwrapped
var RICH_DROP={SCRIPT:1,STYLE:1,NOSCRIPT:1,IFRAME:1,OBJECT:1,EMBED:1,TEMPLATE:1,
  LINK:1,META:1,HEAD:1,TITLE:1,SVG:1};

function sanitizeRich(html){
  var box=document.createElement("div");
  box.innerHTML=html||"";
  (function walk(parent){
    [].slice.call(parent.childNodes).forEach(function(n){
      if(n.nodeType===3) return;                       // text stays
      if(n.nodeType!==1){ parent.removeChild(n); return }
      var tag=(n.tagName||"").toUpperCase();
      if(RICH_DROP[tag]){ parent.removeChild(n); return }   // drop contents too
      walk(n);
      if(tag==="DIV"||tag==="P"){                      // block → break + its contents
        parent.insertBefore(document.createElement("br"),n);
        while(n.firstChild) parent.insertBefore(n.firstChild,n);
        parent.removeChild(n);
        return;
      }
      if(!RICH_OK[tag]){                               // unwrap anything unknown
        while(n.firstChild) parent.insertBefore(n.firstChild,n);
        parent.removeChild(n);
        return;
      }
      if(tag==="A"){
        // keep the address if it's a real web or mail link; otherwise the
        // anchor is dropped and only its text survives
        var href=(n.getAttribute("href")||"").trim();
        [].slice.call(n.attributes).forEach(function(a){ n.removeAttribute(a.name) });
        if(SAFE_HREF.test(href)){
          n.setAttribute("href",href);
          n.setAttribute("target","_blank");
          n.setAttribute("rel","noopener noreferrer");
        } else {
          while(n.firstChild) parent.insertBefore(n.firstChild,n);
          parent.removeChild(n);
        }
        return;
      }
      [].slice.call(n.attributes).forEach(function(a){ n.removeAttribute(a.name) });
    });
  })(box);
  return box.innerHTML
    .replace(/^(\s*<br\s*\/?>)+/i,"")
    .replace(/(<br\s*\/?>\s*){3,}/gi,"<br><br>")
    .trim();
}
function richToText(html){
  var box=document.createElement("div");
  box.innerHTML=(html||"").replace(/<br\s*\/?>/gi,"\n");
  return box.textContent||"";
}
// plain text (possibly with markdown in it) → rich HTML. Used once per note.
function toRich(s){
  if(!s) return "";
  if(/<(strong|b|em|i|u|br)\b/i.test(s)) return s;
  return md(s).replace(/\r?\n/g,"<br>");
}

function md(s){
  s=esc(s);
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  // the marked span must start and end on a non-space, so "2 * 3 * 4" stays arithmetic
  s=s.replace(/(^|[\s(>])\*(\S(?:[^*\n]*\S)?)\*(?=[\s.,;:!?)]|$)/g,"$1<em>$2</em>");
  s=s.replace(/(^|[\s(>])_(\S(?:[^_\n]*\S)?)_(?=[\s.,;:!?)]|$)/g,"$1<em>$2</em>");
  return s;
}
function words(s){ return (s||"").trim().split(/\s+/).filter(Boolean).length }

/* One photo-grid renderer, used by both cards and the editor. */
function photoGrid(item,editable){
  var ps=item.photos||[], n=ps.length;
  if(!n) return "";
  var shown=ps.slice(0,editable?ps.length:4);
  var klass=n===1?"n1":n===2?"n2":n===3?"n3":"nx";
  if(editable) klass=n===1?"n1":n===2?"n2":n===3?"n3":"nx";
  return '<div class="photos '+klass+'">'+shown.map(function(p,ix){
    var isMore=(!editable&&ix===3&&n>4);
    var cell='<div class="ph'+(isMore?" more":"")+'"';
    if(isMore) cell+=' data-more="'+(n-3)+'"';
    // let portraits be tall — masonry columns handle it, and cropping a photo
    // to fit a card is worse than a tall card
    if(n===1&&p.w&&p.h) cell+=' style="aspect-ratio:'+Math.min(2.4,Math.max(.5,p.w/p.h)).toFixed(3)+'"';
    cell+=' data-photo="'+item.id+'" data-idx="'+ix+'">';
    return cell+'<img draggable="false" src="'+esc(p.src)+'" alt="" loading="lazy">'
      +(editable?'<button class="rm" data-rmimg="'+ix+'" title="Remove">✕</button>':"")+'</div>';
  }).join("")+'</div>';
}

function cardHTML(i){
  var L=hasLink(i), A=hasAction(i), P=hasPhotos(i);
  var cls="card"+(i.tint?" tint-"+i.tint:"")+(i.done?" done":"")+(L?" haslink":"");

  // A short, text-only note is set large. Nothing but words, and few of them,
  // means it's a thought — it should look like one rather than a clipped paragraph.
  if(isPlain(i)&&!P&&!i.done){
    var wc=words(i.title)+words(richToText(i.body));
    if(wc>0&&wc<=30) cls+=" display"+(wc<=12?" xl":"")+(i.body?"":" titleonly");
  }

  var h=host(i.url), hu=hue(h);

  // Attached images become the card header. They outrank an auto-fetched link
  // cover — something you chose beats something we guessed.
  var gallery=photoGrid(i,false);

  var cover="";
  if(L&&!hasPhotos(i)){
    var g="linear-gradient(135deg,hsl("+hu+" 46% 80%),hsl("+((hu+45)%360)+" 42% 90%))";
    cover='<div class="thumb'+(i.image?" tall":"")+'" style="background:'+g+'">'
      +(i.image?'<img draggable="false" src="'+esc(i.image)+'" loading="lazy" alt="" onload="this.classList.add(\'in\')" onerror="this.remove()">':"")
      +(i.metaState==="loading"?'<div class="skel"></div>':"")+'</div>';
  }

  var checkbox=A?'<div class="box" data-check="'+i.id+'">✓</div>':"";
  var title=i.title?'<div class="ctitle">'+esc(i.title)+'</div>':"";

  var srcline="";
  if(L){
    var favimg=i.logo?'<img draggable="false" src="'+esc(i.logo)+'" alt="" onerror="this.remove()">':"";
    var status=i.metaState==="loading"?'<span class="pulse"></span>'
      :(i.metaState==="fail"?'<button class="refetch" data-refetch="'+i.id+'">retry</button>':"");
    srcline='<div class="srcline"><span class="fav" style="background:hsl('+hu+' 42% 46%)">'
      +esc((h[0]||"?").toUpperCase())+favimg+'</span>'+esc(i.site||h)+status+'</div>';
  }

  // checklist: show the first few, tickable straight from the card
  var checks="";
  if(hasChecks(i)){
    var cs=i.checks, showN=Math.min(cs.length,6);
    checks='<div class="checks">'+cs.slice(0,showN).map(function(c,ix){
      return '<div class="chk'+(c.d?" on":"")+'">'
        +'<span class="cbox" data-ck="'+i.id+'|'+ix+'">✓</span>'
        +'<span>'+esc(c.t)+'</span></div>';
    }).join("")
      +(cs.length>showN?'<div class="chkmore">+'+(cs.length-showN)+' more</div>':"")
      +'</div>';

  var foot=[];
