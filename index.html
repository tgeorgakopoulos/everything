/* =========================================================================
   CAPTURE PARSER — returns facets, never a single type.
   ========================================================================= */
var DAYS=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

function parse(raw){
  var text=(raw||"").trim();
  var out={title:"",body:"",url:"",tags:[],due:null,timed:false,actionable:false,titleAuto:false};
  if(!text) return out;

  text=text.replace(/(^|\s)#([\p{L}\d_-]+)/gu,function(m,p,t){ out.tags.push(t.toLowerCase()); return p });

  var um=text.match(/https?:\/\/[^\s]+|(^|\s)www\.[^\s]+/i);
  if(um){
    out.url=um[0].trim();
    if(!/^https?:/i.test(out.url)) out.url="https://"+out.url;
    text=text.replace(um[0],"").trim();
  }

  if(/^(todo|task)[:\s]/i.test(text)){ text=text.replace(/^(todo|task)[:\s]+/i,""); out.actionable=true }
  if(/^[-*]\s+|^\[\s*\]\s*/.test(text)){ text=text.replace(/^[-*]\s+|^\[\s*\]\s*/,""); out.actionable=true }
  if(/^(read|watch|call|email|buy|book|send|finish|review|pay|fix)\b/i.test(text)) out.actionable=true;

  var now=new Date(), due=null, hit=null, m, low=text.toLowerCase();

  // A bare day word is only a deadline if it's introduced by a preposition ("by friday")
  // or sits at the end of the line ("water the plants tomorrow", "… tomorrow 7am").
  // Otherwise it's just a word: "notes for the friday standup" stays a plain note.
  function dateAllowed(str,mm){
    var end=mm.index+mm[0].length, nx=str.charAt(end);
    if(nx==="'"||nx==="’") return false;          // possessive: "today's meeting"
    var before=str.slice(0,mm.index).trim(), after=str.slice(end).trim();
    if(/\b(by|on|due|before|until|this|next)$/i.test(before)) return true;
    if(after==="") return true;
    return /^(at\s+)?\d{1,2}(:\d{2})?\s*(am|pm)?[.!]?$/i.test(after);
  }

  if((m=low.match(/\bin (\d+) (day|days|week|weeks)\b/))){
    var n=+m[1]*(/week/.test(m[2])?7:1), d=startOfDay(now); d.setDate(d.getDate()+n); due=d; hit=m[0];
  } else if((m=low.match(/\bnext week\b/))){ var d2=startOfDay(now); d2.setDate(d2.getDate()+7); due=d2; hit=m[0] }
  else if((m=low.match(/\b(today|tonight)\b/))&&dateAllowed(low,m)){ due=startOfDay(now); hit=m[0] }
  else if((m=low.match(/\btomorrow\b/))&&dateAllowed(low,m)){ var d3=startOfDay(now); d3.setDate(d3.getDate()+1); due=d3; hit=m[0] }
  else if((m=low.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/))&&dateAllowed(low,m)){
    var idx=-1; for(var k=0;k<DAYS.length;k++){ if(DAYS[k].indexOf(m[1])===0){ idx=k; break } }
    if(idx>=0){ var d4=startOfDay(now), delta=(idx-d4.getDay()+7)%7||7; d4.setDate(d4.getDate()+delta); due=d4; hit=m[0] }
  }
  if(hit){
    // also swallow a preposition that only existed to introduce the date ("… by friday")
    var esq=hit.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    text=text.replace(new RegExp("\\b(?:by|on|due|before|until|for)\\s+"+esq+"\\b","i"),"")
             .replace(new RegExp("\\b"+esq+"\\b","i"),"").trim();
  }

  var tm=text.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i)||text.match(/\bat\s+(\d{1,2}):(\d{2})\b/);
  if(tm){
    var h=+tm[1], mi=+(tm[2]||0), ap=(tm[3]||"").toLowerCase();
    if(ap==="pm"&&h<12) h+=12; if(ap==="am"&&h===12) h=0;
    if(!due) due=startOfDay(now);
    due=new Date(due); due.setHours(h,mi,0,0);
    if(due.getTime()<Date.now()-6e4 && !hit) due.setDate(due.getDate()+1);
    text=text.replace(tm[0],"").trim();
  }
  if(due){ out.due=due.getTime(); out.actionable=true; out.timed=!!tm }

  text=text.replace(/\s{2,}/g," ").replace(/^[-–—\s]+/,"")
           .replace(/\s+(by|on|at|due|before|until|for|this)$/i,"").trim();
  var nl=text.indexOf("\n");
  if(nl>-1){ out.title=text.slice(0,nl).trim(); out.body=text.slice(nl+1).trim() }
  else out.title=text;

  if(out.url && !out.title){
    out.titleAuto=true;
    try{ out.title=new URL(out.url).hostname.replace(/^www\./,"") }catch(e){ out.title=out.url }
  }
  return out;
}

/* Some sites simply refuse anything that isn't a browser with a session —
   Amazon answers 503, the NYT and others block scrapers outright. So the
   chain now mixes several kinds of source, and falls back to things that
   can't fail: an ID-derived thumbnail, and a favicon loaded as an image

function ytId(u){

    if(h==="youtube.com"||h==="m.youtube.com"||h==="music.youtube.com"){
      var v=url.searchParams.get("v");

      var m=url.pathname.match(/\/(embed|shorts|live|v)\/([^\/?#]+)/);

function faviconFor(u){

var H_YT={ json:true,

var H_CORSPROXY={ json:false,
  url:function(u){ return "https://corsproxy.io/?url="+encodeURIComponent(u) },

  url:function(u){ return "https://r.jina.ai/"+u },

  var list=[];

   localStorage is small. A native app stores the original file on disk.

var MAXDIM=1200, JPEGQ=0.82;

function readImage(file){
  return new Promise(function(res){
    if(!file||!/^image\//.test(file.type)) return res(null);
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth, h=img.naturalHeight, scale=Math.min(1,MAXDIM/Math.max(w,h));
        var cw=Math.round(w*scale), ch=Math.round(h*scale);
        try{
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          c.getContext("2d").drawImage(img,0,0,cw,ch);
          var isPng=/png/i.test(file.type);
          res({src:c.toDataURL(isPng?"image/png":"image/jpeg",JPEGQ), w:cw, h:ch});
        }catch(e){ res({src:fr.result,w:w,h:h}) }
      };
      img.onerror=function(){ res(null) };
      img.src=fr.result;
    };
    fr.onerror=function(){ res(null) };
    fr.readAsDataURL(file);
  });
}
function readImages(files){
  var list=[].slice.call(files||[]).filter(function(f){ return /^image\//.test(f.type) });
  return Promise.all(list.map(readImage)).then(function(r){ return r.filter(Boolean) });

   Copying a file in Finder fills .files; copying an image out of a web page
   fills only .items with a synthesised blob. Some sources fill both with the
   same image, so this prefers .files and only falls back — merging the two
   would attach every screenshot twice. */
function imageFilesFrom(dt){
  if(!dt) return [];
  var out=[].slice.call(dt.files||[]).filter(function(f){
    return f && /^image\//.test(f.type||"");

  if(out.length) return out;
  [].slice.call(dt.items||[]).forEach(function(it){
    if(it && it.kind==="file" && /^image\//.test(it.type||"")){
      var f=it.getAsFile(); if(f) out.push(f);
    }
  });

}

    it({title:"Packing list", tint:"sky", actionable:true, due:t+3*D,

/* =========================================================================
   LENSES
   ========================================================================= */
var LENS={
  // named "All", not "Everything" — that's the app's name now, and having both
  // would read as a bug rather than as a pun
  all:      { title:"All", note:"", test:function(i){ return !i.done } },
  // Today means today. Letting overdue items pile in here is what makes
  // Reminders' Today list useless — it stops meaning "what I planned for now".
  today:    { title:"Today", note:"Dated today — nothing carried over",
              test:function(i){ return hasAction(i)&&!i.done&&i.due!=null&&dayOf(i.due)===todayKey() } },
  overdue:  { title:"Overdue", note:"Past their date — reschedule or let them go",
              test:function(i){ return hasAction(i)&&!i.done&&i.due!=null&&dayOf(i.due)<todayKey() } },
  someday:  { title:"Someday", note:"Actionable, but not yet scheduled",
              test:function(i){ return hasAction(i)&&!i.done&&i.due==null } },
  upcoming: { title:"Upcoming", note:"Dated after today",
              test:function(i){ return hasAction(i)&&!i.done&&i.due!=null&&dayOf(i.due)>todayKey() } },
  notes:    { title:"Notes", note:"Text only — no link, no checkbox",
              test:function(i){ return !hasLink(i)&&!hasAction(i)&&!i.done } },
  links:    { title:"Links", note:"Everything with a link — including links that are also tasks",
              test:function(i){ return hasLink(i)&&!i.done } },
  tasks:    { title:"Tasks", note:"Everything actionable — cuts across notes and links",
              test:function(i){ return hasAction(i)&&!i.done } },
  done:     { title:"Completed", note:"", test:function(i){ return !!i.done } },
  /* Archive is not completion. Completion says "this is finished"; archive says
     "not now" — and it applies to anything, including notes and links, which
     can never be completed. */
  archived: { title:"Archived", note:"Out of the way, still searchable",
              test:function(i){ return !!i.archived } },
  /* A locked tag: applied by the app, browsable like any other, but not
     something you can add or remove by hand. */
  compiled: { title:"⇥ compiled", note:"Documents built from a page of links — assigned automatically",
              test:function(i){ return !!i.compiled && !i.done } }
};

// Where a newly saved item most naturally lives.
function homeLens(i){ return hasLink(i)?"links" : hasAction(i)?"tasks" : "notes" }

function visible(){
  var q=S.q.toLowerCase().trim();
  var list=S.items.filter(function(i){
    // archived items stay out of every view except their own — but search
    // still reaches them, the way Keep's archive does
    if(!q && S.view!=="archived" && i.archived) return false;
    if(q){
      var hay=(i.title+" "+richToText(i.body)+" "+i.url+" "+i.desc+" "+(i.tags||[]).join(" ")).toLowerCase();
      return hay.indexOf(q)>=0;
    }
    if(S.tag) return (i.tags||[]).indexOf(S.tag)>=0 && !i.done;
    return (LENS[S.view]||LENS.all).test(i);
  });
  // Array order IS the order. Sort is stable, so returning 0 for ties keeps
  // whatever arrangement you dragged things into. Date-driven lenses override.
  var byDate=!!{today:1,overdue:1,upcoming:1,someday:1,tasks:1}[S.view];
  list.sort(function(a,b){
    var p=(!!b.pin)-(!!a.pin);
    if(p) return p;
    if(byDate){
      if(a.due!=null&&b.due!=null) return a.due-b.due;
      if(a.due!=null) return -1;
      if(b.due!=null) return 1;
    }
    return 0;
  });
  return list;
}

// Manual arrangement only makes sense where nothing else is claiming the order.
function canReorder(){
  return !S.q && (!!S.tag || !!{all:1,notes:1,links:1,done:1}[S.view]);
}

/* =========================================================================
   RENDER — one card template, slots appear per facet
   ========================================================================= */
var board=document.getElementById("board");
function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c] }) }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,"") }catch(e){ return "" } }
function hue(s){ var h=0; for(var i=0;i<(s||"x").length;i++) h=(h*31+s.charCodeAt(i))%360; return h }

/* ---- tag colours -----------------------------------------------------
   A tag's colour is a pure function of its name, so #work is the same
   colour on every device and after every reload, with nothing stored.

   The first version ran that name through hue() and asked for
   hsl(h 50% 62%). Two things were wrong with it. The hash — a running
   h*31+char taken mod 360 — has so little state that short words collide
   outright: "design" and "food" both landed on 334. And a flat 50/62
   ignores that hue space is not perceptually even, so hues 95 and 122 are
   two greens a person cannot tell apart even though the numbers differ.

   So: a real hash, and a hand-tuned palette rather than raw hue arithmetic.
   Nineteen stops, each with its own saturation and lightness, walking the
   wheel once. The closest pair measures ΔE 8.7 — well past the ~2.3 where
   a difference stops being visible — and every stop clears 3:1 contrast
   against both the light and the dark background.

   Hashing alone still isn't enough. Nineteen slots and a birthday paradox
   mean two tags collide sooner than you'd think — #design and #food landed
   on the same stop even after the hash was fixed, which is precisely the
   complaint, just less often.

   So the hash picks a *starting* slot and tagColorMap walks forward from it
   until it finds one nobody else is using. Every tag on screen therefore has
   its own colour. Tags are processed in alphabetical order, which is fixed,
   so a tag keeps its colour for as long as the ones sorting before it do —
   adding #wine cannot repaint #work. Only a genuine collision moves anything,
   and only the later of the two. Past nineteen tags the twentieth reuses its
   hashed slot, because at that point something has to give. */
var TAGCOLS=[[4,68,56],[20,74,50],[33,78,45],[45,76,38],[58,62,34],[78,52,37],
  [100,48,40],[128,44,40],[152,50,38],[172,54,38],[188,56,42],[202,58,46],
  [216,58,52],[232,54,58],[250,50,60],[268,46,58],[292,44,54],[318,50,52],[336,58,54]];
// FNV-1a. Cheap, and it actually avalanches — one different letter moves
// every bit, which is the whole point of the exercise.
function hash32(s){
  var h=2166136261;
  for(var i=0;i<(s||"").length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) }
  return h>>>0;
}
function hslOf(c){ return "hsl("+c[0]+" "+c[1]+"% "+c[2]+"%)" }
function tagColor(name){ return hslOf(TAGCOLS[hash32(name)%TAGCOLS.length]) }
function tagColorMap(names){
  var taken={}, out={}, n=TAGCOLS.length;
  names.slice().sort().forEach(function(name){
    var start=hash32(name)%n, k=0, ix;
    do{ ix=(start+k)%n; k++ } while(taken[ix] && k<=n);   // k>n: everything is spoken for
    taken[ix]=1; out[name]=hslOf(TAGCOLS[ix]);
  });
  return out;
}

/* ---- typography ------------------------------------------------------
   macOS applies smart quotes in its own text engine. Safari honours that
   setting inside web pages; Chromium browsers ignore it entirely — which is
   why the app produced straight quotes regardless of your system preference.
   A page also can't read that preference. So we do our own substitution and
   let you pick the style, including Greek « ».
   --------------------------------------------------------------------- */
var QUOTES={
  off:null,
  en:{open:"“",close:"”"},   // “ ”
  gr:{open:"«",close:"»"}    // « »
};
var QORDER=["gr","en","off"];
var QLABEL={gr:"« » Greek", en:"“ ” English", off:'" Straight'};
var quoteStyle="gr";

// A quote opens if there's nothing but space or an opening bracket before it.
function opensHere(prev){ return !prev || /[\s(\[{«“‘—–-]/.test(prev) }
function quoteFor(prev,ch){
  var q=QUOTES[quoteStyle];
  if(!q) return null;
  if(ch==='"') return opensHere(prev)?q.open:q.close;
  // the single mark is nearly always an apostrophe, and never a guillemet
  if(ch==="'") return opensHere(prev)?"‘":"’";
  return null;
}
function attachSmartQuotes(el,rich){
  if(!el||el.__sq) return;
  el.__sq=true;
  el.addEventListener("beforeinput",function(e){
    if(quoteStyle==="off") return;
    if(e.inputType!=="insertText"||(e.data!=='"'&&e.data!=="'")) return;
    var prev="";
    if(rich){
      var sel=window.getSelection();
      if(!sel||!sel.rangeCount) return;
      var r=sel.getRangeAt(0);
      if(r.startContainer.nodeType===3&&r.startOffset>0)
        prev=r.startContainer.data.charAt(r.startOffset-1);
    } else {
      var s=el.selectionStart;
      prev=s>0?el.value.charAt(s-1):"";
    }
    var rep=quoteFor(prev,e.data);
    if(!rep) return;
    e.preventDefault();
    if(rich){
      try{ document.execCommand("insertText",false,rep) }catch(err){}
    } else {
      var a=el.value.slice(0,el.selectionStart), b=el.value.slice(el.selectionEnd);
      el.value=a+rep+b;
      el.selectionStart=el.selectionEnd=a.length+rep.length;
      el.dispatchEvent(new Event("input",{bubbles:true}));
    }
  });
}

/* App-wide text scale. Content scales — titles, note bodies, excerpts, the
   capture box — while the chrome around it stays put, so the interface
   doesn't grow along with what you're reading. Bounded at both ends. */
// Shown as a plain type size. 16 is the app's real body size, so it reads as
// "what size is my text" rather than as an abstract percentage.
var SIZES=[12,14,16,18,20,22], BASE=16, sizeIx=2;
function setNoteSize(ix){
  sizeIx=Math.max(0,Math.min(SIZES.length-1,ix));
  document.documentElement.style.setProperty("--tscale",String(SIZES[sizeIx]/BASE));
  var v=document.getElementById("szval");
  if(v) v.textContent=SIZES[sizeIx];
  var lo=document.getElementById("szdown"), hi=document.getElementById("szup");
  if(lo) lo.disabled=(sizeIx===0);
  if(hi) hi.disabled=(sizeIx===SIZES.length-1);
  try{ localStorage.setItem("trove.notesize",String(sizeIx)) }catch(e){}
}

/* ---- rich text -------------------------------------------------------
   Note bodies are real formatted text, not markdown source. They're stored
   as a tiny, strictly whitelisted slice of HTML: bold, italic, underline,
   line breaks. Nothing else survives, including anything pasted in.
   md() below is kept only to upgrade older plain-text notes on first load,
   and would be reused by a Markdown export.
   --------------------------------------------------------------------- */
var RICH_OK={STRONG:1,B:1,EM:1,I:1,U:1,BR:1,A:1,UL:1,OL:1,LI:1};

var SAFE_HREF=/^(https?:|mailto:)/i;
// these are removed along with everything inside them, rather than unwrapped
var RICH_DROP={SCRIPT:1,STYLE:1,NOSCRIPT:1,IFRAME:1,OBJECT:1,EMBED:1,TEMPLATE:1,
  LINK:1,META:1,HEAD:1,TITLE:1,SVG:1};

function sanitizeRich(html){
  var box=document.createElement("div");
  box.innerHTML=html||"";
  (function walk(parent){
    [].slice.call(parent.childNodes).forEach(function(n){
      if(n.nodeType===3) return;                       // text stays
      if(n.nodeType!==1){ parent.removeChild(n); return }
      var tag=(n.tagName||"").toUpperCase();
      if(RICH_DROP[tag]){ parent.removeChild(n); return }   // drop contents too
      walk(n);
      if(tag==="DIV"||tag==="P"){                      // block → break + its contents
        parent.insertBefore(document.createElement("br"),n);
        while(n.firstChild) parent.insertBefore(n.firstChild,n);
        parent.removeChild(n);
        return;
      }
      if(!RICH_OK[tag]){                               // unwrap anything unknown
        while(n.firstChild) parent.insertBefore(n.firstChild,n);
        parent.removeChild(n);
        return;
      }
      if(tag==="A"){
        // keep the address if it's a real web or mail link; otherwise the
        // anchor is dropped and only its text survives
        var href=(n.getAttribute("href")||"").trim();
        [].slice.call(n.attributes).forEach(function(a){ n.removeAttribute(a.name) });
        if(SAFE_HREF.test(href)){
          n.setAttribute("href",href);
          n.setAttribute("target","_blank");
          n.setAttribute("rel","noopener noreferrer");
        } else {
          while(n.firstChild) parent.insertBefore(n.firstChild,n);
          parent.removeChild(n);
        }
        return;
      }
      [].slice.call(n.attributes).forEach(function(a){ n.removeAttribute(a.name) });
    });
  })(box);
  return box.innerHTML
    .replace(/^(\s*<br\s*\/?>)+/i,"")
    .replace(/(<br\s*\/?>\s*){3,}/gi,"<br><br>")
    .trim();
}
function richToText(html){
  var box=document.createElement("div");
  box.innerHTML=(html||"").replace(/<br\s*\/?>/gi,"\n");
  return box.textContent||"";
}
// plain text (possibly with markdown in it) → rich HTML. Used once per note.
/* Is this body already marked up, or is it plain text that wants converting?

   The list used to read strong|b|em|i|u|br — written before notes could hold
   lists or links, and never revisited. A note whose body was nothing but
   <ol><li>…</li></ol> matched none of those, so it was judged to be plain
   text and handed to md(), whose first act is esc(). The list came back as
   &lt;ol&gt;&lt;li&gt;… — visible markup where a list used to be.

   What made it look random: normalizeItem calls this on every record arriving
   from sync. Nothing had to change and no new file had to be uploaded. A list
   written on one device was fine until another device pulled it, and a list
   containing one bold word survived while a plain one did not.

   Rather than extend the list again and wait for the next tag to be
   forgotten, this asks about every tag the editor can produce. */
var RICH_TAGS="strong|b|em|i|u|br|a|ul|ol|li|p|div";
var LOOKS_RICH=new RegExp("<\\/?(?:"+RICH_TAGS+")\\b","i");
var LOOKS_ESCAPED=new RegExp("&lt;\\/?(?:"+RICH_TAGS+")(?:&gt;|\\s)","i");

/* Bodies already damaged by the above are repaired in place. The risk is
   somebody who genuinely wanted to display "&lt;ol&gt;" as text, which is a
   fate worth accepting: the alternative is that every list flattened before
   today stays broken for good. Put back through the sanitiser afterwards,
   so unescaping cannot let anything new through. */
function unescapeRich(s){
  return sanitizeRich(String(s)
    .replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/&amp;/g,"&"));          // ampersands last, or &amp;lt; unwinds twice
}

/* An entity is proof of HTML even when there isn't a tag in sight. Type
   "5 < 6" into the editor and it is stored as "5 &lt; 6" — no tags at all,
   so the tag test says plain text, and md() escapes it a second time into
   "5 &amp;lt; 6". Same fault as the lists, different disguise.

   Worth naming what is really wrong here: this function guesses the type of
   its input, and a guess is wrong eventually. The real repair is for a body
   to say what it is — a format field on the record — so nothing downstream
   has to infer it. Until then these three tests cover every case the app
   can actually produce. */
var HAS_ENTITY=/&(?:lt|gt|amp|quot|nbsp|#\d+);/i;

function toRich(s){
  if(!s) return "";
  if(LOOKS_ESCAPED.test(s)) return unescapeRich(s);   // damaged: put it back
  if(LOOKS_RICH.test(s)) return s;                    // markup: leave alone
  if(HAS_ENTITY.test(s)) return s;                    // HTML without tags
  return md(s).replace(/\r?\n/g,"<br>");              // genuinely plain
}

function md(s){
  s=esc(s);
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  // the marked span must start and end on a non-space, so "2 * 3 * 4" stays arithmetic
  s=s.replace(/(^|[\s(>])\*(\S(?:[^*\n]*\S)?)\*(?=[\s.,;:!?)]|$)/g,"$1<em>$2</em>");
  s=s.replace(/(^|[\s(>])_(\S(?:[^_\n]*\S)?)_(?=[\s.,;:!?)]|$)/g,"$1<em>$2</em>");
  return s;
}
function words(s){ return (s||"").trim().split(/\s+/).filter(Boolean).length }

/* One photo-grid renderer, used by both cards and the editor. */
function photoGrid(item,editable){
  var ps=item.photos||[], n=ps.length;
  if(!n) return "";
  var shown=ps.slice(0,editable?ps.length:4);
  var klass=n===1?"n1":n===2?"n2":n===3?"n3":"nx";
  if(editable) klass=n===1?"n1":n===2?"n2":n===3?"n3":"nx";
  return '<div class="photos '+klass+'">'+shown.map(function(p,ix){
    var isMore=(!editable&&ix===3&&n>4);
    var cell='<div class="ph'+(isMore?" more":"")+'"';
    if(isMore) cell+=' data-more="'+(n-3)+'"';
    // let portraits be tall — masonry columns handle it, and cropping a photo
    // to fit a card is worse than a tall card
    if(n===1&&p.w&&p.h) cell+=' style="aspect-ratio:'+Math.min(2.4,Math.max(.5,p.w/p.h)).toFixed(3)+'"';
    cell+=' data-photo="'+item.id+'" data-idx="'+ix+'">';
    return cell+(p.src
        ? '<img draggable="false" src="'+esc(p.src)+'" alt="" loading="lazy">'
        : '<div class="phwait" aria-label="loading"></div>')
      +(editable?'<button class="rm" data-rmimg="'+ix+'" title="Remove">✕</button>':"")+'</div>';
  }).join("")+'</div>';
}

/* One row for list layout. Same data, much less of it. */
function rowHTML(i){

  var due="";
  if(A&&i.due!=null) due='<span class="due '+dueClass(i.due)+'">'+fmtDue(i.due,i.timed)+'</span>';
  else if(A&&!i.done) due='<span class="due later">Someday</span>';

  var tags=(i.tags||[]).slice(0,3).map(function(t){ return '<span class="tag">#'+esc(t)+'</span>' }).join("");

  if(S.sel[i.id]) cls+=" picked";
  return '<div class="'+cls+'" data-id="'+i.id+'"'+(canReorder()?' draggable="true"':"")+'>'
    +(i.pin?'<div class="pinned"></div>':"")
    +'<button class="pick" data-pick="'+i.id+'" title="Select">✓</button>'
    +(A?'<div class="box" data-check="'+i.id+'">✓</div>':"")
    +thumb
    +'<div class="rtitle">'+(esc(i.title)||'<span style="color:var(--faint)">Untitled</span>')+'</div>'
    +'<div class="rexc">'+exc.join(" · ")+'</div>'
    +'<div class="rtags">'+tags+'</div>'
    +'<div class="rdue">'+due+'</div>'
    +'<div class="quick">'
      +(L?'<button data-open="'+i.id+'" class="go" title="Open link in a new tab">↗</button>':"")
      +'<button data-pin="'+i.id+'" class="'+(i.pin?"on":"")+'" title="Pin">◆</button>'
      +'<button data-act="'+i.id+'" class="'+(A?"on":"")+'" title="'+(A?"Remove checkbox":"Make actionable")+'">☑</button>'
      +'<button data-post="'+i.id+'" class="'+(i.postId?"posted":"")+'" title="'
        +(i.postId?"Published — open the post":"Post this publicly")+'">◈</button>'
    +'</div></div>';
}

/* Render a set of items in whichever layout the current lens is using. */
function block(list){
  var lay=layoutFor();
  if(lay==="list") return '<div class="list">'+list.map(rowHTML).join("")+'</div>';
  return '<div class="grid '+(lay==="cards"?"cards":"mood")+'">'+list.map(cardHTML).join("")+'</div>';
}

/* Pinned items get their own block rather than merely sorting first.
   In the card grid, sorting first is enough — the grid fills left to right,
   so they take the top row. Moodboard is CSS columns, which fill top to
   bottom: sorting first there ran the pinned items down the left-hand edge
   instead of across the top. Giving them a container of their own makes the
   masonry balance them across the width in every layout. */
function pinSplit(list,restLabel){
  var pins=list.filter(function(i){ return i.pin }),
      rest=list.filter(function(i){ return !i.pin });
  if(!pins.length||!rest.length) return block(list);   // no split worth marking
  return '<div class="grouphead">Pinned</div>'+block(pins)
        +'<div class="grouphead">'+esc(restLabel)+'</div>'+block(rest);
}

function bucket(i){
  if(i.due==null) return "Someday";
  /* dayOf and todayKey are both timestamps, so their difference is in
     milliseconds. This read it as a number of days and compared it against
     1 and 7, which no millisecond count is ever going to be: everything
     later than today fell through to "Later", and Tomorrow and This week
     have been unreachable since they were written. fmtDue, three hundred
     lines up, does divide — which is how the same mistake stayed invisible.
     Both the Tasks page and the task column group by this. */
  var d=Math.round((dayOf(i.due)-todayKey())/86400000);
  if(d<0) return "Overdue";
  if(d===0) return "Today";
  if(d===1) return "Tomorrow";
  if(d<7) return "This week";
  return "Later";
}

function render(){
  var list=visible(), lens=LENS[S.view]||LENS.all;

  /* Posts is not a lens over your items — it lists a different table
     entirely — so it takes the page before any of the item machinery runs. */
  var onPosts=(S.view==="posts"&&!S.q&&!S.tag);
  document.body.classList.toggle("on-posts",onPosts);
  if(onPosts){
    document.getElementById("viewtitle").textContent="Posts";
    document.getElementById("lensnote").textContent=
      "Public — anyone with the address can see this";
    board.innerHTML=renderPosts();
    paintSidebar();
    paintTaskbar();
    return;
  }

  document.getElementById("viewtitle").textContent =
    S.q?'"'+S.q+'"' : S.tag?"#"+S.tag : lens.title;
  document.getElementById("lensnote").textContent = (S.q||S.tag)?"" : lens.note;

  if(!list.length){
    board.innerHTML='<div class="empty"><div class="big">◌</div>'
      +(S.q?"Nothing matches that.":"Nothing here yet — capture something above.")+'</div>';
  } else if(S.view==="all"&&!S.q&&!S.tag){
    board.innerHTML=pinSplit(list,"Recent");
  } else {
    board.innerHTML=pinSplit(list, S.q?"Results":S.tag?"#"+S.tag:lens.title);
  }

  var lay=layoutFor();
  document.querySelectorAll("#layoutseg button").forEach(function(b){
    b.classList.toggle("on", b.dataset.lay===lay);
  });
  // compiling only means something where there are links to compile
  var nlinks=list.filter(hasLink).length;
  document.getElementById("compilebtn").style.display=nlinks?"":"none";
  paintSel();
  paintBackupHint();
  paintSidebar();
  paintTaskbar();
}

/* =========================================================================
   THE TASK COLUMN

   Tasks are the one facet you need while doing something else. Notes and
   links you go and look at; a task has to be able to sit beside the thing
   it is about. So this is a third grid track rather than a page — opening it
   narrows the board instead of replacing it.

   It renders from the same items as everything else, with the same buckets
   the Tasks page uses, so the two can never disagree.
   ========================================================================= */
var TBKEY="trove.taskbar";
/* Which slice of the task list the column is showing. While the column is
   open the sidebar's task rows aim it instead of navigating the board — you
   asked for tasks beside your work, and sending you to a full page of them
   is the opposite of that. Closed, those rows behave exactly as they always
   have, so nothing is taken away until you decide it should be. */
var TBVIEWS={tasks:"Tasks",today:"Today",overdue:"Overdue",
  upcoming:"Upcoming",someday:"Someday",done:"Completed"};
var TB={filter:"tasks"};
function taskbarOpen(){ return document.querySelector(".app").classList.contains("tb") }
function setTaskbar(on){
  document.querySelector(".app").classList.toggle("tb",!!on);
  try{ localStorage.setItem(TBKEY,on?"1":"") }catch(e){}
  if(on) paintTaskbar();
  // the sidebar has to be repainted either way, or the row it lit stays lit
  paintSidebar();
}
function toggleTaskbar(){ setTaskbar(!taskbarOpen()) }

function openTasks(){
  var test=(LENS[TB.filter]||LENS.tasks).test;
  return S.items.filter(function(i){
    return !i.archived&&test(i);
  }).sort(function(a,b){
    // undated work is not urgent work: it sinks, whatever order the list is in
    if(a.due==null&&b.due==null) return 0;
    if(a.due==null) return 1;
    if(b.due==null) return -1;
    return a.due-b.due;
  });
}

function setTaskFilter(v){
  TB.filter=TBVIEWS[v]?v:"tasks";
  paintTaskbar();
  paintSidebar();
  document.getElementById("tblist").scrollTop=0;
}

function paintTaskbar(){
  if(!taskbarOpen()) return;
  var list=openTasks(), box=document.getElementById("tblist");
  document.getElementById("tbtitle").textContent=TBVIEWS[TB.filter]||"Tasks";
  document.getElementById("tbcount").textContent=list.length||"";
  document.getElementById("tball").style.display=TB.filter==="tasks"?"none":"";
  if(!list.length){
    box.innerHTML='<div class="tbempty">'
      +(TB.filter==="tasks"?"Nothing due.<br>Add one above, or tick ☑ on any note."
        :"Nothing in "+esc(TBVIEWS[TB.filter])+".")+'</div>';
    return;
  }
  if(TB.filter==="done"){
    // finished work has no urgency left to sort by, and filing it under
    // "Overdue" would be a small insult
    box.innerHTML=list.map(taskRowHTML).join("");
    return;
  }
  var order=["Overdue","Today","Tomorrow","This week","Later","Someday"], groups={};
  list.forEach(function(i){ (groups[bucket(i)]=groups[bucket(i)]||[]).push(i) });
  box.innerHTML=order.filter(function(k){ return groups[k] }).map(function(k){
    return '<div class="tbgroup'+(k==="Overdue"?" late":"")+'">'+k
      +' <span style="opacity:.6">'+groups[k].length+'</span></div>'
      +groups[k].map(taskRowHTML).join("");
  }).join("");
}
function taskRowHTML(i){
  var meta=[];
  if(i.due!=null) meta.push('<span class="'+dueClass(i.due)+'">'+fmtDue(i.due,i.timed)+'</span>');
  if(hasLink(i)) meta.push(esc(i.site||host(i.url)));
  (i.tags||[]).slice(0,2).forEach(function(t){ meta.push("#"+esc(t)) });
  var label=i.title||richToText(i.body).replace(/\s+/g," ").trim()||"Untitled";
  return '<div class="tbrow'+(i.done?" gone":"")+'" data-tbopen="'+i.id+'">'
    +'<span class="tbbox'+(i.done?" on":"")+'" data-tbdone="'+i.id+'" title="'
      +(i.done?"Not done after all":"Done")+'">✓</span>'
    +'<span class="tbtx"><span class="tbttl">'+esc(label)+'</span>'
    +(meta.length?'<span class="tbmeta">'+meta.join("")+'</span>':"")
    +'</span></div>';
}

(function wireTaskbar(){
  var bar=document.getElementById("taskbar"), input=document.getElementById("tbin");

  document.getElementById("tbclose").addEventListener("click",function(){ setTaskbar(false) });
  document.getElementById("tball").addEventListener("click",function(){ setTaskFilter("tasks") });

  bar.addEventListener("click",function(e){
    var d=e.target.closest("[data-tbdone]");
    if(d){
      e.stopPropagation();
      var t=byId(d.dataset.tbdone);
      if(t){
        t.done=!t.done; t.modified=Date.now();
        save(); render(); toast(t.done?"Done":"Back on the list");
      }
      return;
    }
    var o=e.target.closest("[data-tbopen]");
    if(o) openEditor(o.dataset.tbopen);
  });

  input.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      /* One Escape clears what you typed, a second closes the column.
         The first must not bubble: the app-level Escape shuts the column,
         and losing the panel because you changed your mind about a word is
         not what anyone means by cancel. */
      if(input.value){ e.stopPropagation(); input.value=""; return }
      input.blur();
      return;
    }
    if(e.key!=="Enter") return;
    var text=input.value.trim();
    if(!text) return;
    /* Same parser as the main capture box, so "call Elena friday" lands on
       Friday here too. Forced actionable: this column is only tasks, and
       something typed into it that quietly became a note would be lost. */
    var p=parse(text), sh=shapeCapture(p,true), now=Date.now();
    S.items.unshift({ id:uid(), title:sh.title, body:sh.body, url:p.url,
      image:"", desc:"", logo:"", site:"", metaState:null, titleAuto:p.titleAuto,
      actionable:true, due:p.due, timed:!!p.timed, done:false, tint:"",
      tags:p.tags, photos:[], checks:sh.checks, archived:false, pin:false,
      postId:"", created:now, modified:now });
    input.value="";
    save(); render();
    if(p.url) fetchMeta(S.items[0]);
  });
})();

/* Lenses, counts, tags and which nav row is lit. Split out of render because
   the Posts page needs all of it and none of the item machinery above. */
function paintSidebar(){
  var all=S.items;
  function count(v){ return all.filter(LENS[v].test).length }

    var e=document.getElementById("c-"+v); if(e) e.textContent=count(v)||"";
  });

      +' title="Applied automatically — can\'t be added or removed by hand">'

  // colours resolved against the whole set, so no two dots on screen match

  document.querySelectorAll(".sidebar .nav[data-view]").forEach(function(b){

       now: it gets the column's own surface and reaches toward it. */
    if(TBVIEWS[v]){
      b.classList.remove("on");
      b.classList.toggle("tbon", taskbarOpen()&&v===TB.filter);
    } else {
      b.classList.remove("tbon");
      b.classList.toggle("on", !S.tag&&!S.q&&v===S.view);
    }
  });
  document.querySelectorAll(".mobtabs button").forEach(function(b){
    b.classList.toggle("on", !S.tag&&b.dataset.view===S.view);

  // Posts counts what is on the web, which is a different table
  var cp=document.getElementById("c-posts");
  if(cp) cp.textContent=POSTS.list.length||"";
  document.getElementById("nav-posts").style.display=SYNC.session?"":"none";
}

/* =========================================================================
   SYNC — one library, several devices.

   Talks to Supabase over plain HTTP rather than through their SDK. That keeps
   the app a single file with no dependencies, keeps it working from file://,
   and satisfies the extension's content policy, which forbids remote scripts.
   It's about two hundred lines instead of a hundred kilobytes.

   The shape of it:
     · every edit is written locally first and drawn immediately
     · a diff against a shadow copy works out what actually changed
     · changes queue and go up when there's a connection
     · on open, on focus, and once a minute, it asks for what changed there
     · the later edit wins, per item, judged by the app's own modified stamp
     · deletions are marked rather than dropped, so they travel

   Nothing here is on the critical path: pull the plug and the app behaves
   exactly as it did before any of this existed.
   ========================================================================= */
var SUPA={
  url:"https://hzbnvkvhcpdodmylgqxb.supabase.co",
  key:"sb_publishable_acuePtNZl9GO4dq7Tav6FA_tp6-4VyM"
};

var SYNC={
  on:!!(SUPA.url&&SUPA.key),
  session:null,          // {access_token, refresh_token, expires_at, email}
  shadow:{},             // id -> the JSON we believe the server has
  queue:{},              // id -> "put" | "del"
  lastPull:"1970-01-01T00:00:00Z",
  pending:{},            // rows held back because their note was open
  pulledOnce:false,      // have we heard from the server at all this session?
  status:"off",          // off | out | idle | busy | error | offline
  note:"",
  timer:null
};

function supaHeaders(auth){
  var h={ "apikey":SUPA.key, "Content-Type":"application/json" };
  if(auth&&SYNC.session) h["Authorization"]="Bearer "+SYNC.session.access_token;
  return h;
}

function loadSession(){
  try{
    var raw=localStorage.getItem("trove.session");
    if(raw) SYNC.session=JSON.parse(raw);
    SYNC.lastPull=localStorage.getItem("trove.lastPull")||SYNC.lastPull;
    var sh=localStorage.getItem("trove.shadow");
    if(sh){
      SYNC.shadow=JSON.parse(sh);
      // shrink a shadow written by an older build, which held whole records
      Object.keys(SYNC.shadow).forEach(function(k){
        var v=SYNC.shadow[k];
        if(typeof v==="string"&&v.charAt(0)==="{") SYNC.shadow[k]=sig(v);
      });
    }
    var q=localStorage.getItem("trove.queue");
    if(q) SYNC.queue=JSON.parse(q);
  }catch(e){}
}
function keepSession(){
  try{
    if(SYNC.session) localStorage.setItem("trove.session",JSON.stringify(SYNC.session));
    else localStorage.removeItem("trove.session");
    localStorage.setItem("trove.lastPull",SYNC.lastPull);
    localStorage.setItem("trove.shadow",JSON.stringify(SYNC.shadow));
    localStorage.setItem("trove.queue",JSON.stringify(SYNC.queue));
  }catch(e){}
}

/* ---- auth ----
   Email and password, and no email is ever sent.

   The two obvious alternatives both fail here. A magic link has to redirect
   you somewhere, and browsers refuse to redirect into chrome-extension:// or
   file:// addresses. A typed code would need the email template changed to
   include one — and since June 2026 Supabase locks template editing on new
   free projects unless you bring your own mail server.

   A password sidesteps all of it: one round trip, no inbox, no rate limit,
   works identically on every device and offline-tolerant afterwards. */

function keepAuth(j,email){
  if(!j||!j.access_token) throw { msg:"no session returned" };
  SYNC.session={
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:Date.now()+((j.expires_in||3600)*1000),
    email:(j.user&&j.user.email)||email
  };
  keepSession();
  return true;
}
function authPost(path,body){
  return fetch(SUPA.url+path,{
    method:"POST", headers:supaHeaders(false), body:JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok) throw j;
      return j;
    });
  });
}
function signInPassword(email,pw){
  return authPost("/auth/v1/token?grant_type=password",{ email:email, password:pw })
    .then(function(j){ return keepAuth(j,email) });
}
function signUpPassword(email,pw){
  return authPost("/auth/v1/signup",{ email:email, password:pw })
    .then(function(j){
      if(!j.access_token) throw { msg:"account made, but it needs email confirmation — turn that off in Supabase" };
      return keepAuth(j,email);
    });
}
/* One button for both cases: sign in, and if there's no such account yet,
   make one. A wrong password on an existing account surfaces as exactly that
   rather than as a confusing signup error. */
function errText(e){
  return String((e&&(e.error_description||e.msg||e.message||e.error))||"");
}
function signInOrUp(email,pw){
  return signInPassword(email,pw).catch(function(e){
    var msg=errText(e);
    if(!/invalid login credentials/i.test(msg)) throw e;

    /* Supabase answers "invalid login credentials" both for an unknown email
       and for a wrong password — deliberately, so nobody can probe which
       addresses exist. So try creating the account, and read the failure:

         "already registered"  -> the email is known, the password is wrong
         "signups not allowed" -> we can't create one, so the pair simply
                                  doesn't open anything here

       Reporting the signup error verbatim was misleading: it made a mistyped
       password look like a configuration problem. */
    return signUpPassword(email,pw).catch(function(e2){
      var m2=errText(e2);
      if(/already registered|already exists|user_already/i.test(m2))
        throw { msg:"Wrong password for "+email };
      if(/signup|sign.?up/i.test(m2)&&/disabled|not allowed/i.test(m2))
        throw { msg:"No account here matches that email and password — check both" };
      throw e2;
    });
  });
}

function refreshSession(){
  if(!SYNC.session||!SYNC.session.refresh_token) return Promise.reject("no session");
  return fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST", headers:supaHeaders(false),
    body:JSON.stringify({ refresh_token:SYNC.session.refresh_token })
  }).then(function(r){ if(!r.ok) throw 0; return r.json() })
    .then(function(j){
      SYNC.session={ access_token:j.access_token, refresh_token:j.refresh_token,
        expires_at:Date.now()+((j.expires_in||3600)*1000),
        email:(j.user&&j.user.email)||(SYNC.session&&SYNC.session.email) };
      keepSession();
    });
}
function withFreshSession(){
  if(!SYNC.session) return Promise.reject("signed out");
  if(SYNC.session.expires_at-Date.now()>60000) return Promise.resolve();
  return refreshSession();
}
function signOut(){
  SYNC.session=null; SYNC.shadow={}; SYNC.queue={}; SYNC.pending={};
  SYNC.pulledOnce=false;
  POSTS.list=[]; POSTS.profile=null; POSTS.loaded=false; POSTS.err="";
  if(S.view==="posts") S.view="all";
  SYNC.lastPull="1970-01-01T00:00:00Z";
  keepSession(); paintSync(); render();
}

/* ---- change detection ----
   The app mutates S.items freely and calls save(). Rather than ask every
   mutation site to declare what it touched, compare against a shadow copy of
   what the server last saw. Cheap at this scale, and impossible to forget. */
/* A fingerprint of a record, not the record.

   The shadow existed to answer one question — has this changed since the
   server last saw it — and it answered it by keeping a complete second copy
   of every note, base64 photographs and all, in the same five megabytes as
   the library itself. Two copies of everything, plus a history log, against
   a cap that a few dozen photographs will reach on their own.

   A length and a hash answer the same question in twenty bytes. */
function sig(o){
  /* Hashing two megabytes of base64 on every keystroke is a poor use of a
     laptop, and pointless: a photograph never changes once it is added, so
     its key says everything its bytes would. Parse a legacy shadow string
     first, or the same record would fingerprint two different ways. */
  if(typeof o==="string"){
    try{ o=JSON.parse(o) }catch(e){ return o.length+":"+hash32(o) }
  }
  var s=JSON.stringify(o&&o.photos?slimPhotos([o])[0]:o);
  return s.length+":"+hash32(s);
}

function stampChanges(){
  if(!SYNC.on) return;
  var seen={};
  S.items.forEach(function(i){
    seen[i.id]=1;
    if(SYNC.shadow[i.id]!==sig(i)) SYNC.queue[i.id]="put";
  });
  Object.keys(SYNC.shadow).forEach(function(id){
    if(!seen[id]) SYNC.queue[id]="del";
  });
  keepSession();
  schedulePush();
}
function schedulePush(){
  if(!SYNC.on||!SYNC.session) { paintSync(); return }
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(pushChanges,1200);   // let a burst of edits settle
  paintSync();
}

/* ---- push ---- */
function pushChanges(){
  if(!SYNC.on||!SYNC.session) return Promise.resolve();
  /* Uploading before the first pull of the session means uploading a picture
     of the world as it was when this tab was last open. Anything queued can
     wait a second; overwriting a newer copy cannot be undone. */
  if(!SYNC.pulledOnce){ schedulePush(); return Promise.resolve() }
  var ids=Object.keys(SYNC.queue);
  if(!ids.length){ SYNC.status="idle"; paintSync(); return Promise.resolve() }

  var byId={};
  S.items.forEach(function(i){ byId[i.id]=i });
  var rows=ids.map(function(id){
    if(SYNC.queue[id]==="del"||!byId[id]) return { id:id, data:{}, deleted:true };
    return { id:id, data:byId[id], deleted:false };
  });

  SYNC.status="busy"; paintSync();
  return withFreshSession().then(function(){
    return fetch(SUPA.url+"/rest/v1/items?on_conflict=id",{
      method:"POST",
      headers:Object.assign(supaHeaders(true),{ "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body:JSON.stringify(rows)
    });
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    rows.forEach(function(row){
      if(row.deleted) delete SYNC.shadow[row.id];
      else SYNC.shadow[row.id]=sig(row.data);
      delete SYNC.queue[row.id];
    });
    SYNC.status="idle"; SYNC.note=""; keepSession(); paintSync();
  }).catch(function(e){
    // keep the queue; it'll go up on the next attempt
    SYNC.status=navigator.onLine?"error":"offline";
    SYNC.note=String(e&&e.message||e);
    paintSync();
  });
}

/* ---- pull ---- */
function pullChanges(){
  if(!SYNC.on||!SYNC.session) return Promise.resolve();
  SYNC.status="busy"; paintSync();
  return withFreshSession().then(function(){
    var q="/rest/v1/items?select=id,data,modified,deleted"
      +"&modified=gt."+encodeURIComponent(SYNC.lastPull)
      +"&order=modified.asc";
    return fetch(SUPA.url+q,{ headers:supaHeaders(true) });
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(rows){
    if(rows.length) applyIncoming(rows);   // which advances lastPull itself,
    SYNC.pulledOnce=true;                  // only as far as it actually got
    SYNC.status="idle"; SYNC.note=""; keepSession(); paintSync();
    return rows.length;
  }).catch(function(e){
    SYNC.status=navigator.onLine?"error":"offline";
    SYNC.note=String(e&&e.message||e);
    paintSync();
  });
}

/* Merge rule: the later edit wins, per item, judged by the app's own
   `modified` stamp rather than the server's. The server clock says when a row
   arrived; the item's own stamp says when a person actually changed it. */
/* =========================================================================
   MERGING — the rule is that nothing is ever discarded silently.

   The version this replaces lost work in three ways, and they compounded:

   1. A row arriving while its note was open in the editor was skipped, and
      lastPull was advanced past it anyway. The newer copy was never applied
      and never offered again. Editing that note later stamped the OLD text
      with a NEW time, pushed it, and the newer version on the server was
      overwritten. That is a note reverting to how it was an hour ago.

   2. The shadow — our record of what the server holds — was written even
      when the row was rejected, so the two disagreed afterwards.

   3. Everything hung on `modified`, a client clock. A device running a few
      minutes slow silently loses every conflict it takes part in.

   What follows keeps last-write-wins, because for one person on three
   devices it is almost always right. What it adds is that the loser of any
   conflict is written to a local history first, so "almost always" stops
   being a synonym for "sometimes your afternoon is gone".
   ========================================================================= */
function applyIncoming(rows){
  var byId={}, changed=0, deferred=false, safeUpto=SYNC.lastPull;
  S.items.forEach(function(i,ix){ byId[i.id]=ix });
  function rebuildIndex(){ byId={}; S.items.forEach(function(i,ix){ byId[i.id]=ix }) }

  rows.forEach(function(row){
    var ix=byId[row.id], here=ix!==undefined?S.items[ix]:null;

    /* Rows arrive oldest first. Once one is held back, nothing after it may
       be marked as seen either, or the next pull starts beyond a row we
       never applied. */
    if(S.editing===row.id){
      SYNC.pending[row.id]=row;
      deferred=true;
      return;
    }
    if(!deferred) safeUpto=row.modified;

    if(row.deleted){
      if(here){
        remember(here,"deleted on another device");
        S.items.splice(ix,1); rebuildIndex(); changed++;
      }
      delete SYNC.shadow[row.id];
      return;
    }

    /* normalizeItem fills in every field, so an empty payload becomes a
       perfectly formed note containing nothing — which is how a blank card
       appears in Notes out of nowhere. A row with no id in its data is not
       a note; it is a row that went wrong. */
    if(!row.data||typeof row.data!=="object"||!row.data.id){
      SYNC.shadow[row.id]=sig(row.data||{});
      return;
    }
    var incoming=normalizeItem(row.data);
    if(!incoming) return;

    if(!here){
      /* Arrive at the top, not the bottom. Array order is the manual order,
         and the device that made this put it at the front. */
      S.items.unshift(incoming); rebuildIndex(); changed++;
      SYNC.shadow[row.id]=sig(incoming);
      return;
    }

    var mine=sig(here);
    // do we hold edits the server has not seen?
    var dirty=SYNC.shadow[row.id]!==undefined&&SYNC.shadow[row.id]!==mine;

    if(!dirty){
      // nothing of ours is at stake; take theirs
      if(sig(incoming)!==mine){
        remember(here,"replaced by a newer copy from another device");
        S.items[ix]=incoming; changed++;
      }
      SYNC.shadow[row.id]=sig(incoming);
      return;
    }

    /* Both sides moved. Someone has to win, but nobody gets erased. */
    if((incoming.modified||0)>(here.modified||0)){
      remember(here,"your edit, overtaken by a newer one elsewhere");
      S.items[ix]=incoming; changed++;
      SYNC.shadow[row.id]=sig(incoming);
      toast("A note changed on another device — your copy is in its history");
    } else {
      remember(incoming,"an older copy from another device");
      // keep ours, and make sure it goes up: the shadow must describe the
      // server, not what we wish were there
      SYNC.shadow[row.id]=sig(incoming);
      SYNC.queue[row.id]="put";
      schedulePush();
    }
  });

  SYNC.lastPull=safeUpto;

  if(changed){
    try{ localStorage.setItem(KEY,JSON.stringify(S.items)) }catch(e){}
    render();
    toast(changed+" change"+(changed===1?"":"s")+" from another device");
  }
}

/* Rows held back while you were editing, applied the moment you are done. */
function flushPending(){
  var ids=Object.keys(SYNC.pending);
  if(!ids.length) return;
  var rows=ids.map(function(k){ return SYNC.pending[k] });
  SYNC.pending={};
  applyIncoming(rows);
}

function syncNow(){
  return pullChanges().then(pushChanges);
}

/* =========================================================================
   BACKUP — the whole library as a file you own.

   Everything lives in this browser's storage, which is not a safe place for
   the only copy of anything. Export writes one plain-text .json file: every
   item, every image, every setting. Import reads it back, either merging it
   with what's here or replacing it outright.

   The format is deliberately dull and readable — a version number, a
   timestamp, a settings object and a flat array of items. Anything that can
   read JSON can read your notes, including you, in a text editor, in ten
   years, without this app.
   ========================================================================= */
var EXPORT_FORMAT="everything.library", EXPORT_VERSION=1;
var SETTING_KEYS=["trove.theme","trove.font","trove.quotes","trove.notesize",
  "trove.layouts","trove.brand","trove.grp.tasks"];

function settingsSnapshot(){
  var out={};
  SETTING_KEYS.forEach(function(k){
    try{ var v=localStorage.getItem(k); if(v!=null) out[k]=v }catch(e){}
  });
  return out;
}

// Fill in anything an older or hand-edited file is missing, so a partial
// record can never poison the app.
function normalizeItem(o){
  if(!o||typeof o!=="object") return null;
  if(o.type&&o.actionable===undefined) o=migrate([o])[0];   // a v1-era record
  var now=Date.now();
  return {
    id:String(o.id||uid()),
    title:String(o.title||""),
    body:toRich(o.body||""),
    url:String(o.url||""), image:String(o.image||""), desc:String(o.desc||""),
    logo:String(o.logo||""), site:String(o.site||""),
    metaState:o.metaState||null, titleAuto:!!o.titleAuto,
    actionable:!!o.actionable, due:(typeof o.due==="number")?o.due:null,
    timed:(o.timed!==undefined)?!!o.timed
      :!!(o.due&&(new Date(o.due).getHours()||new Date(o.due).getMinutes())),
    done:!!o.done, tint:String(o.tint||""), compiled:!!o.compiled,
    tags:Array.isArray(o.tags)?o.tags.map(String):[],
    photos:Array.isArray(o.photos)?o.photos.filter(function(p){ return p&&p.src }):[],
    checks:Array.isArray(o.checks)?o.checks.filter(function(c){ return c&&c.t })
      .map(function(c){ return {t:String(c.t),d:!!c.d} }):[],
    archived:!!o.archived,
    pin:!!o.pin,
    postId:typeof o.postId==="string"?o.postId:"",
    created:(typeof o.created==="number")?o.created:now,
    modified:(typeof o.modified==="number")?o.modified:(o.created||now)
  };
}

function exportLibrary(){
  /* If the bytes are still being read back, wait for them. An export that
     quietly omits your photographs is worse than one that takes a moment. */
  var missing=S.items.some(function(i){
    return (i.photos||[]).some(function(p){ return p&&p.k&&!p.src });
  });
  if(missing){
    toast("Collecting photographs…");
    return hydratePhotos().then(exportLibrary);
  }
  var payload={
    format:EXPORT_FORMAT,
    version:EXPORT_VERSION,
    app:document.title,
    exportedAt:new Date().toISOString(),
    itemCount:S.items.length,
    settings:settingsSnapshot(),
    items:S.items
  };
  try{
    var text=JSON.stringify(payload,null,2);
    var blob=new Blob([text],{type:"application/json"});
    var d=new Date(), pad=function(n){ return (n<10?"0":"")+n };
    var name="everything-"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".json";
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
    try{ localStorage.setItem("trove.lastExport",String(Date.now())) }catch(e){}
    paintBackupHint();
    var kb=Math.round(text.length/1024);
    toast(S.items.length+" items exported · "+(kb>1024?(kb/1024).toFixed(1)+" MB":kb+" KB"));
  }catch(e){ toast("Couldn't build the file") }
}

function applyImport(data,mode){
  var incoming=(data.items||[]).map(normalizeItem).filter(Boolean);
  if(!incoming.length) return toast("Nothing to import");

  if(mode==="replace"){
    S.items=incoming;
    // settings travel with a full replace, not with a merge
    if(data.settings){
      Object.keys(data.settings).forEach(function(k){
        if(SETTING_KEYS.indexOf(k)>=0){ try{ localStorage.setItem(k,data.settings[k]) }catch(e){} }
      });
    }
    S.sel={}; save(); render();
    toast("Replaced with "+incoming.length+" items — reload to apply settings");
    return;
  }

  // merge: unknown ids are added, known ids win on whichever was edited last
  var byId={}, added=0, updated=0;
  S.items.forEach(function(x,ix){ byId[x.id]=ix });
  incoming.forEach(function(n){
    if(byId[n.id]===undefined){ S.items.push(n); added++ }
    else{
      var cur=S.items[byId[n.id]];
      if((n.modified||0)>(cur.modified||0)){ S.items[byId[n.id]]=n; updated++ }
    }
  });
  S.sel={}; save(); render();
  toast(added+" added, "+updated+" updated"+(added+updated?"":" — nothing new"));
}

function readImportFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    var data;
    try{ data=JSON.parse(fr.result) }catch(e){ return toast("That isn't a readable .json file") }
    if(!data||!Array.isArray(data.items)) return toast("No library found in that file");
    var n=data.items.length;
    var when=data.exportedAt?new Date(data.exportedAt).toLocaleString():"an unknown date";
    askChoice("Import "+n+" item"+(n===1?"":"s"),
      "From a backup made <b>"+esc(when)+"</b>.<br><br>"
      +"<b>Merge</b> keeps everything you have now and adds what's missing. "
      +"Where both copies exist, the one edited more recently wins.<br><br>"
      +"<b>Replace</b> discards your current "+S.items.length+" items entirely.",
      [{label:"Cancel",value:null,kind:"sec"},
       {label:"Replace",value:"replace",kind:"dan"},
       {label:"Merge",value:"merge"}],
      function(mode){
        if(!mode) return;
        if(mode!=="replace") return applyImport(data,mode);
        askChoice("Discard the "+S.items.length+" items here?",
          "Replacing throws away everything currently in the app and puts the "
          +"backup in its place. There is no undo.",
          [{label:"Cancel",value:false,kind:"sec"},{label:"Replace",value:true,kind:"dan"}],
          function(go){ if(go) applyImport(data,"replace") });
      });
  };
  fr.onerror=function(){ toast("Couldn't read that file") };
  fr.readAsText(file);
}

function paintBackupHint(){
  var el=document.getElementById("bkhint");
  if(!el) return;
  var last=0;
  try{ last=parseInt(localStorage.getItem("trove.lastExport")||"0",10) }catch(e){}
  if(!S.items.length){ el.textContent=""; el.className="bkhint"; return }
  if(!last){ el.textContent="Never backed up"; el.className="bkhint warn"; return }
  var days=Math.floor((Date.now()-last)/864e5);
  el.textContent = days<1 ? "Backed up today"
    : "Backed up "+days+" day"+(days===1?"":"s")+" ago";
  el.className="bkhint"+(days>=7?" warn":"");
}

/* =========================================================================
   COMPILE — turn the page you're looking at into one document.

   Each link becomes a paragraph of your own writing about it, with its key
   phrase hyperlinked back to the source. The phrase is the item's title: if
   it appears in what you wrote, the link is applied in place; otherwise the
   title leads the paragraph. Output as a note here, or a .doc you can open
   in Word or Pages with the links intact.
   ========================================================================= */

// Wrap the first plain-text occurrence of `phrase` in an anchor. Works on the
// DOM so it can't break tags, and won't touch text already inside a link.
function linkPhrase(html,phrase,url){
  if(!phrase) return null;
  var box=document.createElement("div");
  box.innerHTML=html;
  var found=null;
  (function walk(node){
    if(found) return;
    for(var k=0;k<node.childNodes.length;k++){
      var n=node.childNodes[k];
      if(found) return;
      if(n.nodeType===3){
        var at=n.data.indexOf(phrase);
        if(at>=0){ found={node:n,at:at}; return }
      } else if(n.nodeType===1 && n.tagName!=="A"){
        walk(n);
      }
    }
  })(box);
  if(!found) return null;
  var t=found.node, tail=t.splitText(found.at);
  tail.splitText(phrase.length);
  var a=document.createElement("a");
  a.setAttribute("href",url);
  a.setAttribute("target","_blank");
  a.setAttribute("rel","noopener noreferrer");
  tail.parentNode.insertBefore(a,tail);
  a.appendChild(tail);
  return box.innerHTML;
}

function compileEntry(i){
  var label=(i.title||host(i.url)||i.url).trim();
  var anchor='<a href="'+esc(i.url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>';
  var body=sanitizeRich(i.body||"");
  if(body){
    var inPlace=linkPhrase(body,label,i.url);
    if(inPlace) return inPlace;             // your sentence, with the link inside it
    return anchor+" — "+body;               // otherwise the title leads
  }
  return anchor+(i.desc?"<br>"+esc(i.desc):"");
}

function compileList(){
  return visible().filter(hasLink);
}
function compileBody(list){
  return list.map(function(i){ return compileEntry(i) }).join("<br><br>");
}
function compileTitle(){
  var lens=(LENS[S.view]||LENS.all).title;
  var scope=S.q?'"'+S.q+'"':(S.tag?"#"+S.tag:lens);
  return scope+" — "+new Date().toLocaleDateString([], {day:"numeric",month:"long",year:"numeric"});
}

function compileToNote(){
  var list=compileList();
  if(!list.length) return toast("No links on this page");
  var now=Date.now();
  var item={id:uid(),title:compileTitle(),body:sanitizeRich(compileBody(list)),
    url:"",image:"",desc:"",logo:"",site:"",metaState:null,titleAuto:false,
    actionable:false,due:null,done:false,tint:"doc",compiled:true,tags:[],photos:[],
    checks:[],archived:false,pin:false,created:now,modified:now};
  S.items.unshift(item);
  S.view="notes"; S.tag=null; S.q=""; document.getElementById("q").value="";
  save(); render();
  toast(list.length+" links compiled into a note");
  setTimeout(function(){ openEditor(item.id) },120);
}

function compileToDoc(){
  var list=compileList();
  if(!list.length) return toast("No links on this page");
  var title=compileTitle();
  var doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" '
    +'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    +'<head><meta charset="utf-8"><title>'+esc(title)+'</title></head><body>'
    +'<h1 style="font-family:Georgia,serif">'+esc(title)+'</h1>'
    +list.map(function(i){
      return '<p style="font-family:Georgia,serif;font-size:12pt;line-height:1.5">'
        +compileEntry(i)+'</p>';
    }).join("")
    +'</body></html>';
  try{
    var blob=new Blob(["﻿"+doc],{type:"application/msword"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=title.replace(/[\/\\:*?"<>|]/g,"-")+".doc";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
    toast(list.length+" links exported");
  }catch(e){ toast("Couldn't build the file") }
}

/* =========================================================================
   CAPTURE
   ========================================================================= */
var capin=document.getElementById("capin"), capmeta=document.getElementById("capmeta"),
    caphint=document.getElementById("caphint"), capicon=document.getElementById("capicon");

// the capture icon is drawn from the same set as the sidebar, so what you're
// about to make is announced in the app's own hand
var CAPI={
  note:'<svg viewBox="0 0 24 24"><path d="M4.5 19.5h15"/>'
    +'<path d="M15.6 4.9a2.1 2.1 0 0 1 3 3L9.4 17.1l-4 1 1-4z"/></svg>',
  link:'<svg viewBox="0 0 24 24"><path d="M10.2 13.8a3.9 3.9 0 0 0 5.6 0l2.5-2.5a3.9 3.9 0 1 0-5.6-5.6l-1 1"/>'
    +'<path d="M13.8 10.2a3.9 3.9 0 0 0-5.6 0l-2.5 2.5a3.9 3.9 0 1 0 5.6 5.6l1-1"/></svg>',
  task:'<svg viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/>'
    +'<path d="M8.2 12.3l2.7 2.7 5-5.4"/></svg>'
};

/* null = let the text decide; true/false = you've overridden it by clicking
   the task chip or pressing ⌘↵. Cleared after every save. */
var capForce=null;
function capActionable(p){ return capForce===null ? p.actionable : capForce }

/* A note is content; a link or a task is a labelled object. So text typed
   for a note becomes the note itself rather than a heading with nothing
   underneath it. Links and tasks keep the text as their label. */
function shapeCapture(p,actionable){
  if(p.url||actionable) return {title:p.title, body:toRich(p.body), checks:[]};

  var whole=p.title+(p.body?"\n"+p.body:"");
  // Paste a list and get a list: if two or more lines after the first are
  // bulleted, they become checklist items and the first line is the title.
  var lines=whole.split(/\r?\n/);
  if(lines.length>2){
    var rest=lines.slice(1).filter(function(l){ return l.trim() });
    var bullets=rest.filter(function(l){ return /^\s*[-*·•]\s+/.test(l) });
    if(bullets.length>=2 && bullets.length===rest.length){
      return {
        title:lines[0].trim(),
        body:"",
        checks:rest.map(function(l){ return {t:l.replace(/^\s*[-*·•]\s+/,"").trim(),d:false} })
      };
    }
  }
  return {title:"", body:toRich(whole), checks:[]};
}

function refreshCap(){
  capin.style.height="auto";
  capin.style.height=Math.min(capin.scrollHeight,180)+"px";
  if(!capin.value.trim()){ capmeta.classList.add("hide"); capicon.innerHTML=CAPI.note; return }
  capmeta.classList.remove("hide");
  var p=parse(capin.value), act=capActionable(p);
  capicon.innerHTML = act?CAPI.task : p.url?CAPI.link : CAPI.note;
  var bits=['<span class="chip">✎ note</span>'];
  if(p.url) bits.push('<span class="chip blue">⚭ link</span>');
  // this chip is a switch, not a readout — click it to force a checkbox on or off
  bits.push('<button class="chip tog'+(act?" acc":"")+'" id="cap-act" '
    +'title="'+(act?"Remove the checkbox":"Give this a checkbox")+'">☑ task</button>');
  if(p.due!=null) bits.push('<span class="chip '+(dueClass(p.due)==="past"?"red":"green")+'">◔ '+fmtDue(p.due,p.timed)+'</span>');
  else if(act) bits.push('<span class="chip">◇ Someday</span>');
  p.tags.forEach(function(t){ bits.push('<span class="chip">#'+esc(t)+'</span>') });
  bits.push('<span class="hint" style="margin-left:4px"><kbd>↵</kbd> save · '
    +'<kbd>⇧↵</kbd> new line · <kbd>⌘↵</kbd> as task</span>');
  caphint.innerHTML=bits.join(" ");
  var tog=document.getElementById("cap-act");
  if(tog) tog.addEventListener("click",function(){ capForce=!act; refreshCap(); capin.focus() });
}
/* After saving, stay put if the current lens can show the new item; otherwise
   follow it to a lens that can. Saving a link from Links keeps you in Links;
   jotting a note there moves you to Notes rather than filing it out of sight. */
function followItem(item){
  if(S.tag && (item.tags||[]).indexOf(S.tag)<0) S.tag=null;
  if(S.q){ S.q=""; document.getElementById("q").value="" }
  var lens=LENS[S.view];
  if(S.tag) return;
  if(!lens || !lens.test(item)) S.view=homeLens(item);
}

function commit(asTask){
  if(!capin.value.trim()) return;
  var p=parse(capin.value), now=Date.now();
  var act=(asTask===true)?true:capActionable(p);
  var shape=shapeCapture(p,act);
  var item={id:uid(),title:shape.title,body:shape.body,url:p.url,image:"",desc:"",logo:"",site:"",
    metaState:null,titleAuto:p.titleAuto,actionable:act,due:p.due,timed:!!p.timed,done:false,
    tint:"",tags:p.tags,photos:[],checks:shape.checks,archived:false,pin:false,created:now,modified:now};
  S.items.unshift(item);
  capin.value=""; capForce=null; refreshCap(); save();
  var names=[]; if(p.url) names.push("Links"); if(act) names.push("Tasks");
  if(!names.length) names.push("Notes");
  followItem(item);
  if(item.url) fetchMeta(item); else render();
  toast("Saved · "+names.join(" + "));
}
capin.addEventListener("input",refreshCap);
capin.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); commit(true); return }
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); commit() }
  if(e.key==="Escape"){ capin.value=""; capForce=null; refreshCap(); capin.blur() }
});
document.getElementById("capsave").addEventListener("click",commit);

/* =========================================================================
   EDITOR — facet toggles instead of a type picker
   ========================================================================= */
var scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet");

// the open note wears its own colour, so editing feels like the same object
function applySheetTint(tint){ sheet.className="sheet"+(tint?" tint-"+tint:"") }

function openEditor(id){
  var i=S.items.filter(function(x){return x.id===id})[0]; if(!i) return;
  var d={url:i.url||"",actionable:hasAction(i),due:i.due,timed:!!i.timed,tint:i.tint||"",pin:!!i.pin};

  S.editing=id;
  // Read-only context from the fetched page, so the window works for reading too
  var ctx="";
  if(i.url){
    ctx='<div class="readctx">'+(i.desc?esc(i.desc)+'<br>':"")
      +'<a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.site||host(i.url)||i.url)+' ↗</a></div>';
  }

  sheet.innerHTML=
    '<div class="egal" id="e-gal">'+photoGrid(i,true)+'</div>'
    +'<input class="etitle" id="e-title" placeholder="Title" value="'+esc(i.title)+'">'

  scrim.classList.add("on");

  function q(s){ return sheet.querySelector(s) }

  // Real formatting. The browser applies bold/italic to the selection directly;
  // ⌘B and ⌘I are handled natively, the buttons drive the same command.
  var body=q("#e-body");

  function countWords(){
    var n=words(richToText(body.innerHTML));
    q("#e-wc").textContent = n ? n.toLocaleString()+" word"+(n===1?"":"s") : "";
  }
  /* Browsers don't reliably scroll a contenteditable caret into view, and the
     sticky action bar covers the bottom of the sheet — so a long note left the
     cursor underneath it. Nudge the sheet whenever the caret leaves the frame. */
  /* Finding the caret's position on screen. A collapsed range on a freshly
     created empty line reports no rectangle at all — the old code then fell
     back to the containing element, which on an empty line is the whole note
     body. Its top is near the start of the note, so pressing Enter mid-way
     through a long note flung the view to the top. The fallback is now only
     trusted if it's the size of a line rather than the size of the note. */
  function caretRect(){
    var sel=window.getSelection();
    if(!sel||!sel.rangeCount) return null;
    var r=sel.getRangeAt(0).cloneRange();
    r.collapse(true);
    var rect=r.getClientRects()[0];
    if(rect&&rect.height) return rect;
    var node=r.startContainer;
    var el=(node&&node.nodeType===1)?node:(node&&node.parentNode);
    if(el&&el.getBoundingClientRect){
      var er=el.getBoundingClientRect();
      if(er.height&&er.height<=120) return er;      // a line, not the whole body
    }
    return null;
  }
  function keepCaretVisible(allowUp){
    var rect=caretRect();
    if(!rect) return;
    var box=sheet.getBoundingClientRect(), pad=118;   // room for the pinned bars
    if(rect.bottom>box.bottom-pad) sheet.scrollTop+=rect.bottom-(box.bottom-pad)+28;
    else if(allowUp&&rect.top<box.top+16) sheet.scrollTop-=box.top+16-rect.top+28;
  }
  countWords();
  // typing only ever pushes the view down; never yank it upwards mid-sentence
  body.addEventListener("input",function(){ countWords(); keepCaretVisible(false) });
  body.addEventListener("keyup",function(e){

  function syncFmtButtons(){

  function linkSelection(){
    var sel=window.getSelection();
    if(!sel||sel.isCollapsed) return toast("Select some text first");
    // hold the selection — opening the dialog moves focus away from it
    var saved=sel.getRangeAt(0).cloneRange();
    var shown=saved.toString().slice(0,60);
    askText("Link “"+shown+"”","Where should this text point?","https://","Link",
      function(v){
        var url=String(v).trim();
        if(!url) return;
        if(!/^[a-z]+:/i.test(url)) url="https://"+url;
        if(!SAFE_HREF.test(url)) return toast("Only web and mail links");
        body.focus();
        var s2=window.getSelection();
        s2.removeAllRanges(); s2.addRange(saved);      // put it back, then link it
        try{ document.execCommand("createLink",false,url) }catch(err){}
        countWords();
      });
  }

  var draftChecks=(i.checks||[]).map(function(c){ return {t:c.t,d:!!c.d} });

  function readChecks(){

  /* ---- date picker ---- */

  /* A time is opt-in. Adding a date no longer invents 9am — a task can sit on
     a day without claiming an hour, and a time can be taken off again. */
  function paintTime(){
    var slot=q("#e-tslot");
    if(d.due==null){ slot.innerHTML='<span class="hint">Pick a date first</span>'; return }
    if(!d.timed){
      slot.innerHTML='<button class="dquickadd" id="e-addtime">＋ Add a time</button>';
      return;
    }
    var dt=new Date(d.due), hh="", mm="";
    for(var a=0;a<24;a++) hh+='<option value="'+a+'"'+(a===dt.getHours()?" selected":"")+'>'+(a<10?"0":"")+a+'</option>';
    var cur=Math.round(dt.getMinutes()/5)*5%60;
    for(var b=0;b<60;b+=5) mm+='<option value="'+b+'"'+(b===cur?" selected":"")+'>'+(b<10?"0":"")+b+'</option>';
    slot.innerHTML='<select id="e-dh">'+hh+'</select><b>:</b><select id="e-dm">'+mm+'</select>'
      +'<button class="dquickadd" id="e-rmtime" title="Remove the time">✕ time</button>';
  }

  function paintGrid(){
    q("#e-dmon").textContent=MON[viewM.getMonth()]+" "+viewM.getFullYear();
    var first=new Date(viewM.getFullYear(),viewM.getMonth(),1);
    var lead=(first.getDay()+6)%7;                       // weeks start Monday
    var days=new Date(viewM.getFullYear(),viewM.getMonth()+1,0).getDate();
    var html=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
      .map(function(x){ return '<div class="dow">'+x.charAt(0)+'</div>' }).join("");
    var k;
    for(k=0;k<lead;k++) html+='<button class="dim" data-prev="1"></button>';
    for(k=1;k<=days;k++){
      var ts=new Date(viewM.getFullYear(),viewM.getMonth(),k).getTime();
      var cls=[];
      if(dayOf(ts)===todayKey()) cls.push("today");
      if(d.due!=null&&dayOf(d.due)===dayOf(ts)) cls.push("sel");
      html+='<button class="'+cls.join(" ")+'" data-day="'+k+'">'+k+'</button>';
    }

  function setDay(dt){

    var day=e.target.closest("[data-day]");

  /* Archiving from here writes your edits first, so you never lose a change
